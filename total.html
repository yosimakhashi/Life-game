<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141210">
<title>Total</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141210;
    --surface: #1e1b17;
    --fg: #f4efe6;
    --muted: #a3988c;
    --accent: #e0a15a;
    --line: #3a342c;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  main {
    max-width: 32rem;
    margin: 0 auto;
    min-height: 100vh;
    padding: 1.25rem 1rem 8.5rem;
  }
  .eyebrow {
    margin: 0;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .frame {
    margin-top: 0.75rem;
    height: 6in;
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 1.25rem;
    background: var(--surface);
    box-shadow: 0 18px 40px rgb(0 0 0 / 0.35);
    position: relative;
    overflow: hidden;
  }
  .frame.adjusting { touch-action: none; border-color: var(--accent); }
  #pic {
    position: absolute;
    max-width: none;
    user-select: none;
    -webkit-user-drag: none;
    touch-action: none;
  }
  .empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .hit {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    font-size: 16px;
  }
  .dock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 3;
    background: var(--bg);
    border-top: 1px solid var(--line);
    padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom));
  }
  .dock-inner { max-width: 32rem; margin: 0 auto; }
  .tools { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .pill {
    position: relative;
    overflow: hidden;
    min-height: 2.75rem;
    padding: 0 0.9rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--fg);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .pill:active { transform: scale(0.97); }
  .pill.primary { border-color: var(--accent); color: var(--accent); }
  .row {
    margin-top: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }
  h1 {
    margin: 0;
    font-family: Fraunces, Georgia, serif;
    font-weight: 500;
    font-size: 1.875rem;
  }
  .controls { display: flex; align-items: center; gap: 0.5rem; }
  .step {
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    font-size: 1.4rem;
    line-height: 1;
  }
  .step:active { transform: scale(0.95); }
  #total {
    width: 6rem;
    background: transparent;
    border: 0;
    color: var(--accent);
    text-align: center;
    font-family: Fraunces, Georgia, serif;
    font-size: 2.25rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  #total:focus { outline: none; }
  .hint { margin: 0.5rem 0 0; color: var(--muted); font-size: 0.875rem; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Frame</p>
  <div class="frame" id="frame">
    <img id="pic" alt="" hidden>
    <label class="empty" id="empty">
      Tap to place a photo
      <input class="hit" id="file" type="file" accept="image/*">
    </label>
  </div>
</main>
<div class="dock">
  <div class="dock-inner">
    <div class="tools" id="tools" hidden>
      <label class="pill">Change
        <input class="hit" id="file2" type="file" accept="image/*">
      </label>
      <button class="pill" id="adjust" type="button">Adjust</button>
      <button class="pill" id="remove" type="button">Remove</button>
    </div>
    <div class="tools" id="cropTools" hidden>
      <button class="pill" id="zoomOut" type="button" aria-label="Zoom out">−</button>
      <button class="pill" id="zoomIn" type="button" aria-label="Zoom in">+</button>
      <button class="pill" id="fit" type="button">Fit</button>
      <button class="pill primary" id="done" type="button">Done</button>
    </div>
    <section class="row">
      <h1>Total</h1>
      <div class="controls">
        <button class="step" id="down" type="button" aria-label="Decrease total">−</button>
        <input id="total" aria-label="Total" inputmode="decimal" value="0">
        <button class="step" id="up" type="button" aria-label="Increase total">+</button>
      </div>
    </section>
    <p class="hint" id="hint">Tap the frame to add a photo.</p>
  </div>
</div>
<script>
const KEY = "photo-total-v1";
const frame = document.getElementById("frame");
const pic = document.getElementById("pic");
const hint = document.getElementById("hint");
const tools = document.getElementById("tools");
const cropTools = document.getElementById("cropTools");
const totalInput = document.getElementById("total");

let photo = null;
let total = 0;
let view = { scale: 1, x: 0, y: 0 };
let adjusting = false;
const pts = new Map();
let gesture = null;

function clampScale(n) {
  return Math.min(5, Math.max(1, n));
}

function layout() {
  if (!photo || !pic.naturalWidth) return;
  const fw = frame.clientWidth;
  const fh = frame.clientHeight;
  const fit = Math.min(fw / pic.naturalWidth, fh / pic.naturalHeight);
  const w = pic.naturalWidth * fit * view.scale;
  const h = pic.naturalHeight * fit * view.scale;
  pic.style.width = w + "px";
  pic.style.height = h + "px";
  pic.style.left = ((fw - w) / 2 + view.x) + "px";
  pic.style.top = ((fh - h) / 2 + view.y) + "px";
}

function show() {
  const has = Boolean(photo);
  pic.hidden = !has;
  document.getElementById("empty").hidden = has;
  tools.hidden = !has || adjusting;
  cropTools.hidden = !has || !adjusting;
  frame.classList.toggle("adjusting", adjusting && has);
  if (has && pic.src !== photo) pic.src = photo;
  hint.textContent = !has
    ? "Tap the frame to add a photo."
    : adjusting
      ? "Drag the photo. Pinch or use + and − to crop. Fit shows all of it."
      : "Adjust to move or crop. The number stays under Total.";
  layout();
}

function idb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("photo-total", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("kv");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbPut(key, value) {
  const db = await idb();
  await new Promise((resolve, reject) => {
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").put(value, key);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

async function idbGet(key) {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("kv", "readonly");
    const req = tx.objectStore("kv").get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ total, view }));
  } catch (err) {
    hint.textContent = "The number could not be saved on this phone.";
  }
  try {
    await idbPut("photo", photo);
  } catch (err) {
    hint.textContent = "The photo is showing, but this phone would not store it.";
  }
}

async function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (typeof data.total === "number" && Number.isFinite(data.total)) {
        total = data.total;
        totalInput.value = formatNumber(total);
      }
      if (typeof data.photo === "string") photo = data.photo;
      if (data.view && typeof data.view.scale === "number") {
        view = {
          scale: clampScale(data.view.scale),
          x: Number(data.view.x) || 0,
          y: Number(data.view.y) || 0
        };
      }
    }
  } catch (err) {}
  try {
    const stored = await idbGet("photo");
    if (typeof stored === "string") photo = stored;
  } catch (err) {}
  show();
}

function readFile(fileObj) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result));
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(fileObj);
  });
}

function canvasShrink(fileObj) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(fileObj);
    const img = new Image();
    img.onload = () => {
      const max = 1200;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      if (!ctx) { URL.revokeObjectURL(url); reject(new Error("canvas")); return; }
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      try { resolve(canvas.toDataURL("image/jpeg", 0.82)); }
      catch (err) { reject(err); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); };
    img.src = url;
  });
}

function isImage(fileObj) {
  return !fileObj.type || fileObj.type.startsWith("image/") || /\.(jpe?g|png|gif|webp|heic|heif)$/i.test(fileObj.name);
}

async function useFile(fileObj) {
  if (!fileObj) return;
  if (!isImage(fileObj)) {
    hint.textContent = "That file isn’t a photo.";
    return;
  }
  try {
    try { photo = await canvasShrink(fileObj); }
    catch (err) { photo = await readFile(fileObj); }
    view = { scale: 1, x: 0, y: 0 };
    adjusting = false;
    show();
    await save();
  } catch (err) {
    hint.textContent = "Couldn’t open that photo. Try another one.";
  }
}

document.getElementById("file").addEventListener("change", (e) => useFile(e.target.files && e.target.files[0]));
document.getElementById("file2").addEventListener("change", (e) => useFile(e.target.files && e.target.files[0]));

document.getElementById("adjust").addEventListener("click", () => {
  if (!photo) return;
  adjusting = true;
  show();
});
document.getElementById("done").addEventListener("click", () => {
  adjusting = false;
  show();
  save();
});
document.getElementById("fit").addEventListener("click", () => {
  view = { scale: 1, x: 0, y: 0 };
  layout();
  save();
});
function zoomBy(factor) {
  view.scale = clampScale(view.scale * factor);
  layout();
  save();
}
document.getElementById("zoomIn").addEventListener("click", () => zoomBy(1.2));
document.getElementById("zoomOut").addEventListener("click", () => zoomBy(1 / 1.2));
document.getElementById("remove").addEventListener("click", () => {
  photo = null;
  view = { scale: 1, x: 0, y: 0 };
  adjusting = false;
  pic.removeAttribute("src");
  show();
  save();
});

pic.addEventListener("load", layout);
window.addEventListener("resize", layout);

frame.addEventListener("pointerdown", (e) => {
  if (!adjusting || !photo || e.target.closest("input")) return;
  frame.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1) {
    gesture = { type: "pan", x: view.x, y: view.y, px: e.clientX, py: e.clientY };
  } else {
    const [a, b] = [...pts.values()];
    gesture = {
      type: "pinch",
      dist: Math.hypot(a.x - b.x, a.y - b.y) || 1,
      scale: view.scale,
      x: view.x,
      y: view.y,
      mx: (a.x + b.x) / 2,
      my: (a.y + b.y) / 2
    };
  }
});

frame.addEventListener("pointermove", (e) => {
  if (!pts.has(e.pointerId) || !gesture) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1 && gesture.type === "pan") {
    view.x = gesture.x + (e.clientX - gesture.px);
    view.y = gesture.y + (e.clientY - gesture.py);
    layout();
    return;
  }
  if (pts.size < 2) return;
  const [a, b] = [...pts.values()];
  const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
  const mx = (a.x + b.x) / 2;
  const my = (a.y + b.y) / 2;
  if (gesture.type !== "pinch") {
    gesture = { type: "pinch", dist, scale: view.scale, x: view.x, y: view.y, mx, my };
  }
  view.scale = clampScale(gesture.scale * (dist / gesture.dist));
  view.x = gesture.x + (mx - gesture.mx);
  view.y = gesture.y + (my - gesture.my);
  layout();
});

function endPointer(e) {
  pts.delete(e.pointerId);
  if (pts.size === 0) {
    gesture = null;
    if (adjusting) save();
  } else if (pts.size === 1) {
    const left = [...pts.values()][0];
    gesture = { type: "pan", x: view.x, y: view.y, px: left.x, py: left.y };
  }
}
frame.addEventListener("pointerup", endPointer);
frame.addEventListener("pointercancel", endPointer);

function formatNumber(n) {
  return Number.isInteger(n) ? String(n) : String(Math.round(n * 1000) / 1000);
}
totalInput.addEventListener("input", () => {
  const next = totalInput.value;
  if (!/^-?\d*\.?\d*$/.test(next)) {
    totalInput.value = formatNumber(total);
    return;
  }
  if (next === "" || next === "-" || next === "." || next === "-.") return;
  const n = Number(next);
  if (Number.isFinite(n)) total = n;
});
totalInput.addEventListener("blur", () => {
  const raw = totalInput.value;
  if (raw === "" || raw === "-" || raw === "." || raw === "-.") total = 0;
  else {
    const n = Number(raw);
    if (Number.isFinite(n)) total = n;
  }
  totalInput.value = formatNumber(total);
  save();
});
function step(delta) {
  total = Math.round((total + delta) * 1000) / 1000;
  totalInput.value = formatNumber(total);
  save();
}
document.getElementById("up").addEventListener("click", () => step(1));
document.getElementById("down").addEventListener("click", () => step(-1));

load();
</script>
</body>
</html>
