<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14121a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Sound">
<title>Daily Sound</title>
<style>
/* Daily Sound: one new taste of music every day.
   One file, no network calls. The day's genre comes from a seeded shuffle of
   GENRES keyed by the date, so everyone gets the same pick on the same day and
   no genre repeats until the whole list has been used. Personal state (swaps,
   reactions, listened days) lives in localStorage under KEY. */
:root {
    --bg: #f4f1ec; --card: #fffdf9; --ink: #1d1a22; --dim: #6b6573; --line: #e0dad1;
    --soft: #ece7df; --good: #1f8a5b; --bad: #b8433d;
    --h: 280; /* genre hue, set per pick */
    --accent: hsl(var(--h) 55% 42%); --accent-soft: hsl(var(--h) 60% 93%); --accent-ink: #fff;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #14121a; --card: #1d1a24; --ink: #ece8f0; --dim: #9a93a5; --line: #2f2a38;
        --soft: #262230; --good: #5fd39a; --bad: #f0827b;
        --accent: hsl(var(--h) 70% 70%); --accent-soft: hsl(var(--h) 30% 20%); --accent-ink: #14121a;
    }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; }
h1, h2, h3 { font-family: 'Iowan Old Style', Palatino, 'Palatino Linotype', Georgia, serif; font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
a { color: var(--accent); }
.wrap { max-width: 540px; margin: 0 auto; padding: 18px 16px calc(40px + env(safe-area-inset-bottom)); }
.top { display: flex; justify-content: space-between; align-items: center; }
.home-link { font-size: 14px; color: var(--dim); text-decoration: none; }
.streak { font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; }
.streak b { color: var(--ink); }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.dim { color: var(--dim); } .small { font-size: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-top: 14px; }

/* hero: spinning record tinted with the genre's hue */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; margin-top: 18px; }
.hero h1 { font-size: 34px; margin-top: 4px; }
.meta { margin-top: 6px; color: var(--dim); font-size: 14px; }
.disc { width: 96px; height: 96px; border-radius: 50%; flex: none; position: relative;
    background:
        radial-gradient(circle, var(--bg) 0 5%, hsl(var(--h) 65% 55%) 5.5% 26%, #111 26.5% 28%, transparent 28.5%),
        repeating-radial-gradient(circle, #1b1b1f 0 2px, #2a2a30 2px 3px);
    box-shadow: 0 6px 20px hsl(var(--h) 50% 30% / .35);
    animation: spin 6s linear infinite; animation-play-state: paused; }
.disc.on { animation-play-state: running; }
.disc::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(135deg, rgba(255,255,255,.18), transparent 45%); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .disc { animation: none; } }

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tag { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.blurb { margin-top: 14px; font-size: 17px; }
.when { margin-top: 10px; font-size: 14px; color: var(--dim); }
.when b { color: var(--ink); font-weight: 600; }

/* tracks */
.tracks { list-style: none; margin: 10px 0 0; padding: 0; }
.tracks li { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.tracks li:first-child { border-top: 0; }
.num { font-family: Georgia, serif; font-size: 20px; color: var(--accent); text-align: center; }
/* in-page 30s previews */
.pp { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 700; display: grid; place-items: center; }
.pp:active { transform: scale(.94); }
li.playing .pp { background: var(--accent); color: var(--accent-ink); }
li.loading .pp { animation: pulse 1s ease-in-out infinite; }
li.none .pp { opacity: .4; }
@keyframes pulse { 50% { opacity: .45; } }
.bar { height: 3px; border-radius: 99px; background: var(--soft); margin-top: 6px; overflow: hidden; display: none; }
li.playing .bar, li.paused .bar { display: block; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.status { font-size: 12px; color: var(--accent); font-weight: 600; }
li.none .status { color: var(--dim); }
.note { font-size: 13px; color: var(--dim); margin-top: 10px; }
.song { font-weight: 600; line-height: 1.3; }
.artist { font-size: 14px; color: var(--dim); }
.links { display: flex; gap: 6px; }
.links a { font-size: 12px; font-weight: 700; text-decoration: none; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
.links a:active { transform: scale(.96); }
.mix { display: flex; gap: 8px; margin-top: 12px; }
.btn { display: block; flex: 1; padding: 13px 14px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 650; text-align: center; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn:active { transform: scale(.98); }

/* reactions */
.react { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.react button { padding: 12px 4px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; font-weight: 600; }
.react button span { display: block; font-size: 20px; line-height: 1.2; }
.react button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.react button.on.bad { border-color: var(--bad); color: var(--bad); background: transparent; }

/* mood steering */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chips button { padding: 8px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; }
.chips button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* history + favourites */
.hist { list-style: none; margin: 8px 0 0; padding: 0; }
.hist li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.hist li:first-child { border-top: 0; }
.dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.hist .name { font-weight: 600; flex: 1; min-width: 0; }
.hist .name small { display: block; font-weight: 400; color: var(--dim); font-size: 13px; }
.hist .mark { font-size: 16px; }
.empty { color: var(--dim); font-size: 14px; margin-top: 8px; }
.progress { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.foot { text-align: center; color: var(--dim); font-size: 13px; margin-top: 22px; }
.foot button { color: var(--dim); text-decoration: underline; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const KEY = 'dailySound.v1';

/* Each genre: name, origin, era, mood tags, a one-line pitch, when to try it,
   and three starting points (artist, track). Links are search links, so an
   album title works as well as a song. */
const GENRES = [
 { n: 'Bossa Nova', o: 'Brazil', e: 'late 1950s', h: 165, m: ['chill','feel'], d: 'Samba slowed down and whispered: nylon-string guitar, hushed vocals and jazz chords that drift like a sea breeze.', w: 'a slow morning coffee', t: [['Stan Getz & João Gilberto','The Girl from Ipanema'],['Antônio Carlos Jobim','Wave'],['João Gilberto','Chega de Saudade']] },
 { n: 'Afrobeat', o: 'Nigeria', e: '1970s', h: 30, m: ['groove','energy'], d: 'Long, hypnotic grooves built from interlocking guitars, punchy horns and political fire. Songs take their time and then take over.', w: 'cleaning the house or a long walk', t: [['Fela Kuti','Water No Get Enemy'],['Fela Kuti','Zombie'],['Ebo Taylor','Love and Death']] },
 { n: 'Ethio-Jazz', o: 'Ethiopia', e: '1960s–70s', h: 40, m: ['chill','focus'], d: 'Ethiopian pentatonic scales meet vibraphone, organ and smoky horns. Mysterious, cool and unlike anything else.', w: 'late-night work', t: [['Mulatu Astatke','Yègèllé Tezeta'],['Mulatu Astatke','Yekermo Sew'],['Mahmoud Ahmed','Tezeta']] },
 { n: 'City Pop', o: 'Japan', e: '1980s', h: 320, m: ['groove','feel'], d: 'Glossy, nostalgic pop for neon cities: funky bass, bright synths and a little heartbreak.', w: 'an evening drive or bus ride', t: [['Mariya Takeuchi','Plastic Love'],['Miki Matsubara','Mayonaka no Door (Stay With Me)'],['Tatsuro Yamashita','Ride on Time']] },
 { n: 'Shoegaze', o: 'UK', e: 'late 1980s', h: 300, m: ['feel','focus'], d: 'Guitars turned into a warm wall of fog, with vocals buried inside. Loud, but strangely calming.', w: 'when you want to disappear into sound', t: [['My Bloody Valentine','Only Shallow'],['Slowdive','Alison'],['Ride','Vapour Trail']] },
 { n: 'Delta Blues', o: 'Mississippi, USA', e: '1920s–30s', h: 25, m: ['feel'], d: 'One voice, one guitar and a lot of truth. The raw root that rock, soul and hip-hop all grew from.', w: 'a quiet rainy afternoon', t: [['Robert Johnson','Cross Road Blues'],['Son House','Death Letter'],['Skip James',"Hard Time Killin' Floor Blues"]] },
 { n: 'Hindustani Classical', o: 'North India', e: 'centuries old', h: 15, m: ['focus','chill'], d: 'Ragas unfold slowly, from a meditative opening to dazzling improvisation. Each raga has its own mood and time of day.', w: 'deep focus or early morning', t: [['Shivkumar Sharma, Brijbhushan Kabra & Hariprasad Chaurasia','Call of the Valley (album)'],['Ravi Shankar','The Sounds of India (album)'],['Kishori Amonkar','Sahela Re']] },
 { n: 'Carnatic', o: 'South India', e: 'centuries old', h: 45, m: ['focus','feel'], d: 'Intricate, devotional and mathematically precise. Vocal lines curl around the rhythm with breathtaking ornament.', w: 'a calm, unhurried morning', t: [['M.S. Subbulakshmi','Kurai Ondrum Illai'],['M.S. Subbulakshmi','Bhaja Govindam'],['U. Srinivas','Vatapi Ganapatim (mandolin)']] },
 { n: 'Ghazal', o: 'South Asia', e: '1970s–80s golden era', h: 350, m: ['chill','feel'], d: 'Urdu poetry of love and longing set to soft harmonium and tabla. Every line is meant to be savoured.', w: 'late evening with tea', t: [['Jagjit Singh','Hothon Se Chhoo Lo Tum'],['Mehdi Hassan','Ranjish Hi Sahi'],['Ghulam Ali','Chupke Chupke Raat Din']] },
 { n: 'Qawwali', o: 'Pakistan & India', e: 'Sufi tradition', h: 5, m: ['energy','feel'], d: 'Sufi devotional music that builds from a whisper to an ecstatic roar with hand claps and soaring voices.', w: 'when you need to feel lifted', t: [['Nusrat Fateh Ali Khan','Mustt Mustt'],['Nusrat Fateh Ali Khan','Tumhe Dillagi'],['Sabri Brothers','Bhar Do Jholi Meri']] },
 { n: 'Old Hindi Film Songs', o: 'India', e: '1950s–70s', h: 10, m: ['feel','chill'], d: 'The golden age of Bollywood melody: lush orchestras and some of the most loved voices ever recorded.', w: 'a nostalgic evening', t: [['Lata Mangeshkar','Lag Jaa Gale'],['Kishore Kumar','Mere Sapnon Ki Rani'],['Mohammed Rafi','Chaudhvin Ka Chand']] },
 { n: 'Malayalam Film Melodies', o: 'Kerala, India', e: '1970s–today', h: 140, m: ['feel','chill'], d: 'Gentle, poetic melodies rooted in Carnatic music and Kerala’s landscapes.', w: 'a slow evening at home', t: [['K.J. Yesudas','Pramadavanam'],['K.S. Chithra','Rajahamsame'],['Shreya Ghoshal','Kaathirunnu Kaathirunnu']] },
 { n: 'Highlife', o: 'Ghana & Nigeria', e: '1950s–70s', h: 50, m: ['groove','feel'], d: 'Sunny guitar lines and brass bands with a lilting dance swing. Pure joy with a touch of sweetness.', w: 'a sunny weekend', t: [['Prince Nico Mbarga','Sweet Mother'],['E.T. Mensah','All for You'],['Victor Uwaifo','Joromi']] },
 { n: 'Roots Reggae', o: 'Jamaica', e: '1970s', h: 120, m: ['chill','feel'], d: 'Heavy bass, the off-beat skank and songs about faith, freedom and justice.', w: 'an easy, sunny afternoon', t: [['Bob Marley & The Wailers','Natural Mystic'],['Burning Spear','Marcus Garvey'],['Toots & The Maytals','Pressure Drop']] },
 { n: 'Dub', o: 'Jamaica', e: '1970s', h: 135, m: ['chill','focus'], d: 'Reggae taken apart in the studio: bass up front, echoes everywhere, vocals floating in and out.', w: 'headphones and a dim room', t: [['Augustus Pablo & King Tubby','King Tubby Meets Rockers Uptown'],['Lee "Scratch" Perry','Blackboard Jungle Dub (album)'],['Scientist','Scientist Rids the World of the Evil Curse of the Vampires (album)']] },
 { n: 'Krautrock', o: 'West Germany', e: '1970s', h: 200, m: ['focus','energy'], d: 'Endless motorik drumbeats and experimental textures. Music that feels like a straight road to the horizon.', w: 'coding, running or driving', t: [['Neu!','Hallogallo'],['Can','Vitamin C'],['Kraftwerk','Autobahn']] },
 { n: 'Ambient', o: 'UK & Japan', e: '1970s–90s', h: 190, m: ['chill','focus'], d: 'Music as atmosphere: slow, spacious and meant to colour a room rather than demand attention.', w: 'reading, studying or winding down', t: [['Brian Eno','An Ending (Ascent)'],['Hiroshi Yoshimura','Water Copy'],['Aphex Twin','Rhubarb']] },
 { n: 'Modal Jazz', o: 'USA', e: 'late 1950s–60s', h: 220, m: ['focus','chill'], d: 'Jazz that slows its chord changes to let soloists roam. Cool, open and endlessly re-listenable.', w: 'deep work', t: [['Miles Davis','So What'],['John Coltrane','My Favorite Things'],['Herbie Hancock','Maiden Voyage']] },
 { n: 'Spiritual Jazz', o: 'USA', e: '1960s–today', h: 260, m: ['feel','focus'], d: 'Jazz reaching for the cosmic: harps, chants, droning bass and saxophones that cry out.', w: 'when you want something big', t: [['Pharoah Sanders','The Creator Has a Master Plan'],['Alice Coltrane','Journey in Satchidananda'],['Kamasi Washington','Truth']] },
 { n: 'Bebop', o: 'New York, USA', e: '1940s', h: 210, m: ['energy','focus'], d: 'Fast, clever, virtuosic jazz. Lines zig-zag at lightning speed and the rhythm never sits still.', w: 'a burst of brain energy', t: [['Charlie Parker','Ko-Ko'],['Dizzy Gillespie','A Night in Tunisia'],['Thelonious Monk','Straight, No Chaser']] },
 { n: 'Vocal Jazz', o: 'USA', e: '1930s–60s', h: 235, m: ['chill','feel'], d: 'The great voices of jazz turning standards into confessions.', w: 'a candle-lit dinner', t: [['Ella Fitzgerald & Louis Armstrong','Summertime'],['Nina Simone','Feeling Good'],['Billie Holiday','Strange Fruit']] },
 { n: 'Big Band Swing', o: 'USA', e: '1930s–40s', h: 45, m: ['energy','groove'], d: 'Huge horn sections, walking bass and drums that make it impossible to sit still.', w: 'getting ready to go out', t: [['Duke Ellington',"Take the 'A' Train"],['Count Basie',"One O'Clock Jump"],['Benny Goodman','Sing, Sing, Sing']] },
 { n: 'Classic Soul', o: 'USA', e: '1960s–70s', h: 15, m: ['feel','groove'], d: 'Gospel-trained voices singing about love, pain and change over tight rhythm sections.', w: 'any time you need to feel something', t: [['Marvin Gaye',"What's Going On"],['Otis Redding',"(Sittin' On) The Dock of the Bay"],['Aretha Franklin','Respect']] },
 { n: 'Funk', o: 'USA', e: 'late 1960s–70s', h: 35, m: ['groove','energy'], d: 'Everything is rhythm: chicken-scratch guitar, slap bass and the mighty “one”.', w: 'when you need to move', t: [['James Brown','Funky Drummer'],['Parliament','Give Up the Funk (Tear the Roof off the Sucker)'],['The Meters','Cissy Strut']] },
 { n: 'Disco', o: 'USA & Europe', e: 'mid-1970s', h: 300, m: ['groove','energy'], d: 'Four-on-the-floor beats, strings, and pure dance-floor euphoria.', w: 'a mood-lifting workout', t: [['Donna Summer','I Feel Love'],['Chic','Good Times'],['Sylvester','You Make Me Feel (Mighty Real)']] },
 { n: 'Gospel', o: 'USA', e: '1940s–70s', h: 50, m: ['feel','energy'], d: 'Choirs, organ and voices that shake the walls. The emotional engine behind soul and R&B.', w: 'a Sunday morning', t: [['Mahalia Jackson','How I Got Over'],['Sister Rosetta Tharpe','Up Above My Head'],['The Edwin Hawkins Singers','Oh Happy Day']] },
 { n: 'Chicago House', o: 'Chicago, USA', e: 'mid-1980s', h: 280, m: ['groove','energy'], d: 'Drum machines, deep basslines and soulful vocals. The blueprint for modern dance music.', w: 'a workout or a dance in the kitchen', t: [['Frankie Knuckles','Your Love'],['Mr. Fingers','Can You Feel It'],['Marshall Jefferson','Move Your Body']] },
 { n: 'Detroit Techno', o: 'Detroit, USA', e: 'late 1980s', h: 195, m: ['energy','focus'], d: 'Futuristic machine funk with a soul. Hypnotic, driving and surprisingly emotional.', w: 'a run or a focused sprint', t: [['Rhythim Is Rhythim','Strings of Life'],['Inner City','Good Life'],['DJ Rolando','Knights of the Jaguar']] },
 { n: 'French House', o: 'France', e: 'late 1990s', h: 330, m: ['groove','energy'], d: 'Filtered disco loops, chunky beats and a big sunny grin.', w: 'getting energy before going out', t: [['Daft Punk','One More Time'],['Stardust','Music Sounds Better with You'],['Cassius','1999']] },
 { n: 'Drum & Bass', o: 'UK', e: '1990s', h: 170, m: ['energy','focus'], d: 'Rapid breakbeats over rolling sub-bass. Can be fierce or surprisingly dreamy.', w: 'cardio, or work that needs pace', t: [['Goldie','Inner City Life'],['LTJ Bukem','Horizons'],['Roni Size & Reprazent','Brown Paper Bag']] },

 { n: 'Early Dubstep', o: 'South London, UK', e: 'mid-2000s', h: 240, m: ['focus','chill'], d: 'Not the noisy kind: dark, spacious half-time beats with deep bass and rainy-city moods.', w: 'a night walk with headphones', t: [['Burial','Archangel'],['Skream','Midnight Request Line'],['Benga & Coki','Night']] },
 { n: 'IDM', o: 'UK', e: '1990s', h: 180, m: ['focus'], d: 'Electronic music for listening rather than dancing: intricate, playful and sometimes tender.', w: 'focused solo work', t: [['Aphex Twin','Avril 14th'],['Boards of Canada','Roygbiv'],['Autechre','Bike']] },
 { n: 'Trip-Hop', o: 'Bristol, UK', e: '1990s', h: 260, m: ['chill','feel'], d: 'Slow hip-hop beats, moody samples and cinematic, smoky vocals.', w: 'a rainy evening', t: [['Massive Attack','Teardrop'],['Portishead','Glory Box'],['Tricky','Overcome']] },
 { n: 'Boom-Bap Hip-Hop', o: 'New York, USA', e: '1990s', h: 25, m: ['groove','focus'], d: 'Hard drums, jazzy samples and sharp lyricism from hip-hop’s golden age.', w: 'a walk through the city', t: [['A Tribe Called Quest','Electric Relaxation'],['Nas','N.Y. State of Mind'],['Gang Starr','Mass Appeal']] },
 { n: 'Lo-fi Beats', o: 'Japan & USA', e: '2000s–today', h: 25, m: ['chill','focus'], d: 'Dusty, mellow instrumental hip-hop. The ancestors of every “beats to study to” stream.', w: 'studying', t: [['Nujabes','Feather'],['Nujabes','Aruarian Dance'],['J Dilla',"Don't Cry"]] },
 { n: 'Neo-Soul', o: 'USA', e: 'late 1990s', h: 15, m: ['chill','groove'], d: 'Soul reborn with hip-hop drums and jazzy, laid-back grooves.', w: 'a lazy evening', t: [["D'Angelo",'Untitled (How Does It Feel)'],['Erykah Badu','On & On'],['Lauryn Hill','Ex-Factor']] },

 { n: 'Amapiano', o: 'South Africa', e: '2010s–today', h: 85, m: ['groove','chill'], d: 'Deep house slowed down, with jazzy keys and the signature rumbling log-drum bass.', w: 'a sunset hangout', t: [['Focalistic & Vigro Deep','Ke Star'],['Tyler ICU & Tumela_za','Mnike'],['Uncle Waffles','Tanzania']] },
 { n: 'Desert Blues', o: 'Mali & Niger', e: '1980s–today', h: 35, m: ['focus','feel'], d: 'Hypnotic, looping guitars from the Sahara. Trance-like and wide open like the desert itself.', w: 'long, steady work', t: [['Tinariwen','Cler Achel'],['Ali Farka Touré','Diaraby'],['Mdou Moctar','Afrique Victime']] },
 { n: 'Mande Music', o: 'Mali & West Africa', e: 'ancient roots, modern recordings', h: 55, m: ['chill','feel'], d: 'The cascading 21-string kora and griot voices carrying centuries of stories.', w: 'a calm morning', t: [['Toumani Diabaté','Kaira'],['Salif Keita','Madan'],['Amadou & Mariam','Je pense à toi']] },
 { n: 'Raï', o: 'Algeria', e: '1980s–90s', h: 20, m: ['groove','feel'], d: 'North African street music mixed with synths and pop. Passionate, danceable and rebellious.', w: 'a lively afternoon', t: [['Khaled','Didi'],['Khaled','Aïcha'],['Rachid Taha','Ya Rayah']] },
 { n: 'Arabic Tarab', o: 'Egypt & Lebanon', e: '1950s–70s', h: 40, m: ['feel'], d: 'Grand, emotional songs with orchestras, built to bring listeners to a state of ecstatic rapture.', w: 'an evening with time to spare', t: [['Umm Kulthum','Enta Omri'],['Fairuz','Li Beirut'],['Abdel Halim Hafez','Zay El Hawa']] },
 { n: 'Anatolian Rock', o: 'Turkey', e: '1960s–70s', h: 10, m: ['energy','groove'], d: 'Psychedelic fuzz guitars meet Turkish folk melodies and the bağlama.', w: 'when you want something fresh', t: [['Erkin Koray','Cemalim'],['Barış Manço','Dağlar Dağlar'],['Selda Bağcan','Yaz Gazeteci Yaz']] },

function load() {

    catch { return { days: {}, react: {} }; }

/* ---------- daily pick ---------- */
const dayKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dayNum = d => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function cycleOrder(cycle) {
    const r = rng(90210 + cycle * 7919), a = GENRES.map((_, i) => i);
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
}
// The scheduled pick for a date: walk the shuffled rotation, skipping genres the user said "not for me".
function scheduled(d) {
    const n = dayNum(d), L = GENRES.length;
    for (let k = 0; k < L; k++) {
        const x = n + k, idx = cycleOrder(Math.floor(x / L))[x % L];
        if (S.react[GENRES[idx].n] !== 'nope') return idx;
    }
    return cycleOrder(Math.floor(n / L))[n % L];
}

const today = new Date(), TK = dayKey(today);
if (!S.days[TK]) { S.days[TK] = { g: scheduled(today), listened: false }; save(); }
let mood = null;

/* ---------- actions ---------- */
function swap() {
    const cur = S.days[TK].g;
    const recent = new Set(Object.keys(S.days).sort().slice(-14).map(k => S.days[k].g));
    let pool = GENRES.map((g, i) => i).filter(i => i !== cur && S.react[GENRES[i].n] !== 'nope');
    if (mood) pool = pool.filter(i => GENRES[i].m.includes(mood));
    const fresh = pool.filter(i => !recent.has(i));
    if (fresh.length) pool = fresh;
    if (!pool.length) return;
    stopAudio();
    S.days[TK] = { g: pool[Math.floor(Math.random() * pool.length)], listened: false };
    save(); render(true);
}
function setReact(v) {
    const name = GENRES[S.days[TK].g].n;
    S.react[name] = S.react[name] === v ? undefined : v;
    if (!S.react[name]) delete S.react[name];
    save(); render();
}
function toggleListened() { S.days[TK].listened = !S.days[TK].listened; save(); render(); }
function resetAll() {
    if (!confirm('Clear your history, likes and swaps?')) return;
    stopAudio(); S = { days: {}, react: {} }; S.days[TK] = { g: scheduled(today), listened: false }; save(); render();
}

function streak() {
    let n = 0; const d = new Date(today);
    if (!S.days[TK]?.listened) d.setDate(d.getDate() - 1);
    while (S.days[dayKey(d)]?.listened) { n++; d.setDate(d.getDate() - 1); }
    return n;
}

/* ---------- previews ----------
   Looks each track up in the iTunes Search API (JSONP, no key needed) and
   falls back to Deezer. Both return 30-second preview clips. Found URLs are
   cached in localStorage so a track is only looked up once. */
const audio = new Audio();
const P = { key: null, idx: -1, queue: false, loading: false, none: {}, cache: {}, unlocked: false };
try { P.cache = JSON.parse(localStorage.getItem(KEY + '.previews')) || {}; } catch {}

function jsonp(url) {
    return new Promise((res, rej) => {
        const cb = 'dsCb' + Math.random().toString(36).slice(2), sc = document.createElement('script');
        const done = () => { clearTimeout(t); delete window[cb]; sc.remove(); };
        const t = setTimeout(() => { done(); rej(new Error('timeout')); }, 8000);
        window[cb] = d => { done(); res(d); };
        sc.onerror = () => { done(); rej(new Error('network')); };
        sc.src = url + '&callback=' + cb;
        document.head.appendChild(sc);
    });
}
const norm = x => x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const STOP = new Set(['the', 'and', 'los', 'las', 'les', 'del', 'with', 'feat', 'album', 'mandolin']);
const words = x => norm(x).split(' ').filter(w => w.length > 2 && !STOP.has(w));

// Pick the result that best matches artist (strong) and title (weaker).
function best(items, a, s, get) {
    const aw = words(a), sw = words(s.replace(/\(.*?\)/g, ''));
    let top = null, topScore = 0;
    for (const it of items) {
        const [artist, title, extra] = get(it), hay = norm(artist + ' ' + extra), th = norm(title);
        const aHit = aw.some(w => hay.includes(w)), sHit = sw.length ? sw.filter(w => th.includes(w)).length / sw.length : 0;
        const score = (aHit ? 2 : 0) + sHit;
        if (score > topScore && (aHit || sHit >= .6)) { top = it; topScore = score; }
    }
    return top;
}
async function findPreview(a, s) {
    const k = a + '|' + s;
    if (P.cache[k]) return P.cache[k];
    const term = (a.replace(/\(.*?\)/g, '') + ' ' + s.replace(/\(.*?\)/g, '')).replace(/\s+/g, ' ').trim();
    let url = null;
    try {
        const d = await jsonp('https://itunes.apple.com/search?media=music&entity=song&limit=15&term=' + encodeURIComponent(term));
        const hit = best((d.results || []).filter(r => r.previewUrl), a, s, r => [r.artistName || '', r.trackName || '', r.collectionName || '']);
        url = hit && hit.previewUrl;
    } catch {}
    if (!url) try {
        const d = await jsonp('https://api.deezer.com/search?output=jsonp&q=' + encodeURIComponent(term));
        const hit = best((d.data || []).filter(r => r.preview), a, s, r => [r.artist?.name || '', r.title || '', r.album?.title || '']);
        url = hit && hit.preview;
    } catch {}
    if (url) { P.cache[k] = url; try { localStorage.setItem(KEY + '.previews', JSON.stringify(P.cache)); } catch {} }
    return url;
}

// iPhones only allow audio started from a tap; play a silent clip on the first
// tap so the real preview can start once the lookup finishes.
const SILENT = 'data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
function unlock() { if (P.unlocked) return; P.unlocked = true; audio.src = SILENT; audio.play().catch(() => {}); }

async function play(i, queue) {
    const [a, s] = GENRES[S.days[TK].g].t[i], k = a + '|' + s;
    if (P.key === k && !P.loading) {
        if (audio.paused) audio.play().catch(() => {}); else { audio.pause(); P.queue = false; }
        return paint();
    }
    unlock();
    Object.assign(P, { key: k, idx: i, queue, loading: true }); paint();
    const url = await findPreview(a, s);
    if (P.key !== k) return;
    P.loading = false;
    if (!url) { P.none[k] = 1; P.key = null; paint(); if (queue && i < 2) play(i + 1, true); return; }
    audio.src = url;
    audio.play().catch(() => { paint(); });
    paint();
}
function stopAudio() { audio.pause(); Object.assign(P, { key: null, idx: -1, queue: false, loading: false }); }
audio.addEventListener('play', paint);
audio.addEventListener('pause', paint);
audio.addEventListener('ended', () => {
    if (audio.src === SILENT) return;
    if (P.queue && P.idx < 2) play(P.idx + 1, true); else { stopAudio(); paint(); }
});
audio.addEventListener('timeupdate', () => {
    const el = document.querySelector(`li[data-i="${P.idx}"] .bar i`);
    if (el && audio.duration && P.key) el.style.width = (audio.currentTime / audio.duration * 100) + '%';
});

function paint() {
    const t = GENRES[S.days[TK].g].t, live = P.key && !P.loading && !audio.paused;
    document.querySelectorAll('.tracks li').forEach(li => {
        const i = +li.dataset.i, k = t[i][0] + '|' + t[i][1], cur = P.key === k;
        const st = cur && P.loading ? 'loading' : cur && live ? 'playing' : cur ? 'paused' : P.none[k] ? 'none' : '';
        li.className = st;
        li.querySelector('.pp').textContent = st === 'playing' ? '❚❚' : st === 'loading' ? '…' : '▶';
        li.querySelector('.status').textContent = st === 'playing' ? '· playing' : st === 'loading' ? '· finding…' : st === 'none' ? '· no preview' : '';
    });
    const all = document.getElementById('playall');
    if (all) all.textContent = P.queue && P.key ? (live ? '❚❚ Pause' : '▶ Resume') : '▶ Play all 3 previews';
    const disc = document.querySelector('.disc');
    if (disc) disc.classList.toggle('on', !!live || !!S.days[TK].listened);
}

document.getElementById('app').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.mood) { mood = mood === b.dataset.mood ? null : b.dataset.mood; render(); return; }
    if (b.dataset.play) { play(+b.dataset.play, false); return; }
    const a = b.dataset.act;
    if (a === 'playall') {
        if (P.queue && P.key) { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); paint(); }
        else play(0, true);
    }
    else if (a === 'swap') swap();
    else if (a === 'love' || a === 'nope') setReact(a);
    else if (a === 'listened') toggleListened();
    else if (a === 'reset') resetAll();
});

render();
</script>
</body>
</html>
