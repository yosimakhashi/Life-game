<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1a16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PSC Padanam">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>PSC Padanam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Noto+Sans+Malayalam:wght@500;700&display=swap">
<style>
/* Layout: a single column (max 640px) with a sticky header and a fixed
   bottom tab bar: Home, Learn, Videos, Practice, Exams. Each tab is
   rendered into <main> by app.js from the URL hash. */
:root {
    --bg: #0f1a16;
    --panel: #16241f;
    --panel-2: #1d2f28;
    --line: #2a4239;
    --fg: #eef5f1;
    --dim: #9db5aa;
    --accent: #e7b84a;
    --on-accent: #241a00;
    --green: #4fc28a;
    --red: #ef7b6c;
    --blue: #6cb2ef;
}
@media (prefers-color-scheme: light) {
    :root {
        --bg: #f4f1e8;
        --panel: #ffffff;
        --panel-2: #f1ede1;
        --line: #e0d9c6;
        --fg: #1b2a24;
        --dim: #5f7168;
        --accent: #b9850f;
        --on-accent: #ffffff;
        --green: #1f9a5c;
        --red: #c94a3a;
        --blue: #2c78bd;
    }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body {
    font-family: 'Plus Jakarta Sans', 'Noto Sans Malayalam', system-ui, sans-serif;
    font-size: 16px; line-height: 1.5;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
.ml { font-family: 'Noto Sans Malayalam', sans-serif; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

header.top {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    padding: max(10px, env(safe-area-inset-top)) 16px 10px;
    border-bottom: 1px solid var(--line);
}
.topInner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.topInner .back { text-decoration: none; color: var(--dim); font-size: 22px; line-height: 1; padding: 4px 8px 4px 0; }
.topInner h1 { font-size: 18px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; font-weight: 700; white-space: nowrap; }

main { max-width: 640px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.card h2 { font-size: 16px; margin: 0 0 8px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 700; }
.muted { color: var(--dim); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 0 16px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel-2); text-decoration: none; font-weight: 700;
}
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--red); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }

input[type=text], input[type=url], input[type=date], input[type=number], select, textarea {
    width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel-2); font-size: 16px;
}
textarea { min-height: 160px; resize: vertical; }
label.field { display: grid; gap: 4px; font-size: 13px; color: var(--dim); font-weight: 700; }

/* Hero countdown */
.hero { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 28%, var(--panel)), var(--panel)); }
.big { font-size: 44px; font-weight: 800; line-height: 1; }
.bar { height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.green > i { background: var(--green); }

.stat { background: var(--panel-2); border-radius: 14px; padding: 12px; }
.stat b { font-size: 24px; display: block; line-height: 1.1; }

/* Lists */
.list { display: grid; gap: 10px; }
.item {
    display: flex; align-items: center; gap: 12px; padding: 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    text-decoration: none;
}
.item .ico { width: 42px; height: 42px; border-radius: 12px; background: var(--panel-2); display: grid; place-items: center; font-size: 22px; flex: none; }
.item .txt { flex: 1; min-width: 0; }
.item .txt b { display: block; }
.item .chev { color: var(--dim); }
.tick { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; font-size: 14px; }
.tick.on { background: var(--green); border-color: var(--green); color: #fff; }
.tag { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: var(--panel-2); color: var(--dim); }
.tag.High { color: var(--red); }
.tag.Medium { color: var(--accent); }

/* Tabs inside a topic */
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs a { flex: none; padding: 8px 14px; border-radius: 99px; text-decoration: none; background: var(--panel); border: 1px solid var(--line); font-weight: 700; font-size: 14px; }
.tabs a.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

.notes ul { margin: 0; padding-left: 20px; display: grid; gap: 10px; }
.notes li::marker { color: var(--accent); }
.notes strong { color: var(--accent); font-weight: 800; }

/* Video */
.player { position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #000; }
.player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.vid { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 14px; background: var(--panel-2); }
.vid img { width: 112px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; flex: none; background: #000; }
.vid .txt { flex: 1; min-width: 0; font-size: 14px; }
.vid .txt b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vid.playing { outline: 2px solid var(--accent); }

/* Quiz */
.q { font-size: 18px; font-weight: 700; }
.opts { display: grid; gap: 8px; }
.opt {
    text-align: left; padding: 12px 14px; min-height: 48px; border-radius: 12px;
    background: var(--panel-2); border: 2px solid var(--line);
}
.opt.sel { border-color: var(--blue); }
.opt.right { border-color: var(--green); background: color-mix(in srgb, var(--green) 18%, var(--panel-2)); }
.opt.wrong { border-color: var(--red); background: color-mix(in srgb, var(--red) 16%, var(--panel-2)); }
.explain { padding: 12px; border-radius: 12px; background: var(--panel-2); font-size: 14px; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.dots button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font-size: 12px; padding: 0; }
.dots button.ans { background: var(--blue); color: #fff; border-color: var(--blue); }
.dots button.cur { outline: 2px solid var(--accent); }

/* Flashcards */
.flash { min-height: 220px; display: grid; place-items: center; text-align: center; font-size: 18px; cursor: pointer; padding: 24px; }
.flash strong { color: var(--accent); }

/* Timer */
.timer { font-size: 48px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; }

/* Bottom tabs */
nav.tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    background: var(--panel); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
}
nav.tabbar .inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabbar a { display: grid; justify-items: center; gap: 2px; padding: 8px 0 10px; text-decoration: none; color: var(--dim); font-size: 11px; font-weight: 700; }
nav.tabbar a span { font-size: 22px; line-height: 1.2; }
nav.tabbar a.on { color: var(--accent); }

.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 20; max-width: calc(100% - 32px); }
</style>
</head>
<body>
<header class="top"><div class="topInner" id="top"></div></header>
<main id="app"></main>
<nav class="tabbar"><div class="inner">
    <a href="#/home" data-tab="home"><span>🏠</span>Home</a>
    <a href="#/learn" data-tab="learn"><span>📚</span>Learn</a>
    <a href="#/videos" data-tab="videos"><span>▶️</span>Videos</a>
    <a href="#/practice" data-tab="practice"><span>📝</span>Practice</a>
    <a href="#/exams" data-tab="exams"><span>⏰</span>Exams</a>
</div></nav>
<div class="toast" id="toast" hidden></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
