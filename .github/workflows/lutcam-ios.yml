name: LUTCam iOS build

on:
  push:
    paths:
      - "lut-camera/**"
      - ".github/workflows/lutcam-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: lut-camera
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project LUTCam.xcodeproj \
            -scheme LUTCam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LUTCam.app Payload/
          zip -qry LUTCam-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LUTCam-unsigned-ipa
          path: lut-camera/LUTCam-unsigned.ipa
