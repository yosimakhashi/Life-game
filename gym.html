<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<title>Gym Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080a;
    --panel: #111317;
    --panel-2: #181b21;
    --line: rgba(255,255,255,0.08);
    --fg: #f5f7fa;
    --muted: #8a919e;
    --accent: #c8ff2e;
    --accent-2: #2ee6ff;
    --hot: #ff3d7f;
    --glow: 0 0 0 1px rgba(200,255,46,0.45), 0 0 18px rgba(200,255,46,0.25);
    --display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; color: var(--fg); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(60rem 30rem at 110% -10%, rgba(46,230,255,0.13), transparent 60%),
      radial-gradient(50rem 30rem at -20% 0%, rgba(200,255,46,0.12), transparent 60%),
      radial-gradient(40rem 30rem at 50% 120%, rgba(255,61,127,0.10), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  button, a, input, select { font: inherit; color: inherit; touch-action: manipulation; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: var(--muted); text-decoration: none; }
  main { padding: 0.85rem 1rem 2.5rem; max-width: 40rem; margin: 0 auto; }
  .back {
    display: inline-flex; align-items: center; min-height: 2.75rem;
    letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.72rem; font-weight: 700; color: var(--muted);
  }
  .back:hover { color: var(--accent); }
  h1 {
    margin: 0; font-family: var(--display); font-weight: 400; font-size: 3.4rem; line-height: 0.95; letter-spacing: 0.02em;
    background: linear-gradient(95deg, var(--accent) 0%, var(--accent-2) 60%, var(--hot) 110%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h2 { margin: 1.6rem 0 0.7rem; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  h2::before { content: ""; display: inline-block; width: 0.9rem; height: 3px; margin: 0 0.5rem 0.2rem 0; background: var(--accent); border-radius: 2px; vertical-align: middle; }
  .hint { margin: 0.45rem 0 0; color: var(--muted); font-size: 0.85rem; }
  .tabs { display: flex; gap: 0.3rem; margin: 1.2rem 0 0.25rem; padding: 0.3rem; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; }
  .tab {
    flex: 1; min-height: 2.6rem; border-radius: 999px;
    font-family: var(--display); font-size: 1.15rem; letter-spacing: 0.08em; color: var(--muted);
  }
  .tab.on { color: #0a0b0d; background: var(--accent); box-shadow: 0 0 20px rgba(200,255,46,0.35); }
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .chip {
    min-height: 2.5rem; padding: 0 1rem; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel); font-size: 0.88rem; font-weight: 500;
  }
  .chip:hover { border-color: rgba(200,255,46,0.4); }
  .chip.on { color: #0a0b0d; background: var(--accent); border-color: var(--accent); box-shadow: 0 0 16px rgba(200,255,46,0.3); }
  .card {
    position: relative; background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line); border-radius: 1rem; padding: 0.95rem 1rem; margin-bottom: 0.6rem; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: linear-gradient(180deg, var(--accent), var(--accent-2)); opacity: 0.85; }
  .card h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.6rem; letter-spacing: 0.04em; line-height: 1; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  input, select {
    width: 100%; min-height: 2.85rem; padding: 0 0.8rem; border-radius: 0.65rem;
    border: 1px solid var(--line); background: #0b0d10; font-size: 16px;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: var(--glow); }
  input[type="date"] { color-scheme: dark; }
  label { display: block; margin: 0.8rem 0 0.35rem; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .sets { display: flex; flex-direction: column; gap: 0.4rem; }
  .set { display: grid; grid-template-columns: 2.2rem 1fr 1fr 2.4rem; gap: 0.4rem; align-items: center; }
  .set .n { font-family: var(--display); font-size: 1.3rem; color: var(--accent); text-align: center; }
  .x { min-height: 2.75rem; border-radius: 0.5rem; color: var(--muted); font-size: 1.2rem; }
  .x:hover { color: var(--hot); }
  .btn {
    display: flex; align-items: center; justify-content: center; width: 100%; min-height: 3rem;
    border: 1px solid var(--line); border-radius: 0.8rem; background: var(--panel);
    font-family: var(--display); font-size: 1.25rem; letter-spacing: 0.08em;
  }
  .btn:hover { border-color: rgba(200,255,46,0.4); }
  .btn.primary {
    border: 0; color: #0a0b0d;
    background: linear-gradient(95deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 24px rgba(200,255,46,0.25);
  }
  .btn:active, .chip:active, .tab:active { transform: scale(0.97); }
  .btns { display: flex; gap: 0.5rem; margin-top: 0.9rem; }
  .setlist { margin: 0.5rem 0 0; display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .pill { background: rgba(200,255,46,0.08); border: 1px solid rgba(200,255,46,0.22); border-radius: 0.45rem; padding: 0.2rem 0.55rem; font-size: 0.82rem; font-weight: 500; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; margin-top: 0.75rem; }
  .stat { background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 0.65rem; padding: 0.5rem 0.4rem 0.45rem; text-align: center; }
  .stat strong { display: block; font-family: var(--display); font-weight: 400; font-size: 1.9rem; line-height: 1; color: var(--fg); }
  .stat:first-child strong { color: var(--accent); }
  .stat span { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 1.5rem 0; font-size: 0.9rem; }
  .del { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 0.3rem 0; }
  .del:hover { color: var(--hot); }
  .flash { color: var(--accent); font-size: 0.85rem; font-weight: 500; min-height: 1.2rem; margin-top: 0.6rem; text-align: center; }
  .chart { margin-top: 0.8rem; cursor: default; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .col { cursor: pointer; }
  .chart .b { fill: var(--accent); opacity: 0.55; transition: opacity 0.15s; }
  .chart .col:last-child .b { opacity: 1; filter: drop-shadow(0 0 6px rgba(200,255,46,0.55)); }
  .chart .col:hover .b, .chart .col.on .b { opacity: 1; fill: var(--accent-2); }
  .chart .tip { min-height: 1.2rem; margin-top: 0.35rem; font-size: 0.8rem; color: var(--muted); }
  .chart .tip b { color: var(--fg); font-weight: 700; }
  .ex { border-top: 1px solid var(--line); padding-top: 0.6rem; margin-top: 0.6rem; font-weight: 500; }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">&larr; Back</a>
  <h1>Gym Tracker</h1>
  <p class="hint">Log every set. Watch every muscle grow.</p>
  <div class="tabs">
    <button class="tab" data-view="log" type="button">Log</button>
    <button class="tab" data-view="muscles" type="button">Muscles</button>
    <button class="tab" data-view="history" type="button">History</button>
  </div>
  <div id="app"></div>
</main>
<script>
const KEY = "gym-log-v1";
const GROUPS = ["Chest", "Back", "Shoulders", "Biceps", "Triceps", "Legs", "Glutes", "Core", "Calves", "Forearms"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const app = document.getElementById("app");
let view = "log";
let group = GROUPS[0];
let date = today();
let draft = [{ w: "", r: "" }, { w: "", r: "" }, { w: "", r: "" }];
let exercise = "";
let flash = "";
let openGroup = "";
let metric = "sets";
const WEEKS = 8;
const METRICS = { sets: "Sets", reps: "Reps", vol: "Kg" };

function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function niceDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return d + " " + MONTHS[m - 1] + " " + y;
}

function daysAgo(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const [ty, tm, td] = today().split("-").map(Number);
  const n = Math.round((Date.UTC(ty, tm - 1, td) - Date.UTC(y, m - 1, d)) / 86400000);
  return n === 0 ? "today" : n === 1 ? "yesterday" : n + " days ago";
}

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
}

function save(log) {
  try { localStorage.setItem(KEY, JSON.stringify(log)); } catch (e) {}
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function setText(s) {
  return (s.w ? s.w + " kg × " : "") + s.r;
}

function totals(entries) {
  let sets = 0, reps = 0, vol = 0;
  entries.forEach(e => e.sets.forEach(s => { sets++; reps += s.r; vol += (s.w || 0) * s.r; }));
  return { sets, reps, vol: Math.round(vol) };
}

function render() {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.view === view));
  if (view === "log") renderLog();
  else if (view === "muscles") renderMuscles();
  else renderHistory();
}

function renderLog() {
  const log = load();
  const known = [...new Set(log.filter(e => e.group === group).map(e => e.exercise))];
  const day = log.filter(e => e.date === date);

  app.innerHTML = `
    <h2>Muscle group</h2>
    <div class="chips">${GROUPS.map(g => `<button class="chip${g === group ? " on" : ""}" data-group="${g}" type="button">${g}</button>`).join("")}</div>
    <div class="card" style="margin-top:0.9rem">
      <label for="date">Date</label>
      <input id="date" type="date" value="${date}">
      <label for="exercise">Exercise</label>
      <input id="exercise" list="known" placeholder="e.g. Bench press" value="${esc(exercise)}" autocomplete="off">
      <datalist id="known">${known.map(k => `<option value="${esc(k)}">`).join("")}</datalist>
      <label>Sets</label>
      <div class="sets">
        ${draft.map((s, i) => `
          <div class="set">
            <span class="n">${i + 1}</span>
            <input type="number" inputmode="decimal" min="0" step="0.5" placeholder="kg" data-i="${i}" data-f="w" value="${s.w}">
            <input type="number" inputmode="numeric" min="0" step="1" placeholder="reps" data-i="${i}" data-f="r" value="${s.r}">
            <button class="x" data-rm="${i}" type="button" aria-label="Remove set">×</button>
          </div>`).join("")}
      </div>
      <div class="btns">
        <button class="btn" id="addSet" type="button">+ Set</button>
        <button class="btn primary" id="saveEx" type="button">Save exercise</button>
      </div>
      <div class="flash">${esc(flash)}</div>
    </div>
    <h2>${date === today() ? "Today" : niceDate(date)}</h2>
    ${dayView(day, true)}
  `;
  flash = "";
}

function dayView(entries, deletable) {
  if (!entries.length) return `<div class="empty">Nothing logged yet.</div>`;
  const byGroup = {};
  entries.forEach(e => (byGroup[e.group] = byGroup[e.group] || []).push(e));
  return Object.keys(byGroup).map(g => {
    const t = totals(byGroup[g]);
    return `<div class="card">
      <div class="row"><h3>${g}</h3><span class="muted">${t.sets} set${t.sets === 1 ? "" : "s"} · ${t.reps} reps</span></div>
      ${byGroup[g].map(e => `
        <div class="ex">
          <div class="row"><span>${esc(e.exercise)}</span>${deletable ? `<button class="del" data-del="${e.id}" type="button">Delete</button>` : ""}</div>
          <div class="setlist">${e.sets.map(s => `<span class="pill">${setText(s)}</span>`).join("")}</div>
        </div>`).join("")}
    </div>`;
  }).join("");
}

function weekStart(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const t = new Date(Date.UTC(y, m - 1, d));
  t.setUTCDate(t.getUTCDate() - (t.getUTCDay() + 6) % 7);
  return t.toISOString().slice(0, 10);
}

function lastWeeks() {
  const out = [];
  const t = new Date(weekStart(today()) + "T00:00:00Z");
  for (let i = WEEKS - 1; i >= 0; i--) {
    const w = new Date(t);
    w.setUTCDate(t.getUTCDate() - i * 7);
    out.push(w.toISOString().slice(0, 10));
  }
  return out;
}

function shortDate(iso) {
  const [, m, d] = iso.split("-").map(Number);
  return d + " " + MONTHS[m - 1];
}

function weekLabel(v) {
  const unit = metric === "vol" ? "kg moved" : METRICS[metric].toLowerCase();
  return v + " " + (v === 1 && metric !== "vol" ? unit.slice(0, -1) : unit);
}

function weeklyChart(entries) {
  const weeks = lastWeeks();
  const vals = weeks.map(w => totals(entries.filter(e => weekStart(e.date) === w))[metric]);
  const max = Math.max(...vals);
  if (!max) return `<div class="chart"><div class="tip">No ${METRICS[metric].toLowerCase()} in the last ${WEEKS} weeks.</div></div>`;
  const W = 320, H = 96, top = 14, base = H - 18, slot = W / WEEKS, bw = slot - 8;
  const cols = vals.map((v, i) => {
    const x = i * slot + 4, h = v ? Math.max(4, (v / max) * (base - top)) : 0, y = base - h, r = Math.min(4, h, bw / 2);
    const bar = v ? `<path class="b" d="M${x},${base} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${base} Z"/>` : "";
    const label = i === WEEKS - 1 || v === max ? `<text x="${x + bw / 2}" y="${y - 4}" text-anchor="middle" fill="#f2f2f2" font-size="10">${v}</text>` : "";
    const tick = i % 2 === 1 ? `<text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle" fill="#8a919e" font-size="9">${i === WEEKS - 1 ? "This wk" : shortDate(weeks[i])}</text>` : "";
    return `<g class="col" data-wk="${weeks[i]}" data-v="${v}"><rect x="${i * slot}" y="0" width="${slot}" height="${H}" fill="transparent"/>${bar}${label}${tick}</g>`;
  }).join("");
  const thisWk = vals[WEEKS - 1], lastWk = vals[WEEKS - 2];
  const diff = lastWk ? Math.round((thisWk - lastWk) / lastWk * 100) : null;
  const summary = `This week: <b>${weekLabel(thisWk)}</b>` + (diff === null ? "" : ` · ${diff >= 0 ? "▲" : "▼"} ${Math.abs(diff)}% vs last week`);
  return `<div class="chart">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly ${METRICS[metric].toLowerCase()}, last ${WEEKS} weeks: ${vals.join(", ")}">
      <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="#2a2e36" stroke-width="1"/>${cols}
    </svg>
    <div class="tip" data-summary="${esc(summary)}">${summary}</div>
  </div>`;
}

function renderMuscles() {
  const log = load();
  app.innerHTML = `<h2>Weekly progress · last ${WEEKS} weeks</h2>
    <div class="chips" style="margin-bottom:0.8rem">${Object.keys(METRICS).map(k => `<button class="chip${k === metric ? " on" : ""}" data-metric="${k}" type="button">${METRICS[k]}</button>`).join("")}</div>` + GROUPS.map(g => {
    const entries = log.filter(e => e.group === g);
    const t = totals(entries);
    const last = entries.map(e => e.date).sort().pop();
    const isOpen = openGroup === g;
    let detail = "";
    if (isOpen) {
      const byEx = {};
      entries.forEach(e => (byEx[e.exercise] = byEx[e.exercise] || []).push(e));
      detail = Object.keys(byEx).length ? Object.keys(byEx).map(name => {
        const list = byEx[name];
        const et = totals(list);
        let best = null;
        list.forEach(e => e.sets.forEach(s => {
          if (!best || (s.w || 0) > (best.w || 0) || ((s.w || 0) === (best.w || 0) && s.r > best.r)) best = s;
        }));
        const recent = list.slice().sort((a, b) => b.date.localeCompare(a.date))[0];
        return `<div class="ex">
          <div class="row"><span>${esc(name)}</span><span class="muted">${et.sets} set${et.sets === 1 ? "" : "s"} · ${et.reps} reps</span></div>
          <div class="muted" style="margin-top:0.25rem">Best: ${setText(best)} · Last: ${niceDate(recent.date)}</div>
          <div class="setlist">${recent.sets.map(s => `<span class="pill">${setText(s)}</span>`).join("")}</div>
        </div>`;
      }).join("") : `<div class="empty">No exercises yet.</div>`;
    }
    return `<div class="card" data-open="${g}" style="cursor:pointer">
      <div class="row"><h3>${g}</h3><span class="muted">${last ? "Last: " + daysAgo(last) : "Not trained yet"}</span></div>
      <div class="stats">
        <div class="stat"><strong>${t.sets}</strong><span>Sets</span></div>
        <div class="stat"><strong>${t.reps}</strong><span>Reps</span></div>
        <div class="stat"><strong>${t.vol}</strong><span>Kg moved</span></div>
      </div>
      <div class="muted" style="margin-top:0.25rem;font-size:0.7rem;letter-spacing:0.06em;text-transform:uppercase">All time</div>
      ${weeklyChart(entries)}
      ${detail}
    </div>`;
  }).join("");
}

function renderHistory() {
  const log = load();
  const dates = [...new Set(log.map(e => e.date))].sort().reverse();
  if (!dates.length) { app.innerHTML = `<h2>History</h2><div class="empty">No workouts yet.</div>`; return; }
  app.innerHTML = `<h2>History</h2>` + dates.map(d => {
    const entries = log.filter(e => e.date === d);
    const t = totals(entries);
    const groups = [...new Set(entries.map(e => e.group))].join(", ");
    return `<h2 style="color:var(--fg);text-transform:none;letter-spacing:0;font-size:1rem;font-weight:500">${niceDate(d)} <span class="muted">· ${groups} · ${t.sets} set${t.sets === 1 ? "" : "s"} · ${t.reps} reps</span></h2>${dayView(entries, true)}`;
  }).join("");
}

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { view = t.dataset.view; render(); }));

app.addEventListener("input", ev => {
  const el = ev.target;
  if (el.dataset.f) draft[+el.dataset.i][el.dataset.f] = el.value;
  else if (el.id === "exercise") exercise = el.value;
});

app.addEventListener("change", ev => {
  if (ev.target.id === "date" && ev.target.value) { date = ev.target.value; render(); }
});

app.addEventListener("click", ev => {
  const col = ev.target.closest(".col");
  if (col) { showWeek(col); return; }
  if (ev.target.closest(".chart")) return;
  const el = ev.target.closest("button, .card[data-open]");
  if (!el) return;
  if (el.dataset.metric) { metric = el.dataset.metric; render(); }
  else if (el.dataset.group) { group = el.dataset.group; render(); }
  else if (el.id === "addSet") {
    const last = draft[draft.length - 1] || { w: "", r: "" };
    draft.push({ w: last.w, r: last.r });
    render();
  }
  else if (el.dataset.rm !== undefined) { draft.splice(+el.dataset.rm, 1); if (!draft.length) draft.push({ w: "", r: "" }); render(); }
  else if (el.id === "saveEx") {
    const name = exercise.trim();
    const sets = draft.filter(s => +s.r > 0).map(s => ({ w: +s.w > 0 ? +s.w : 0, r: Math.round(+s.r) }));
    if (!name) { flash = "Enter an exercise name."; render(); return; }
    if (!sets.length) { flash = "Add reps to at least one set."; render(); return; }
    const log = load();
    log.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date, group, exercise: name, sets });
    save(log);
    flash = `Saved ${name}: ${sets.length} set${sets.length > 1 ? "s" : ""}.`;
    exercise = "";
    draft = [{ w: "", r: "" }, { w: "", r: "" }, { w: "", r: "" }];
    render();
  }
  else if (el.dataset.del) {
    if (!confirm("Delete this exercise?")) return;
    save(load().filter(e => e.id !== el.dataset.del));
    render();
  }
  else if (el.dataset.open) { openGroup = openGroup === el.dataset.open ? "" : el.dataset.open; render(); }
});

function showWeek(col) {
  const chart = col.closest(".chart");
  chart.querySelectorAll(".col").forEach(c => c.classList.toggle("on", c === col));
  chart.querySelector(".tip").innerHTML = `Week of ${shortDate(col.dataset.wk)}: <b>${weekLabel(+col.dataset.v)}</b>`;
}

app.addEventListener("mouseover", ev => {
  const col = ev.target.closest(".col");
  if (col) showWeek(col);
});

app.addEventListener("mouseout", ev => {
  const chart = ev.target.closest(".chart");
  if (!chart || chart.contains(ev.relatedTarget)) return;
  chart.querySelectorAll(".col").forEach(c => c.classList.remove("on"));
  const tip = chart.querySelector(".tip");
  if (tip.dataset.summary) tip.innerHTML = tip.dataset.summary;
});

render();
</script>
</body>
</html>
