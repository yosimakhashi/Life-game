<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<title>Gym Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080a;
    --panel: #111317;
    --panel-2: #181b21;
    --line: rgba(255,255,255,0.08);
    --fg: #f5f7fa;
    --muted: #8a919e;
    --accent: #c8ff2e;
    --accent-2: #2ee6ff;
    --hot: #ff3d7f;
    --glow: 0 0 0 1px rgba(200,255,46,0.45), 0 0 18px rgba(200,255,46,0.25);
    --display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; color: var(--fg); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(60rem 30rem at 110% -10%, rgba(46,230,255,0.13), transparent 60%),
      radial-gradient(50rem 30rem at -20% 0%, rgba(200,255,46,0.12), transparent 60%),
      radial-gradient(40rem 30rem at 50% 120%, rgba(255,61,127,0.10), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  button, a, input, select { font: inherit; color: inherit; touch-action: manipulation; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: var(--muted); text-decoration: none; }
  main { padding: 0.85rem 1rem 2.5rem; max-width: 40rem; margin: 0 auto; }
  .back {
    display: inline-flex; align-items: center; min-height: 2.75rem;
    letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.72rem; font-weight: 700; color: var(--muted);
  }
  .back:hover { color: var(--accent); }
  h1 {
    margin: 0; font-family: var(--display); font-weight: 400; font-size: 3.4rem; line-height: 0.95; letter-spacing: 0.02em;
    background: linear-gradient(95deg, var(--accent) 0%, var(--accent-2) 60%, var(--hot) 110%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h2 { margin: 1.6rem 0 0.7rem; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  h2::before { content: ""; display: inline-block; width: 0.9rem; height: 3px; margin: 0 0.5rem 0.2rem 0; background: var(--accent); border-radius: 2px; vertical-align: middle; }
  .hint { margin: 0.45rem 0 0; color: var(--muted); font-size: 0.85rem; }
  .tabs { display: flex; gap: 0.3rem; margin: 1.2rem 0 0.25rem; padding: 0.3rem; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; }
  .tab {
    flex: 1; min-height: 2.6rem; border-radius: 999px;
    font-family: var(--display); font-size: 1.05rem; letter-spacing: 0.05em; color: var(--muted); padding: 0 0.2rem;
  }
  .tab.on { color: #0a0b0d; background: var(--accent); box-shadow: 0 0 20px rgba(200,255,46,0.35); }
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .chip {
    min-height: 2.5rem; padding: 0 1rem; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel); font-size: 0.88rem; font-weight: 500;
  }
  .chip:hover { border-color: rgba(200,255,46,0.4); }
  .chip.on { color: #0a0b0d; background: var(--accent); border-color: var(--accent); box-shadow: 0 0 16px rgba(200,255,46,0.3); }
  .card {
    position: relative; background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line); border-radius: 1rem; padding: 0.95rem 1rem; margin-bottom: 0.6rem; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: linear-gradient(180deg, var(--accent), var(--accent-2)); opacity: 0.85; }
  .card h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.6rem; letter-spacing: 0.04em; line-height: 1; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  input, select {
    width: 100%; min-height: 2.85rem; padding: 0 0.8rem; border-radius: 0.65rem;
    border: 1px solid var(--line); background: #0b0d10; font-size: 16px;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: var(--glow); }
  input[type="date"] { color-scheme: dark; }
  label { display: block; margin: 0.8rem 0 0.35rem; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .sets { display: flex; flex-direction: column; gap: 0.4rem; }
  .set { display: grid; grid-template-columns: 2.2rem 1fr 1fr 2.4rem; gap: 0.4rem; align-items: center; }
  .set .n { font-family: var(--display); font-size: 1.3rem; color: var(--accent); text-align: center; }
  .x { min-height: 2.75rem; border-radius: 0.5rem; color: var(--muted); font-size: 1.2rem; }
  .x:hover { color: var(--hot); }
  .btn {
    display: flex; align-items: center; justify-content: center; width: 100%; min-height: 3rem;
    border: 1px solid var(--line); border-radius: 0.8rem; background: var(--panel);
    font-family: var(--display); font-size: 1.25rem; letter-spacing: 0.08em;
  }
  .btn:hover { border-color: rgba(200,255,46,0.4); }
  .btn.primary {
    border: 0; color: #0a0b0d;
    background: linear-gradient(95deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 24px rgba(200,255,46,0.25);
  }
  .btn:active, .chip:active, .tab:active { transform: scale(0.97); }
  .btns { display: flex; gap: 0.5rem; margin-top: 0.9rem; }
  .setlist { margin: 0.5rem 0 0; display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .pill { background: rgba(200,255,46,0.08); border: 1px solid rgba(200,255,46,0.22); border-radius: 0.45rem; padding: 0.2rem 0.55rem; font-size: 0.82rem; font-weight: 500; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; margin-top: 0.75rem; }
  .stat { background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 0.65rem; padding: 0.5rem 0.4rem 0.45rem; text-align: center; }
  .stat strong { display: block; font-family: var(--display); font-weight: 400; font-size: 1.9rem; line-height: 1; color: var(--fg); }
  .stat:first-child strong { color: var(--accent); }
  .stat span { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 1.5rem 0; font-size: 0.9rem; }
  .del { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 0.3rem 0; }
  .del:hover { color: var(--hot); }
  .flash { color: var(--accent); font-size: 0.85rem; font-weight: 500; min-height: 1.2rem; margin-top: 0.6rem; text-align: center; }
  .chart { margin-top: 0.8rem; cursor: default; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .col { cursor: pointer; }
  .chart .b { fill: var(--accent); opacity: 0.55; transition: opacity 0.15s; }
  .chart .col:last-child .b { opacity: 1; filter: drop-shadow(0 0 6px rgba(200,255,46,0.55)); }
  .chart .col:hover .b, .chart .col.on .b { opacity: 1; fill: var(--accent-2); }
  .chart .tip { min-height: 1.2rem; margin-top: 0.35rem; font-size: 0.8rem; color: var(--muted); }
  .chart .tip b { color: var(--fg); font-weight: 700; }
  .plan, .rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.7rem; }
  .plan li { display: grid; grid-template-columns: 4.6rem 1fr; gap: 0.6rem; font-size: 0.9rem; line-height: 1.4; }
  .plan b, .rules b { color: var(--fg); }
  .plan li span:last-child { color: #c9ced6; }
  .plvl { align-self: start; text-align: center; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.3rem 0.2rem; border-radius: 0.4rem; border: 1px solid; }
  .p1 .plvl { color: var(--hot); background: rgba(255,61,127,0.1); }
  .p2 .plvl { color: #ffb020; background: rgba(255,176,32,0.1); }
  .p3 .plvl { color: var(--accent-2); background: rgba(46,230,255,0.08); }
  .rules li { font-size: 0.88rem; line-height: 1.45; color: #c9ced6; }
  .badge { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.2rem 0.5rem; border-radius: 999px; border: 1px solid; white-space: nowrap; }
  .badge.good, .fill.good, .tlabel.good { color: var(--accent); }
  .badge.low, .fill.low { color: #ffb020; }
  .badge.high, .fill.high, .tlabel.high { color: var(--hot); }
  .badge.none, .fill.none { color: var(--muted); }
  .vrow + .vrow { margin-top: 0.85rem; }
  .vname { font-family: var(--display); font-size: 1.25rem; letter-spacing: 0.04em; }
  .vbar { position: relative; height: 8px; margin-top: 0.4rem; background: #0b0d10; border-radius: 4px; overflow: hidden; }
  .vbar .band { position: absolute; top: 0; bottom: 0; background: rgba(200,255,46,0.14); border-left: 1px dashed rgba(200,255,46,0.5); border-right: 1px dashed rgba(200,255,46,0.5); }
  .vbar .fill { position: absolute; left: 0; top: 2px; bottom: 2px; background: currentColor; border-radius: 0 3px 3px 0; }
  .vmeta { font-size: 0.75rem; margin-top: 0.3rem; }
  #tip:not(:empty) { margin-top: 0.6rem; }
  .tipcard { background: rgba(46,230,255,0.05); border: 1px solid rgba(46,230,255,0.22); border-radius: 0.7rem; padding: 0.15rem 0.8rem; }
  .card > .tipcard { background: none; border: 0; padding: 0; }
  .tipcard summary { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; min-height: 2.6rem; cursor: pointer; list-style: none; font-weight: 700; }
  .tipcard summary::-webkit-details-marker { display: none; }
  .tipcard summary::after { content: "+"; color: var(--accent-2); font-size: 1.2rem; }
  .tipcard[open] summary::after { content: "−"; }
  .card > .tipcard summary > span:first-child { font-family: var(--display); font-weight: 400; font-size: 1.45rem; letter-spacing: 0.04em; }
  .tipcard .setup { margin: 0.2rem 0 0.6rem; font-size: 0.88rem; line-height: 1.45; color: #c9ced6; }
  .tlabel { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-top: 0.4rem; }
  .tipcard ul { margin: 0.3rem 0 0.6rem; padding-left: 1.1rem; font-size: 0.86rem; line-height: 1.45; color: #c9ced6; }
  .tipcard li + li { margin-top: 0.2rem; }
  .ex { border-top: 1px solid var(--line); padding-top: 0.6rem; margin-top: 0.6rem; font-weight: 500; }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">&larr; Back</a>
  <h1>Gym Tracker</h1>
  <p class="hint">Log every set. Watch every muscle grow.</p>
  <div class="tabs">
    <button class="tab" data-view="log" type="button">Log</button>
    <button class="tab" data-view="muscles" type="button">Muscles</button>
    <button class="tab" data-view="coach" type="button">Coach</button>
    <button class="tab" data-view="form" type="button">Form</button>
    <button class="tab" data-view="history" type="button">History</button>
  </div>
  <div id="app"></div>
</main>
<script>
const KEY = "gym-log-v1";
const GROUPS = ["Chest", "Back", "Shoulders", "Biceps", "Triceps", "Legs", "Glutes", "Core", "Calves", "Forearms"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const app = document.getElementById("app");
let view = "log";
let group = GROUPS[0];
let date = today();
let draft = [{ w: "", r: "" }, { w: "", r: "" }, { w: "", r: "" }];
let exercise = "";
let flash = "";
let openGroup = "";
let metric = "sets";
const WEEKS = 8;
const METRICS = { sets: "Sets", reps: "Reps", vol: "Kg" };

const LIB = {
  Chest: [
    { name: "Bench press", alias: ["bench press", "barbell bench", "flat bench", "bench"],
      setup: "Lie with your eyes under the bar, feet flat, and grip a little wider than shoulder width. Pull your shoulder blades back and down into the bench.",
      cues: ["Keep a slight arch and your butt on the bench", "Lower the bar under control to your mid or lower chest", "Elbows about 45–70° from your body, not straight out", "Press up and slightly back toward your face"],
      avoid: ["Flaring elbows out to 90°", "Bouncing the bar off your chest", "Lifting your hips off the bench"] },
    { name: "Incline dumbbell press", alias: ["incline", "incline press", "incline dumbbell", "incline bench"],
      setup: "Set the bench to about 30–45°. Sit back with the dumbbells on your thighs and kick them up one at a time as you lie back.",
      cues: ["Shoulder blades pinned back the whole set", "Lower until you feel a stretch across the upper chest", "Forearms vertical, wrists stacked over elbows", "Press up and slightly in, without clanking the weights"],
      avoid: ["Bench too steep (turns it into a shoulder press)", "Shoulders rolling forward at the top"] },
    { name: "Push-up", alias: ["push up", "pushup", "push-up"],
      setup: "Hands slightly wider than shoulders, body in one straight line from head to heels.",
      cues: ["Squeeze glutes and brace your abs", "Elbows about 45° from your body", "Lower until your chest nearly touches the floor", "Push the floor away and fully lock out"],
      avoid: ["Sagging hips", "Head poking forward", "Half reps"] },
    { name: "Chest fly", alias: ["fly", "flye", "pec deck", "cable fly", "crossover"],
      setup: "With cables, dumbbells or a machine, start with arms out front and a soft, fixed bend in the elbows.",
      cues: ["Open your arms wide until you feel a deep chest stretch", "Keep the elbow bend the same throughout", "Bring your hands together as if hugging a tree", "Squeeze for a second at the end"],
      avoid: ["Turning it into a press by bending the elbows more", "Going so deep the shoulder hurts"] },
    { name: "Dips (chest)", alias: ["chest dip"],
      setup: "Grip the bars, lock out, then lean your torso forward about 30°.",
      cues: ["Shoulders down, away from your ears", "Lower until your upper arms are about parallel to the floor", "Elbows flare slightly out to target the chest"],
      avoid: ["Dropping too deep if your shoulder hurts", "Swinging your legs"] }
  ],
  Back: [
    { name: "Pull-up", alias: ["pull up", "pullup", "pull-up", "chin up", "chinup", "chin-up"],
      setup: "Hang with hands slightly wider than shoulders (palms facing you for chin-ups). Brace your core with legs together.",
      cues: ["Start by pulling your shoulders down, away from your ears", "Drive your elbows down toward your ribs", "Chest up toward the bar, chin over it", "Lower all the way down under control"],
      avoid: ["Kipping or swinging", "Half reps that stop short at the bottom", "Shrugging up into your neck"] },
    { name: "Lat pulldown", alias: ["pulldown", "pull down", "lat pull"],
      setup: "Thighs locked under the pad, grip slightly wider than shoulders, sit tall with a small lean back.",
      cues: ["Pull the bar to your upper chest", "Think elbows down and back, not hands", "Squeeze your lats at the bottom for a second", "Let the bar rise slowly until your arms are straight"],
      avoid: ["Leaning way back and rowing it", "Pulling behind the neck"] },
    { name: "Barbell row", alias: ["barbell row", "bent over row", "bent-over row", "pendlay"],
      setup: "Hinge at the hips until your torso is about 45° or lower. Soft knees, flat back, bar hanging under your shoulders.",

    { name: "Dumbbell row", alias: ["dumbbell row", "db row", "one arm row", "single arm row"],

      avoid: ["Rotating your torso to lift the weight", "Shrugging the weight up"] },
    { name: "Seated cable row", alias: ["cable row", "seated row", "low row"],

    { name: "Deadlift", alias: ["deadlift", "conventional deadlift"],

  ],
  Shoulders: [

    { name: "Face pull", alias: ["face pull", "facepull"],
      setup: "Set a rope on a cable at upper-chest to face height. Grip with thumbs facing you and step back.",

  Triceps: [
    { name: "Triceps pushdown", alias: ["pushdown", "push down", "pressdown", "rope pushdown", "tricep pushdown"],

    { name: "Skull crusher", alias: ["skull crusher", "skullcrusher", "lying extension", "lying tricep"],
      setup: "Lie on a bench with an EZ bar or dumbbells held straight over your shoulders.",

    { name: "Dips (triceps)", alias: ["dip", "dips", "bench dip", "tricep dip"],

  ],

const BASICS = [
  ["Brace", "Before each rep, take a breath into your belly and tighten your abs as if bracing for a punch."],
  ["Control the lowering", "Take 2–3 seconds on the way down. The lowering part builds a lot of muscle."],
  ["Full range of motion", "Use the full range you can control. A deep stretch under load grows muscle better than half reps."],
  ["Close to failure", "Finish most sets with 1–3 reps left in the tank. If you could do 6 more, the set was too easy."],
  ["Progress slowly", "Add reps first. Once you hit the top of your rep range on every set, add weight."],
  ["Warm up", "Do 1–3 lighter sets of your first exercise before the heavy ones."],
  ["Pain is a stop sign", "Muscle burn is fine. Sharp or joint pain is not. Stop, lighten the weight, or swap the exercise."]
];

// Weekly hard-set targets per muscle (rough evidence-based ranges for muscle growth).
const TARGETS = { Chest: [10, 20], Back: [10, 20], Shoulders: [8, 16], Biceps: [6, 14], Triceps: [6, 14], Legs: [10, 20], Glutes: [8, 16], Core: [6, 14], Calves: [6, 14], Forearms: [4, 10] };
const STATUS = {
  good: { icon: "✓", label: "On target", cls: "good" },
  low: { icon: "▼", label: "Too low", cls: "low" },
  high: { icon: "▲", label: "Too high", cls: "high" },
  none: { icon: "–", label: "Not tracked", cls: "none" }
};

function dayNum(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return Date.UTC(y, m - 1, d) / 86400000;
}

function findLib(name) {
  const n = name.trim().toLowerCase();
  if (!n) return null;
  let best = null, len = 0;
  GROUPS.forEach(g => LIB[g].forEach(x => {
    [x.name.toLowerCase(), ...x.alias].forEach(a => {
      if ((n === a || n.includes(a)) && a.length > len) { best = x; len = a.length; }
    });
  }));
  return best;
}

function tipCard(x, open) {
  return `<details class="tipcard"${open ? " open" : ""}>
    <summary><span>${esc(x.name)}</span><span class="muted">Form tips</span></summary>
    <p class="setup">${esc(x.setup)}</p>
    <div class="tlabel good">✓ Do</div>
    <ul>${x.cues.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
    <div class="tlabel high">✕ Avoid</div>
    <ul>${x.avoid.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
  </details>`;
}

function updateTip() {
  const box = document.getElementById("tip");
  if (!box) return;
  const x = findLib(exercise);
  box.innerHTML = x ? tipCard(x, false) : "";
}

function exerciseTrends(log) {
  const by = {};
  log.forEach(e => {
    const k = e.group + "|" + e.exercise.trim().toLowerCase();
    (by[k] = by[k] || { name: e.exercise, group: e.group, entries: [] }).entries.push(e);
  });
  return Object.values(by).map(x => {
    const weighted = x.entries.some(e => e.sets.some(s => s.w > 0));
    const days = {};
    x.entries.forEach(e => e.sets.forEach(s => {
      if (weighted && !s.w) return;
      const v = weighted ? s.w * (1 + s.r / 30) : s.r;
      days[e.date] = Math.max(days[e.date] || 0, v);
    }));
    const dates = Object.keys(days).sort();
    const vals = dates.map(d => Math.round(days[d] * 10) / 10);
    const n = vals.length;
    let state = "new";
    if (n >= 2) {
      const recent = Math.max(...vals.slice(-3));
      const before = n > 3 ? Math.max(...vals.slice(0, -3)) : vals[0];
      if (n >= 4 && recent <= before) state = "stalled";
      else if (vals[n - 1] > vals[0] || recent > before) state = "up";
      else state = "flat";
    }
    const change = n >= 2 ? Math.round((vals[n - 1] - vals[0]) / vals[0] * 100) : 0;
    return { ...x, weighted, vals, n, state, change, last: dates[n - 1] };
  }).filter(x => x.n);
}

function analyse() {
  const log = load();
  const now = dayNum(today());
  const ago = e => now - dayNum(e.date);
  const within = (es, d) => es.filter(e => ago(e) >= 0 && ago(e) < d);
  const span = log.length ? now - Math.min(...log.map(e => dayNum(e.date))) + 1 : 0;

  const muscles = GROUPS.map(g => {
    const es = log.filter(e => e.group === g);
    const week = totals(within(es, 7)).sets;
    const month = totals(within(es, 28)).sets;
    const freq = new Set(within(es, 14).map(e => e.date)).size / 2;
    const last = es.map(e => e.date).sort().pop();
    const since = last ? now - dayNum(last) : null;
    const [lo, hi] = TARGETS[g];
    const status = !es.length ? "none" : week < lo ? "low" : week > hi ? "high" : "good";
    return { g, week, month, freq, since, lo, hi, status, ever: es.length > 0 };
  });

  const tips = [];
  const add = (lvl, text) => tips.push({ lvl, text });

  muscles.forEach(m => {
    if (!m.ever) return;
    if (m.since >= 8) add(1, `<b>${m.g}</b> hasn't been trained in ${m.since} days. Get at least one session in this week. Muscles start losing size after a few weeks off.`);
    else if (m.status === "low") add(m.week < m.lo / 2 ? 1 : 2, `<b>${m.g}</b> is low: ${m.week} sets in the last 7 days. Add about <b>${m.lo - m.week} more set${m.lo - m.week === 1 ? "" : "s"}</b> to reach ${m.lo}–${m.hi}.`);
    else if (m.status === "high") add(2, `<b>${m.g}</b> got ${m.week} sets this week, above about ${m.hi}. Extra sets past this mostly add fatigue. Cut back or spread them out.`);
    if (m.week >= m.lo && m.freq < 1.5 && span >= 14) add(3, `<b>${m.g}</b> is trained about once a week. Split the same sets across <b>2 sessions</b> for better growth and fresher sets.`);
  });

  const sum = (gs, d) => gs.reduce((a, g) => a + totals(within(log.filter(e => e.group === g), d)).sets, 0);
  const chest = sum(["Chest"], 28), back = sum(["Back"], 28);
  if (chest + back >= 8) {
    if (chest > back * 1.5) add(2, `You do ${chest} chest sets vs ${back} back sets (28 days). Add <b>more rows and pull-ups</b> to balance your posture and protect your shoulders.`);
    else if (back > chest * 2) add(3, `Back (${back} sets) is far ahead of chest (${chest}). Fine if it's on purpose, otherwise add some pressing.`);
  }
  const bi = sum(["Biceps"], 28), tri = sum(["Triceps"], 28);
  if (bi + tri >= 8 && bi > tri * 1.6) add(3, `Biceps ${bi} sets vs triceps ${tri}. Triceps make up about two-thirds of your upper arm, so <b>train them at least as much</b> for bigger arms.`);
  const upper = sum(["Chest", "Back", "Shoulders", "Biceps", "Triceps"], 28), lower = sum(["Legs", "Glutes", "Calves"], 28);
  if (upper + lower >= 15 && lower < upper * 0.35) add(1, `Lower body is only ${lower} sets vs ${upper} upper in 28 days. <b>Don't skip leg day.</b> Add squats, leg press or RDLs.`);

  const recentSets = [];
  within(log, 28).forEach(e => e.sets.forEach(s => recentSets.push(s.r)));
  if (recentSets.length >= 12) {
    const heavy = recentSets.filter(r => r <= 5).length / recentSets.length;
    const light = recentSets.filter(r => r >= 20).length / recentSets.length;
    if (heavy > 0.6) add(3, `${Math.round(heavy * 100)}% of your sets are 5 reps or fewer. That's great for strength. For size, add some <b>8–15 rep</b> work.`);
    if (light > 0.6) add(3, `${Math.round(light * 100)}% of your sets are 20+ reps. <b>Add weight</b> so most sets land around 6–15 reps.`);
  }

  const trends = exerciseTrends(log);
  trends.filter(t => t.state === "stalled").forEach(t => add(2, `<b>${esc(t.name)}</b> hasn't improved in its last 3 sessions. Add 1–2 reps per set before adding weight. If it's still stuck, check your sleep and protein, or swap to a similar exercise for 4–6 weeks.`));

  const untracked = muscles.filter(m => !m.ever).map(m => m.g);
  if (untracked.length && log.length) add(3, `Not tracked yet: ${untracked.join(", ")}. Add them if they're part of your plan.`);

  tips.sort((a, b) => a.lvl - b.lvl);
  return { log, muscles, tips, trends };
}

function renderCoach() {
  const { log, muscles, tips, trends } = analyse();
  if (!log.length) {
    app.innerHTML = `<h2>Coach</h2><div class="empty">Log a few workouts and your coach will tell you what to fix.</div>`;
    return;
  }
  const PRIO = { 1: "Fix first", 2: "Improve", 3: "Tip" };
  const plan = tips.length
    ? tips.slice(0, 8).map(t => `<li class="p${t.lvl}"><span class="plvl">${PRIO[t.lvl]}</span><span>${t.text}</span></li>`).join("")
    : `<li class="p3"><span class="plvl">Nice</span><span>Everything looks on track. Keep adding reps or weight each week.</span></li>`;

  const vol = muscles.map(m => {
    const st = STATUS[m.status];
    const scale = m.hi * 1.5;
    const pct = v => Math.min(100, v / scale * 100);
    return `<div class="vrow">
      <div class="row"><span class="vname">${m.g}</span><span class="badge ${st.cls}">${st.icon} ${st.label}</span></div>
      <div class="vbar" title="Target ${m.lo}–${m.hi} sets">
        <span class="band" style="left:${pct(m.lo)}%;width:${pct(m.hi) - pct(m.lo)}%"></span>
        <span class="fill ${st.cls}" style="width:${pct(m.week)}%"></span>
      </div>
      <div class="muted vmeta">${m.week} sets in 7 days · aim ${m.lo}–${m.hi} · ${m.freq ? m.freq + "×/week" : "0×/week"}${m.since !== null ? " · last " + daysAgo(shiftDays(m.since)) : ""}</div>
    </div>`;
  }).join("");

  const TREND = { up: ["▲", "Progressing", "good"], stalled: ["■", "Stalled", "high"], flat: ["→", "Flat", "low"], new: ["•", "Need 2+ sessions", "none"] };
  const prog = trends.sort((a, b) => b.last.localeCompare(a.last)).slice(0, 12).map(t => {
    const [icon, label, cls] = TREND[t.state];
    const latest = t.vals[t.n - 1];
    const what = t.weighted ? `est. max ${Math.round(latest)} kg` : `best ${latest} reps`;
    const ch = t.n >= 2 ? ` · ${t.change >= 0 ? "+" : ""}${t.change}% since first log` : "";
    return `<div class="ex"><div class="row"><span>${esc(t.name)}</span><span class="badge ${cls}">${icon} ${label}</span></div>
      <div class="muted" style="margin-top:0.2rem">${t.group} · ${t.n} session${t.n === 1 ? "" : "s"} · ${what}${ch}</div></div>`;
  }).join("");

  app.innerHTML = `
    <h2>Your game plan</h2>
    <div class="card"><ul class="plan">${plan}</ul></div>
    <h2>Weekly sets vs target</h2>
    <div class="card">${vol}<div class="muted" style="margin-top:0.6rem;font-size:0.75rem">The shaded zone is the target range: about 10–20 hard sets per week for big muscles and fewer for small ones.</div></div>
    <h2>Strength progress</h2>
    <div class="card">${prog}<div class="muted" style="margin-top:0.6rem;font-size:0.75rem">Estimated max = weight × (1 + reps ÷ 30), from your best set each session.</div></div>
    <p class="muted" style="font-size:0.75rem;margin-top:1rem">General guidance based on your log, not medical advice. Listen to your body.</p>
  `;
}

function shiftDays(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

let formGroup = GROUPS[0];

function renderForm() {
  app.innerHTML = `
    <h2>Golden rules</h2>
    <div class="card"><ul class="rules">${BASICS.map(([t, d]) => `<li><b>${t}.</b> ${d}</li>`).join("")}</ul></div>
    <h2>Exercise positioning</h2>
    <div class="chips" style="margin-bottom:0.8rem">${GROUPS.map(g => `<button class="chip${g === formGroup ? " on" : ""}" data-formgroup="${g}" type="button">${g}</button>`).join("")}</div>
    ${LIB[formGroup].map((x, i) => `<div class="card">${tipCard(x, i === 0)}</div>`).join("")}
  `;
}


function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function niceDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return d + " " + MONTHS[m - 1] + " " + y;
}

function daysAgo(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const [ty, tm, td] = today().split("-").map(Number);
  const n = Math.round((Date.UTC(ty, tm - 1, td) - Date.UTC(y, m - 1, d)) / 86400000);
  return n === 0 ? "today" : n === 1 ? "yesterday" : n + " days ago";
}

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
}

function save(log) {
  try { localStorage.setItem(KEY, JSON.stringify(log)); } catch (e) {}
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function setText(s) {
  return (s.w ? s.w + " kg × " : "") + s.r;
}

function totals(entries) {
  let sets = 0, reps = 0, vol = 0;
  entries.forEach(e => e.sets.forEach(s => { sets++; reps += s.r; vol += (s.w || 0) * s.r; }));
  return { sets, reps, vol: Math.round(vol) };
}

function render() {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.view === view));
  if (view === "log") renderLog();
  else if (view === "muscles") renderMuscles();
  else if (view === "coach") renderCoach();
  else if (view === "form") renderForm();
  else renderHistory();
}

        ${draft.map((s, i) => `
          <div class="set">

function dayView(entries, deletable) {
  if (!entries.length) return `<div class="empty">Nothing logged yet.</div>`;
  const byGroup = {};
  entries.forEach(e => (byGroup[e.group] = byGroup[e.group] || []).push(e));
  return Object.keys(byGroup).map(g => {
    const t = totals(byGroup[g]);
    return `<div class="card">
      <div class="row"><h3>${g}</h3><span class="muted">${t.sets} set${t.sets === 1 ? "" : "s"} · ${t.reps} reps</span></div>
      ${byGroup[g].map(e => `
        <div class="ex">
          <div class="row"><span>${esc(e.exercise)}</span>${deletable ? `<button class="del" data-del="${e.id}" type="button">Delete</button>` : ""}</div>
          <div class="setlist">${e.sets.map(s => `<span class="pill">${setText(s)}</span>`).join("")}</div>
        </div>`).join("")}
    </div>`;
  }).join("");
}

function weekStart(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const t = new Date(Date.UTC(y, m - 1, d));
  t.setUTCDate(t.getUTCDate() - (t.getUTCDay() + 6) % 7);
  return t.toISOString().slice(0, 10);
}

function lastWeeks() {
  const out = [];
  const t = new Date(weekStart(today()) + "T00:00:00Z");
  for (let i = WEEKS - 1; i >= 0; i--) {
    const w = new Date(t);
    w.setUTCDate(t.getUTCDate() - i * 7);
    out.push(w.toISOString().slice(0, 10));
  }
  return out;
}

function shortDate(iso) {
  const [, m, d] = iso.split("-").map(Number);
  return d + " " + MONTHS[m - 1];
}

function weekLabel(v) {
  const unit = metric === "vol" ? "kg moved" : METRICS[metric].toLowerCase();
  return v + " " + (v === 1 && metric !== "vol" ? unit.slice(0, -1) : unit);
}

function weeklyChart(entries) {
  const weeks = lastWeeks();
  const vals = weeks.map(w => totals(entries.filter(e => weekStart(e.date) === w))[metric]);
  const max = Math.max(...vals);
  if (!max) return `<div class="chart"><div class="tip">No ${METRICS[metric].toLowerCase()} in the last ${WEEKS} weeks.</div></div>`;
  const W = 320, H = 96, top = 14, base = H - 18, slot = W / WEEKS, bw = slot - 8;
  const cols = vals.map((v, i) => {
    const x = i * slot + 4, h = v ? Math.max(4, (v / max) * (base - top)) : 0, y = base - h, r = Math.min(4, h, bw / 2);
    const bar = v ? `<path class="b" d="M${x},${base} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${base} Z"/>` : "";
    const label = i === WEEKS - 1 || v === max ? `<text x="${x + bw / 2}" y="${y - 4}" text-anchor="middle" fill="#f2f2f2" font-size="10">${v}</text>` : "";
    const tick = i % 2 === 1 ? `<text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle" fill="#8a919e" font-size="9">${i === WEEKS - 1 ? "This wk" : shortDate(weeks[i])}</text>` : "";
    return `<g class="col" data-wk="${weeks[i]}" data-v="${v}"><rect x="${i * slot}" y="0" width="${slot}" height="${H}" fill="transparent"/>${bar}${label}${tick}</g>`;
  }).join("");
  const thisWk = vals[WEEKS - 1], lastWk = vals[WEEKS - 2];
  const diff = lastWk ? Math.round((thisWk - lastWk) / lastWk * 100) : null;
  const summary = `This week: <b>${weekLabel(thisWk)}</b>` + (diff === null ? "" : ` · ${diff >= 0 ? "▲" : "▼"} ${Math.abs(diff)}% vs last week`);
  return `<div class="chart">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly ${METRICS[metric].toLowerCase()}, last ${WEEKS} weeks: ${vals.join(", ")}">
      <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="#2a2e36" stroke-width="1"/>${cols}
    </svg>
    <div class="tip" data-summary="${esc(summary)}">${summary}</div>
  </div>`;
}

function renderMuscles() {
  const log = load();
  app.innerHTML = `<h2>Weekly progress · last ${WEEKS} weeks</h2>
    <div class="chips" style="margin-bottom:0.8rem">${Object.keys(METRICS).map(k => `<button class="chip${k === metric ? " on" : ""}" data-metric="${k}" type="button">${METRICS[k]}</button>`).join("")}</div>` + GROUPS.map(g => {
    const entries = log.filter(e => e.group === g);
    const t = totals(entries);
    const last = entries.map(e => e.date).sort().pop();
    const isOpen = openGroup === g;
    let detail = "";
    if (isOpen) {
      const byEx = {};
      entries.forEach(e => (byEx[e.exercise] = byEx[e.exercise] || []).push(e));
      detail = Object.keys(byEx).length ? Object.keys(byEx).map(name => {
        const list = byEx[name];
        const et = totals(list);
        let best = null;
        list.forEach(e => e.sets.forEach(s => {
          if (!best || (s.w || 0) > (best.w || 0) || ((s.w || 0) === (best.w || 0) && s.r > best.r)) best = s;
        }));
        const recent = list.slice().sort((a, b) => b.date.localeCompare(a.date))[0];
        return `<div class="ex">
          <div class="row"><span>${esc(name)}</span><span class="muted">${et.sets} set${et.sets === 1 ? "" : "s"} · ${et.reps} reps</span></div>
          <div class="muted" style="margin-top:0.25rem">Best: ${setText(best)} · Last: ${niceDate(recent.date)}</div>
          <div class="setlist">${recent.sets.map(s => `<span class="pill">${setText(s)}</span>`).join("")}</div>
        </div>`;
      }).join("") : `<div class="empty">No exercises yet.</div>`;
    }
    return `<div class="card" data-open="${g}" style="cursor:pointer">
      <div class="row"><h3>${g}</h3><span class="muted">${last ? "Last: " + daysAgo(last) : "Not trained yet"}</span></div>
      <div class="stats">
        <div class="stat"><strong>${t.sets}</strong><span>Sets</span></div>
        <div class="stat"><strong>${t.reps}</strong><span>Reps</span></div>
        <div class="stat"><strong>${t.vol}</strong><span>Kg moved</span></div>
      </div>
      <div class="muted" style="margin-top:0.25rem;font-size:0.7rem;letter-spacing:0.06em;text-transform:uppercase">All time</div>
      ${weeklyChart(entries)}
      ${detail}
    </div>`;
  }).join("");
}

function renderHistory() {
  const log = load();
  const dates = [...new Set(log.map(e => e.date))].sort().reverse();
  if (!dates.length) { app.innerHTML = `<h2>History</h2><div class="empty">No workouts yet.</div>`; return; }
  app.innerHTML = `<h2>History</h2>` + dates.map(d => {
    const entries = log.filter(e => e.date === d);
    const t = totals(entries);
    const groups = [...new Set(entries.map(e => e.group))].join(", ");
    return `<h2 style="color:var(--fg);text-transform:none;letter-spacing:0;font-size:1rem;font-weight:500">${niceDate(d)} <span class="muted">· ${groups} · ${t.sets} set${t.sets === 1 ? "" : "s"} · ${t.reps} reps</span></h2>${dayView(entries, true)}`;
  }).join("");
}

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { view = t.dataset.view; render(); }));

app.addEventListener("input", ev => {
  const el = ev.target;
  if (el.dataset.f) draft[+el.dataset.i][el.dataset.f] = el.value;
  else if (el.id === "exercise") { exercise = el.value; updateTip(); }
});

app.addEventListener("change", ev => {
  if (ev.target.id === "date" && ev.target.value) { date = ev.target.value; render(); }
});

app.addEventListener("click", ev => {
  const col = ev.target.closest(".col");
  if (col) { showWeek(col); return; }
  if (ev.target.closest(".chart")) return;
  const el = ev.target.closest("button, .card[data-open]");
  if (!el) return;
  if (el.dataset.formgroup) { formGroup = el.dataset.formgroup; render(); }
  else if (el.dataset.metric) { metric = el.dataset.metric; render(); }
  else if (el.dataset.group) { group = el.dataset.group; render(); }
  else if (el.id === "addSet") {
    const last = draft[draft.length - 1] || { w: "", r: "" };
    draft.push({ w: last.w, r: last.r });
    render();
  }
  else if (el.dataset.rm !== undefined) { draft.splice(+el.dataset.rm, 1); if (!draft.length) draft.push({ w: "", r: "" }); render(); }
  else if (el.id === "saveEx") {
    const name = exercise.trim();
    const sets = draft.filter(s => +s.r > 0).map(s => ({ w: +s.w > 0 ? +s.w : 0, r: Math.round(+s.r) }));
    if (!name) { flash = "Enter an exercise name."; render(); return; }
    if (!sets.length) { flash = "Add reps to at least one set."; render(); return; }
    const log = load();
    log.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date, group, exercise: name, sets });
    save(log);
    flash = `Saved ${name}: ${sets.length} set${sets.length > 1 ? "s" : ""}.`;
    exercise = "";
    draft = [{ w: "", r: "" }, { w: "", r: "" }, { w: "", r: "" }];
    render();
  }
  else if (el.dataset.del) {
    if (!confirm("Delete this exercise?")) return;
    save(load().filter(e => e.id !== el.dataset.del));
    render();
  }
  else if (el.dataset.open) { openGroup = openGroup === el.dataset.open ? "" : el.dataset.open; render(); }
});

function showWeek(col) {
  const chart = col.closest(".chart");
  chart.querySelectorAll(".col").forEach(c => c.classList.toggle("on", c === col));
  chart.querySelector(".tip").innerHTML = `Week of ${shortDate(col.dataset.wk)}: <b>${weekLabel(+col.dataset.v)}</b>`;
}

app.addEventListener("mouseover", ev => {
  const col = ev.target.closest(".col");
  if (col) showWeek(col);
});

app.addEventListener("mouseout", ev => {
  const chart = ev.target.closest(".chart");
  if (!chart || chart.contains(ev.relatedTarget)) return;
  chart.querySelectorAll(".col").forEach(c => c.classList.remove("on"));
  const tip = chart.querySelector(".tip");
  if (tip.dataset.summary) tip.innerHTML = tip.dataset.summary;
});

render();
</script>
</body>
</html>
