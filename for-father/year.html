<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Year Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&display=swap">
<link rel="stylesheet" href="common.css">
<style>
.yearbar { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 12px; }
.yearbar b { font-family: var(--display); font-weight: 400; font-size: 1.6rem; color: var(--fg); min-width: 4ch; text-align: center; }

/* The switch */
.switch { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin: 18px 0 6px; }
.switch .lab { font-family: var(--display); font-size: 1rem; color: var(--dim); cursor: pointer; transition: color .2s; }
.switch .lab:first-child { text-align: right; }
.switch .lab.on { color: var(--red); text-shadow: 0 0 12px rgba(225,6,0,.5); }
.switch .lab small { display: block; font-family: var(--body); font-size: .8rem; color: var(--dim); text-shadow: none; }
.toggle { width: 68px; height: 36px; border-radius: 18px; border: 2px solid var(--fg); background: #000; position: relative; padding: 0; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--red); transition: transform .25s; box-shadow: 0 0 10px rgba(225,6,0,.6); }
.toggle[aria-checked="true"]::after { transform: translateX(32px); background: var(--fg); box-shadow: none; }

.entry { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px dashed var(--line); }
.entry:first-child { border-top: 0; }
.entry .ic { font-size: 1.3rem; line-height: 1.2; }
.entry .body { flex: 1; min-width: 0; }
.entry .t { font-weight: 600; font-size: 1.05rem; overflow-wrap: anywhere; white-space: pre-wrap; }
.entry .m { font-size: .8rem; color: var(--dim); margin-top: 2px; }
.entry.fixed .t { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--red); }
.entry .m .ok { color: var(--fg); font-weight: 700; }
.pane-title { display: flex; justify-content: space-between; align-items: baseline; }
.pane-title .n { font-family: var(--display); color: var(--red); font-size: 1.4rem; }
</style>
</head>
<body>
<div class="father" aria-hidden="true"></div>
<main>
  <div class="top"><a href="./">← In His Name</a><span id="today"></span></div>
  <section class="hero">
    <h1>YEAR REVIEW</h1>
    <div class="sub">What I won. What I must fix.</div>
    <div class="yearbar">
      <button class="ghost" id="prev" aria-label="Previous year">◀</button>
      <b id="year"></b>
      <button class="ghost" id="next" aria-label="Next year">▶</button>
    </div>
  </section>

  <div class="switch">
    <div class="lab" data-side="won">ACHIEVEMENTS<small id="cWon">0</small></div>
    <button class="toggle" id="toggle" role="switch" aria-checked="false" aria-label="Show things to improve"></button>
    <div class="lab" data-side="fix">NEED TO IMPROVE<small id="cFix">0</small></div>
  </div>

  <section class="card red">
    <div class="pane-title"><h2 id="paneH"></h2><span class="n" id="paneN"></span></div>
    <form class="add" id="addForm">
      <input id="text" maxlength="200">
      <button class="primary">Add</button>
    </form>
    <p class="hint" id="paneHint"></p>
  </section>

  <section class="card"><div id="list"></div></section>
  <footer>For my father. For his name.</footer>
</main>

<script>
const KEY = "inHisName.year.v1";
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || { years: {} }; } catch { S = { years: {} }; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dk = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const pretty = k => new Date(k + "T12:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short" });

const NOW = new Date().getFullYear();
let year = NOW, side = "won";
try { if (sessionStorage.getItem("yrSide") === "fix") side = "fix"; } catch {}
const Y = () => (S.years[year] = S.years[year] || { won: [], fix: [] });

const PANES = {
  won: { h: "Achievements", ph: "e.g. Uploaded my first video, rode 10 km solo", hint: "Big or small. If you are proud of it, it goes here.", empty: "Nothing written yet. Even small wins count." },
  fix: { h: "Need to Improve", ph: "e.g. I postpone tasks, too much screen time at night", hint: "Be honest. Tap the box when you have fixed it and it moves into your wins.", empty: "Nothing here. Be honest with yourself." },
};

function render() {
  $("#today").textContent = new Date().toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  $("#year").textContent = year;
  $("#next").disabled = year >= NOW;
  const y = Y(), P = PANES[side];
  $("#toggle").setAttribute("aria-checked", side === "fix");
  document.querySelectorAll(".lab").forEach(l => l.classList.toggle("on", l.dataset.side === side));
  $("#cWon").textContent = y.won.length + " written";
  $("#cFix").textContent = y.fix.filter(f => !f.done).length + " open · " + y.fix.filter(f => f.done).length + " fixed";
  $("#paneH").textContent = P.h;
  $("#paneN").textContent = y[side].length;
  $("#text").placeholder = P.ph;
  $("#paneHint").textContent = P.hint;
  const items = y[side].map((e, i) => ({ ...e, i })).reverse();
  $("#list").innerHTML = items.map(e => side === "won"
    ? `<div class="entry"><div class="ic">🏆</div><div class="body"><div class="t">${esc(e.text)}</div><div class="m">${pretty(e.date)}${e.from ? " · was something to improve" : ""}</div></div><button class="ghost" data-del="${e.i}" aria-label="Delete">✕</button></div>`
    : `<div class="entry ${e.done ? "fixed" : ""}"><button class="box ${e.done ? "on" : ""}" data-fix="${e.i}" aria-label="Mark improved">${e.done ? "✓" : ""}</button><div class="body"><div class="t">${esc(e.text)}</div><div class="m">Noted ${pretty(e.date)}${e.done ? ` · <span class="ok">Improved ${pretty(e.done)}</span>` : ""}</div></div><button class="ghost" data-del="${e.i}" aria-label="Delete">✕</button></div>`
  ).join("") || `<div class="empty">${P.empty}</div>`;
}

function setSide(s) { side = s; try { sessionStorage.setItem("yrSide", s); } catch {} render(); }
$("#toggle").onclick = () => setSide(side === "won" ? "fix" : "won");
document.querySelectorAll(".lab").forEach(l => l.onclick = () => setSide(l.dataset.side));
$("#prev").onclick = () => { year--; render(); };
$("#next").onclick = () => { if (year < NOW) { year++; render(); } };

$("#addForm").onsubmit = e => {
  e.preventDefault();
  const text = $("#text").value.trim();
  if (!text) return;
  Y()[side].push({ text, date: dk(new Date()) });
  $("#text").value = ""; save(); render();
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-del],[data-fix]");
  if (!b) return;
  const y = Y();
  if (b.dataset.del && confirm("Delete this entry?")) y[side].splice(b.dataset.del, 1);
  if (b.dataset.fix) {
    const f = y.fix[b.dataset.fix];
    if (f.done) {           // undo: also remove the win it created
      const w = y.won.findIndex(x => x.from === f.date + f.text);
      if (w > -1) y.won.splice(w, 1);
      f.done = "";
    } else {
      f.done = dk(new Date());
      y.won.push({ text: "Improved: " + f.text, date: f.done, from: f.date + f.text });
    }
  }
  save(); render();
});
render();
</script>
</body>
</html>
