<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>My Streaks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&display=swap">
<link rel="stylesheet" href="common.css">
<script src="points.js"></script>
<style>
.habit .head { display: flex; align-items: center; gap: 12px; }
.habit .name { font-weight: 700; font-size: 1.1rem; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.habit .fire { text-align: right; }
.habit .fire b { font-family: var(--display); font-weight: 400; font-size: 1.8rem; color: var(--red); line-height: 1; }
.habit .fire small { display: block; font-size: .7rem; letter-spacing: .15em; color: var(--dim); text-transform: uppercase; }
.habit.today { border-color: var(--red); }
.days { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; margin-top: 12px; }
.days button { aspect-ratio: 1; padding: 0; border-radius: 3px; font-size: .62rem; letter-spacing: 0; color: var(--dim); background: rgba(255,255,255,.06); border: 1px solid transparent; }
.days button.on { background: var(--red); color: #fff; }
.days button.now { border-color: var(--fg); }
.meta { display: flex; justify-content: space-between; margin-top: 8px; }
.tipbtn { background: none; border: 1px solid var(--line); border-radius: 50%; width: 38px; height: 38px; padding: 0; font-size: 1.15rem; letter-spacing: 0; position: relative; flex: 0 0 38px; }
.tipbtn.open { border-color: var(--red); background: var(--red-dim); }
.tipbtn sup { position: absolute; top: -6px; right: -6px; background: var(--red); color: #fff; font-family: var(--body); font-size: .68rem; font-weight: 700; min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px; padding: 0 4px; }
.tips { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.tips h3 { font-size: .95rem; margin: 0 0 8px; }
.tip { display: flex; gap: 8px; align-items: flex-start; padding: 7px 0; border-top: 1px dashed var(--line); }
.tip:first-of-type { border-top: 0; }
.tip span { flex: 1; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.tip::before { content: "•"; color: var(--red); font-weight: 700; }
.tips form { margin-top: 8px; }
.big { width: 40px; height: 40px; flex-basis: 40px; font-size: 1.2rem; }
</style>
</head>
<body>
<div class="father" aria-hidden="true"></div>
<main>
  <div class="top"><a href="./">← In His Name</a><span><b id="myPoints" class="pts"></b> · <span id="today"></span></span></div>
  <section class="hero">
    <h1>MY STREAKS</h1>
    <div class="sub">One day at a time. Do not break the chain.</div>
  </section>

  <section class="card red">
    <h2>Add a streak</h2>
    <form class="add" id="addForm">
      <input id="name" placeholder="e.g. Pray 5 min, No sugar, Talk to Amma" maxlength="80">
      <button class="primary">Add</button>
    </form>
    <p class="hint">Tap the big box each day you do it. Forgot to log? Tap any of the last 14 days to fix it.</p>
    <p class="hint"><b class="pts">+2</b> per day · <b class="pts">+20</b> at 7 days · <b class="pts">+75</b> at 30 · <b class="pts">+250</b> at 100. Un-ticking takes the points back.</p>
  </section>

  <div id="list"></div>
  <footer>For my father. For his name.</footer>
</main>

<script>
const KEY = "inHisName.streaks.v1";
const DAY_PTS = 2, MILESTONES = [[7, 20], [30, 75], [100, 250]];
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || { habits: [] }; } catch { S = { habits: [] }; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dk = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const back = n => { const d = new Date(); d.setDate(d.getDate() - n); return d; };

function current(h) {
  let n = h.days[dk(back(0))] ? 0 : 1, c = 0;   // today not done yet still keeps yesterday's chain
  while (h.days[dk(back(n))]) { c++; n++; }
  return c;
}
function best(h) {
  const ds = Object.keys(h.days).filter(k => h.days[k]).sort();
  let b = 0, run = 0, prev = null;
  ds.forEach(k => {
    const t = new Date(k + "T12:00:00");
    run = prev && Math.round((t - prev) / 864e5) === 1 ? run + 1 : 1;
    b = Math.max(b, run); prev = t;
  });
  return b;
}

function render() {
  $("#today").textContent = new Date().toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  const t = dk(new Date());
  $("#list").innerHTML = S.habits.map((h, i) => {
    const done = !!h.days[t];
    const days = Array.from({ length: 14 }, (_, j) => {
      const d = back(13 - j), k = dk(d);
      return `<button data-day="${i}|${k}" class="${h.days[k] ? "on" : ""} ${j === 13 ? "now" : ""}" title="${k}">${d.getDate()}</button>`;
    }).join("");
    const total = Object.values(h.days).filter(Boolean).length;
    return `<div class="card habit ${done ? "today" : ""}">
      <div class="head">
        <button class="box big ${done ? "on" : ""}" data-day="${i}|${t}" aria-label="Done today">${done ? "✓" : ""}</button>
        <div class="name">${esc(h.name)}</div>
        <button class="tipbtn ${openTips.has(i) ? "open" : ""}" data-tips="${i}" aria-label="Tips and tricks" title="Tips and tricks">💡${(h.tips || []).length ? `<sup>${h.tips.length}</sup>` : ""}</button>
        <div class="fire"><b>${current(h)}</b><small>day streak</small></div>
      </div>
      <div class="days">${days}</div>
      <div class="meta"><span class="hint">Best ${best(h)} · ${total} days total</span><button class="ghost" data-del="${i}">Delete</button></div>
      ${openTips.has(i) ? `<div class="tips">
        <h3>Tips &amp; tricks</h3>
        ${(h.tips || []).map((t, j) => `<div class="tip"><span>${esc(t)}</span><button class="ghost" data-tipdel="${i}|${j}" aria-label="Delete tip">✕</button></div>`).join("") || `<div class="hint">What helps you keep this going? Write it here for the hard days.</div>`}
        <form class="add" data-tipadd="${i}"><input placeholder="e.g. Lay out the mat the night before" maxlength="200"><button class="primary">Add</button></form>
      </div>` : ""}
    </div>`;
  }).join("") || `<div class="card empty">No streaks yet. Add the first thing you will do every day.</div>`;
}

const openTips = new Set();
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-tipadd]");
  if (!f) return;
  e.preventDefault();
  const i = +f.dataset.tipadd, v = f.querySelector("input").value.trim();
  if (!v) return;
  (S.habits[i].tips = S.habits[i].tips || []).push(v);
  save(); render();
  document.querySelector(`[data-tipadd="${i}"] input`).focus();
});
$("#addForm").onsubmit = e => {
  e.preventDefault();
  const n = $("#name").value.trim();
  if (!n) return;
  S.habits.push({ name: n, created: dk(new Date()), days: {} });
  $("#name").value = ""; save(); render();
};
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.tips) {
    const i = +b.dataset.tips;
    openTips.has(i) ? openTips.delete(i) : openTips.add(i);
    render();
    if (openTips.has(i)) document.querySelector(`[data-tipadd="${i}"] input`).focus();
    return;
  }
  if (b.dataset.tipdel) {
    const [i, j] = b.dataset.tipdel.split("|").map(Number);
    S.habits[i].tips.splice(j, 1); save(); render(); return;
  }
  if (b.dataset.day) {
    const [i, k] = b.dataset.day.split("|"), h = S.habits[i];
    h.paid = h.paid || {}; h.ms = h.ms || {};
    let change = 0;
    if (h.days[k]) { delete h.days[k]; change -= h.paid[k] || 0; delete h.paid[k]; }
    else { h.days[k] = true; h.paid[k] = DAY_PTS; change += DAY_PTS; }
    const run = best(h);
    let note = "";
    MILESTONES.forEach(([m, p]) => {
      if (run >= m && !h.ms[m]) { h.ms[m] = p; change += p; note = " · " + m + "-day milestone!"; }
      else if (run < m && h.ms[m]) { change -= h.ms[m]; delete h.ms[m]; }
    });
    save();
    if (change) { awardPoints(change); pointsToast((change > 0 ? "+" : "") + change + " points" + note); }
    render();
  }
  if (b.dataset.del && confirm("Delete \"" + S.habits[b.dataset.del].name + "\" and its history?")) {
    S.habits.splice(b.dataset.del, 1); openTips.clear(); save(); render();
  }
});
render();
showPoints();
</script>
</body>
</html>
