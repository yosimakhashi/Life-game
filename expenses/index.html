<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2f7d6d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Expenses">
<title>My Expenses</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
    --bg: #f7f4ee;
    --panel: #ffffff;
    --soft: #f1ece3;
    --border: #e4ddd0;
    --text: #2b2622;
    --dim: #6f665d;
    --main: #2f7d6d;
    --main-dark: #245f53;
    --main-soft: #e1f0ec;
    --good: #2e7d32;
    --good-soft: #e5f3e6;
    --bad: #c0392b;
    --bad-soft: #fbe7e4;
    --warn: #b7791f;
    --shadow: 0 2px 12px rgba(60, 40, 20, 0.07);
}

html { font-size: 18px; }
body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans', 'Noto Sans Malayalam', system-ui, sans-serif;
    line-height: 1.4;
    padding-bottom: calc(120px + env(safe-area-inset-bottom));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

/* ---------- top bar ---------- */
.topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 18px 0 8px;
}
.topbar h1 { margin: 0; font-size: 1.35rem; }
.lang-btn {
    border: 2px solid var(--border); background: var(--panel); border-radius: 999px;
    padding: 6px 14px; font-weight: 600; font-size: 0.9rem; min-height: 44px;
}

/* ---------- month switcher ---------- */
.month-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel); border-radius: 18px; box-shadow: var(--shadow);
    padding: 6px; margin: 8px 0 14px;
}
.month-bar button {
    width: 56px; height: 56px; border: 0; border-radius: 14px;
    background: var(--soft); font-size: 1.6rem; font-weight: 700; color: var(--main-dark);
}
.month-bar button:disabled { opacity: 0.3; cursor: default; }
.month-bar .label { text-align: center; font-weight: 700; font-size: 1.15rem; }
.month-bar .label small { display: block; font-weight: 400; font-size: 0.8rem; color: var(--dim); }

/* ---------- big total card ---------- */
.total-card {
    background: linear-gradient(145deg, var(--main), var(--main-dark));
    color: #fff; border-radius: 22px; padding: 22px 20px; box-shadow: var(--shadow);
    text-align: center;
}
.total-card .cap { font-size: 1rem; opacity: 0.9; }
.total-card .big { font-size: 2.8rem; font-weight: 700; line-height: 1.1; margin: 4px 0 6px; word-break: break-word; }
.total-card .compare {
    display: inline-block; background: rgba(255,255,255,0.18); border-radius: 999px;
    padding: 5px 14px; font-size: 0.9rem;
}

.mini-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.mini {
    background: var(--panel); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow);
}
.mini .cap { font-size: 0.85rem; color: var(--dim); }
.mini .val { font-size: 1.4rem; font-weight: 700; margin-top: 2px; }

/* ---------- budget ---------- */
.budget {
    background: var(--panel); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); margin-top: 12px;
}
.budget .line { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.budget .left { font-weight: 700; font-size: 1.15rem; }
.budget .left.ok { color: var(--good); }
.budget .left.over { color: var(--bad); }
.bar { height: 16px; background: var(--soft); border-radius: 999px; overflow: hidden; margin-top: 10px; }
.bar > div { height: 100%; border-radius: 999px; background: var(--main); transition: width .3s; }
.bar > div.warn { background: var(--warn); }
.bar > div.over { background: var(--bad); }
.set-budget {
    width: 100%; margin-top: 12px; min-height: 52px; border-radius: 14px;
    border: 2px dashed var(--border); background: transparent; color: var(--dim); font-weight: 600;
}

/* ---------- sections ---------- */
h2.section { font-size: 1.15rem; margin: 26px 4px 10px; }
.card { background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }

/* category breakdown */
.cat-row {
    display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center;
    padding: 12px 14px; border: 0; border-bottom: 1px solid var(--soft); width: 100%;
    background: transparent; text-align: left;
}
.cat-row:last-child { border-bottom: 0; }
.cat-row.active { background: var(--main-soft); }
.icon {
    width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center;
    font-size: 1.6rem; background: var(--soft);
}
.cat-row .name { font-weight: 600; }
.cat-row .pbar { height: 8px; background: var(--soft); border-radius: 999px; margin-top: 6px; overflow: hidden; }
.cat-row .pbar > div { height: 100%; border-radius: 999px; }
.cat-row .amt { font-weight: 700; text-align: right; }
.cat-row .amt small { display: block; font-weight: 400; color: var(--dim); font-size: 0.8rem; }

.filter-note {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: var(--main-soft); border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; font-weight: 600;
}
.filter-note button {
    border: 0; background: var(--panel); border-radius: 10px; padding: 8px 14px; font-weight: 600; min-height: 44px;
}

/* expense list */
.day-head {
    display: flex; justify-content: space-between; padding: 12px 16px 8px;
    background: var(--soft); font-weight: 700; font-size: 0.95rem; color: var(--dim);
}
.item {
    display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center;
    width: 100%; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--soft);
    background: var(--panel); text-align: left;
}
.item:active { background: var(--main-soft); }
.item .name { font-weight: 600; }
.item .note { color: var(--dim); font-size: 0.88rem; word-break: break-word; }
.item .amt { font-weight: 700; font-size: 1.1rem; white-space: nowrap; }

.empty {
    text-align: center; padding: 34px 20px; color: var(--dim);
}
.empty .emoji { font-size: 3rem; }

/* ---------- floating add button ---------- */
.add-fab {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom));
    width: min(528px, calc(100% - 32px)); min-height: 68px;
    border: 0; border-radius: 20px; background: var(--main); color: #fff;
    font-size: 1.3rem; font-weight: 700; box-shadow: 0 8px 24px rgba(47, 125, 109, 0.4);
    display: flex; align-items: center; justify-content: center; gap: 10px; z-index: 10;
}
.add-fab span.plus { font-size: 2rem; line-height: 1; }

/* ---------- settings / footer buttons ---------- */
.tools { display: grid; gap: 10px; margin-top: 26px; }
.tool-btn {
    display: flex; align-items: center; gap: 14px; width: 100%; min-height: 60px;
    border: 0; background: var(--panel); border-radius: 16px; padding: 10px 16px;
    box-shadow: var(--shadow); font-weight: 600; text-align: left;
}
.tool-btn .ic { font-size: 1.5rem; width: 32px; text-align: center; }
.tool-btn small { display: block; font-weight: 400; color: var(--dim); font-size: 0.82rem; }

/* ---------- sheets (popups) ---------- */
.sheet-back {
    position: fixed; inset: 0; background: rgba(30, 25, 20, 0.45); z-index: 20;
    display: none; align-items: flex-end; justify-content: center;
}
.sheet-back.open { display: flex; }
.sheet {
    background: var(--bg); width: 100%; max-width: 560px; max-height: 94vh; max-height: 94dvh; overflow-y: auto;
    border-radius: 24px 24px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
    animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet h3 { margin: 4px 4px 14px; font-size: 1.3rem; text-align: center; }
.field-label { font-weight: 700; margin: 16px 4px 8px; display: block; }

.amount-box {
    display: flex; align-items: center; background: var(--panel); border: 3px solid var(--main);
    border-radius: 18px; padding: 6px 16px;
}
.amount-box .rs { font-size: 2.2rem; font-weight: 700; color: var(--main-dark); margin-right: 6px; }
.amount-box input {
    border: 0; outline: 0; background: transparent; width: 100%;
    font-size: 2.4rem; font-weight: 700; padding: 6px 0;
}
.quick-amts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.quick-amts button {
    flex: 1; min-width: 70px; min-height: 48px; border: 2px solid var(--border);
    background: var(--panel); border-radius: 12px; font-weight: 600;
}

.cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cat-btn {
    border: 3px solid transparent; background: var(--panel); border-radius: 16px;
    padding: 10px 4px; min-height: 92px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px; box-shadow: var(--shadow);
    font-size: 0.8rem; font-weight: 600; line-height: 1.2; text-align: center;
}
.cat-btn .e { font-size: 1.9rem; }
.cat-btn.sel { border-color: var(--main); background: var(--main-soft); }

.day-pick { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.day-pick button, .day-pick label {
    min-height: 54px; border: 3px solid transparent; background: var(--panel); border-radius: 14px;
    font-weight: 600; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center;
    position: relative; text-align: center; padding: 4px;
}
.day-pick .sel { border-color: var(--main); background: var(--main-soft); }
.day-pick input[type=date] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }

.text-input {
    width: 100%; min-height: 56px; border: 2px solid var(--border); border-radius: 14px;
    background: var(--panel); padding: 10px 14px; outline: 0;
}
.text-input:focus { border-color: var(--main); }

.sheet-actions {
    display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin: 18px -16px 0;
    position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom)); z-index: 2;
    background: var(--bg); padding: 12px 16px calc(20px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
}
.btn {
    min-height: 60px; border-radius: 16px; border: 0; font-weight: 700; font-size: 1.1rem;
}
.btn.primary { background: var(--main); color: #fff; }
.btn.primary:disabled { background: #a9c9c1; }
.btn.plain { background: var(--soft); }
.btn.danger { background: var(--bad-soft); color: var(--bad); width: 100%; margin-top: 12px; }
.btn.full { width: 100%; margin-top: 10px; }
.error { color: var(--bad); font-weight: 600; margin: 8px 4px 0; }
.error:empty { display: none; }
.help { color: var(--dim); font-size: 0.9rem; margin: 6px 4px; }

.warn-box {
    display: none; margin-top: 14px; background: var(--bad-soft); color: var(--bad);
    border: 2px solid var(--bad); border-radius: 14px; padding: 12px 14px; font-weight: 600;
}

/* toast */
.toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 30;
    background: #2b2622; color: #fff; border-radius: 14px; padding: 12px 16px;
    display: none; align-items: center; gap: 16px; box-shadow: 0 6px 20px rgba(0,0,0,.25);
    width: max-content; max-width: calc(100% - 32px); font-weight: 600;
}
.toast.show { display: flex; }
.toast button {
    border: 0; background: #fff; color: var(--text); border-radius: 10px; padding: 8px 14px; font-weight: 700;
}
</style>
</head>
<body>

<div class="wrap">
    <div class="warn-box" id="warn"></div>
    <div class="topbar">
        <h1 data-t="title"></h1>
        <button class="lang-btn" id="langBtn"></button>
    </div>

    <div class="month-bar">
        <button id="prevMonth" aria-label="Previous month">‹</button>
        <div class="label" id="monthLabel"></div>
        <button id="nextMonth" aria-label="Next month">›</button>
    </div>

    <div class="total-card">
        <div class="cap" id="totalCap"></div>
        <div class="big" id="totalBig"></div>
        <div class="compare" id="compare"></div>
    </div>

    <div class="mini-row">
        <div class="mini"><div class="cap" data-t="today"></div><div class="val" id="todayVal"></div></div>
        <div class="mini"><div class="cap" data-t="thisWeek"></div><div class="val" id="weekVal"></div></div>
    </div>

    <div class="budget" id="budgetBox"></div>

    <h2 class="section" data-t="whereWent"></h2>
    <div class="card" id="cats"></div>

    <h2 class="section" data-t="allSpends"></h2>
    <div id="filterNote"></div>
    <div class="card" id="list"></div>

    <div class="tools">
        <button class="tool-btn" id="shareBtn"><span class="ic">💬</span><span><span data-t="share"></span><small data-t="shareSub"></small></span></button>
        <button class="tool-btn" id="settingsBtn"><span class="ic">⚙️</span><span><span data-t="settings"></span><small data-t="settingsSub"></small></span></button>
    </div>
</div>

<button class="add-fab" id="addBtn"><span class="plus">+</span><span data-t="addExpense"></span></button>

<!-- add / edit sheet -->
<div class="sheet-back" id="editBack">
    <div class="sheet" role="dialog" aria-modal="true">
        <h3 id="editTitle"></h3>

        <label class="field-label" for="amountIn" data-t="howMuch"></label>
        <div class="amount-box">
            <span class="rs">₹</span>
            <input id="amountIn" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
        </div>
        <div class="quick-amts" id="quickAmts"></div>

        <span class="field-label" data-t="whatFor"></span>
        <div class="cat-grid" id="catGrid"></div>

        <span class="field-label" data-t="when"></span>
        <div class="day-pick" id="dayPick">
            <button type="button" data-day="today"></button>
            <button type="button" data-day="yesterday"></button>
            <label id="otherDay"><span></span><input type="date" id="dateIn"></label>
        </div>

        <label class="field-label" for="noteIn" data-t="note"></label>
        <input class="text-input" id="noteIn" type="text" maxlength="80" autocomplete="off">

        <button class="btn danger" id="deleteEdit" data-t="delete"></button>

        <div class="sheet-actions">
            <div class="error" id="editErr" style="grid-column:1/-1;margin:0"></div>
            <button class="btn plain" id="cancelEdit" data-t="cancel"></button>
            <button class="btn primary" id="saveEdit" data-t="save"></button>
        </div>
    </div>
</div>

<!-- settings sheet -->
<div class="sheet-back" id="setBack">
    <div class="sheet" role="dialog" aria-modal="true">
        <h3 data-t="settings"></h3>

        <label class="field-label" for="budgetIn" data-t="monthlyBudget"></label>
        <div class="amount-box">
            <span class="rs">₹</span>
            <input id="budgetIn" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
        </div>
        <p class="help" data-t="budgetHelp"></p>
        <button class="btn primary full" id="saveBudget" data-t="saveBudget"></button>

        <span class="field-label" data-t="backup"></span>
        <p class="help" data-t="backupHelp"></p>
        <button class="btn plain full" id="exportBtn" data-t="downloadBackup"></button>
        <button class="btn plain full" id="csvBtn" data-t="downloadExcel"></button>
        <button class="btn plain full" id="importBtn" data-t="restoreBackup"></button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>

        <span class="field-label" data-t="homeScreen"></span>
        <p class="help" data-t="homeScreenHelp"></p>

        <button class="btn plain full" id="closeSet" data-t="close"></button>
    </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" data-t="undo"></button></div>

<script>
window.onerror = function (msg) {
    var w = document.getElementById('warn');
    if (w) { w.textContent = '⚠️ Error: ' + msg + ' — please send a screenshot of this to your son.'; w.style.display = 'block'; }
};

/* ---------- storage ---------- */
function load() {
    try {
        const d = JSON.parse(localStorage.getItem(STORE));
        if (d && Array.isArray(d.items)) return { items: d.items, budget: d.budget || 0, lang: d.lang || 'en' };
    } catch (e) { /* fall through */ }
    return { items: [], budget: 0, lang: 'en' };
}
let state = load();

function save() {
    const json = JSON.stringify(state);
    try {
        localStorage.setItem(STORE, json);
        if (localStorage.getItem(STORE) === json) return true;
    } catch (e) { /* fall through */ }
    showWarning();
    alert(t('storageFail'));
    return false;
}
function storageWorks() {
    try {
        localStorage.setItem(STORE + '.test', '1');
        const ok = localStorage.getItem(STORE + '.test') === '1';
        localStorage.removeItem(STORE + '.test');
        return ok;
    } catch (e) { return false; }
}
function showWarning() {
    $('warn').textContent = '⚠️ ' + t('storageFail');
    $('warn').style.display = 'block';
}
// Ask the browser not to clear our data when space runs low.
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function t(key, vars) {
    let s = (WORDS[state.lang] && WORDS[state.lang][key]) || WORDS.en[key] || key;
    if (vars) for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
    return s;
}
const locale = () => state.lang === 'ml' ? 'ml-IN' : 'en-IN';
function money(n) {
    return '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 });
}
function pad(n) { return String(n).padStart(2, '0'); }
function isoDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseIso(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function todayIso() { return isoDate(new Date()); }
function yesterdayIso() { const d = new Date(); d.setDate(d.getDate() - 1); return isoDate(d); }
function monthKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function monthName(key, withYear = true) {
    const [y, m] = key.split('-').map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString(locale(), withYear ? { month: 'long', year: 'numeric' } : { month: 'long' });
}
function shiftMonth(key, delta) {
    const [y, m] = key.split('-').map(Number);
    return monthKey(new Date(y, m - 1 + delta, 1));
}
function catName(id) { const c = CAT[id] || CAT.other; return c[state.lang] || c.en; }
function sum(list) { return list.reduce((s, x) => s + x.amount, 0); }
function parseAmount(str) {
    const n = parseFloat(String(str).replace(/[₹,\s]/g, ''));
    return isFinite(n) ? Math.round(n * 100) / 100 : NaN;
}
function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function dayLabel(iso) {
    if (iso === todayIso()) return t('today');
    if (iso === yesterdayIso()) return t('yesterday');
    return parseIso(iso).toLocaleDateString(locale(), { weekday: 'long', day: 'numeric', month: 'long' });
}

/* ---------- view state ---------- */
let viewMonth = monthKey(new Date());
let filterCat = null;

/* ---------- render ---------- */
function renderWords() {
    document.documentElement.lang = state.lang;
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    $('langBtn').textContent = t('langSwitch');
    document.title = t('title');
}

function render() {
    const now = new Date();
    const thisMonth = monthKey(now);
    const monthItems = state.items.filter(x => x.date.startsWith(viewMonth));
    const total = sum(monthItems);

    // month bar
    $('monthLabel').textContent = monthName(viewMonth);
    $('nextMonth').disabled = viewMonth >= thisMonth;

    // big total
    $('totalCap').textContent = t('spentIn', { m: monthName(viewMonth, false) });
    $('totalBig').textContent = money(total);
    const last = sum(state.items.filter(x => x.date.startsWith(shiftMonth(viewMonth, -1))));
    let cmp;
    if (!last) cmp = t('noLast');
    else if (Math.abs(total - last) < 0.005) cmp = t('sameAsLast');
    else if (total < last) cmp = t('lessThanLast', { a: money(last - total) });
    else cmp = t('moreThanLast', { a: money(total - last) });
    $('compare').textContent = cmp;

    // today & this week (always about the real today)
    const tIso = todayIso();
    $('todayVal').textContent = money(sum(state.items.filter(x => x.date === tIso)));
    const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7)); // Monday
    const wIso = isoDate(weekStart);
    $('weekVal').textContent = money(sum(state.items.filter(x => x.date >= wIso && x.date <= tIso)));

    // budget
    const bb = $('budgetBox');
    if (state.budget > 0) {
        const pct = Math.min(100, total / state.budget * 100);
        const over = total > state.budget;
        const cls = over ? 'over' : pct >= 80 ? 'warn' : '';
        bb.innerHTML =
            '<div class="line"><span class="left ' + (over ? 'over' : 'ok') + '">' +
            esc(over ? t('budgetOver', { a: money(total - state.budget) }) : t('budgetLeft', { a: money(state.budget - total) })) +
            '</span><span style="color:var(--dim)">' + esc(t('budgetOf', { a: money(state.budget) })) + '</span></div>' +
            '<div class="bar"><div class="' + cls + '" style="width:' + pct + '%"></div></div>';
    } else {
        bb.innerHTML = '<button class="set-budget" id="setBudgetBtn">' + esc(t('setBudget')) + '</button>';
        $('setBudgetBtn').onclick = openSettings;
    }

    // category breakdown
    const byCat = {};
    monthItems.forEach(x => { byCat[x.cat] = (byCat[x.cat] || 0) + x.amount; });
    const catList = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a]);
    if (filterCat && !byCat[filterCat]) filterCat = null;
    const catsEl = $('cats');
    if (!catList.length) {
        catsEl.innerHTML = '<div class="empty"><div class="emoji">🌼</div>' + esc(t('nothingYet')) + '<br>' + esc(t('tapAdd')) + '</div>';
    } else {
        catsEl.innerHTML = catList.map(id => {
            const c = CAT[id] || CAT.other;
            const pct = total ? Math.round(byCat[id] / total * 100) : 0;
            return '<button class="cat-row' + (filterCat === id ? ' active' : '') + '" data-cat="' + id + '">' +
                '<span class="icon" style="background:' + c.color + '22">' + c.e + '</span>' +
                '<span><span class="name">' + esc(catName(id)) + '</span>' +
                '<div class="pbar"><div style="width:' + pct + '%;background:' + c.color + '"></div></div></span>' +
                '<span class="amt">' + money(byCat[id]) + '<small>' + pct + '%</small></span></button>';
        }).join('');
        catsEl.querySelectorAll('.cat-row').forEach(b => b.onclick = () => {
            filterCat = filterCat === b.dataset.cat ? null : b.dataset.cat;
            render();
            if (filterCat) $('filterNote').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    }

    // filter note
    $('filterNote').innerHTML = filterCat
        ? '<div class="filter-note"><span>' + CAT[filterCat].e + ' ' + esc(t('showingOnly', { c: catName(filterCat) })) +
          '</span><button id="clearFilter">' + esc(t('showAll')) + '</button></div>'
        : '';
    if (filterCat) $('clearFilter').onclick = () => { filterCat = null; render(); };

    // list grouped by day
    const shown = monthItems.filter(x => !filterCat || x.cat === filterCat)
        .sort((a, b) => b.date.localeCompare(a.date) || b.ts - a.ts);
    const listEl = $('list');
    if (!shown.length) {
        listEl.innerHTML = '<div class="empty"><div class="emoji">📝</div>' + esc(t('nothingYet')) + '</div>';
    } else {
        let html = '', curDay = null;
        const dayTotals = {};
        shown.forEach(x => { dayTotals[x.date] = (dayTotals[x.date] || 0) + x.amount; });
        shown.forEach(x => {
            if (x.date !== curDay) {
                curDay = x.date;
                html += '<div class="day-head"><span>' + esc(dayLabel(x.date)) + '</span><span>' + money(dayTotals[x.date]) + '</span></div>';
            }
            const c = CAT[x.cat] || CAT.other;
            html += '<button class="item" data-id="' + x.id + '">' +
                '<span class="icon" style="background:' + c.color + '22">' + c.e + '</span>' +
                '<span><div class="name">' + esc(catName(x.cat)) + '</div>' +
                (x.note ? '<div class="note">' + esc(x.note) + '</div>' : '') + '</span>' +
                '<span class="amt">' + money(x.amount) + '</span></button>';
        });
        listEl.innerHTML = html;
        listEl.querySelectorAll('.item').forEach(b => b.onclick = () => openEdit(b.dataset.id));
    }
}

/* ---------- add / edit ---------- */
let editing = null;   // id being edited, or null for new
let selCat = null;
let selDate = todayIso();

function buildCatGrid() {
    $('catGrid').innerHTML = CATS.map(c =>
        '<button type="button" class="cat-btn" data-cat="' + c.id + '"><span class="e">' + c.e + '</span>' + esc(c[state.lang] || c.en) + '</button>'
    ).join('');
    $('catGrid').querySelectorAll('.cat-btn').forEach(b => b.onclick = () => { selCat = b.dataset.cat; paintEdit(); $('editErr').textContent = ''; });
    $('quickAmts').innerHTML = [10, 50, 100, 500].map(n => '<button type="button" data-add="' + n + '">+' + n + '</button>').join('');
    $('quickAmts').querySelectorAll('button').forEach(b => b.onclick = () => {
        const cur = parseAmount($('amountIn').value) || 0;
        $('amountIn').value = String(Math.round((cur + Number(b.dataset.add)) * 100) / 100);
        $('editErr').textContent = '';
    });
}

function paintEdit() {
    $('catGrid').querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('sel', b.dataset.cat === selCat));
    const tIso = todayIso(), yIso = yesterdayIso();
    const dp = $('dayPick');
    dp.querySelector('[data-day=today]').textContent = t('today');
    dp.querySelector('[data-day=yesterday]').textContent = t('yesterday');
    dp.querySelector('[data-day=today]').classList.toggle('sel', selDate === tIso);
    dp.querySelector('[data-day=yesterday]').classList.toggle('sel', selDate === yIso);
    const other = selDate !== tIso && selDate !== yIso;
    $('otherDay').classList.toggle('sel', other);
    $('otherDay').querySelector('span').textContent = other
        ? '📅 ' + parseIso(selDate).toLocaleDateString(locale(), { day: 'numeric', month: 'short' })
        : t('otherDay');
    $('dateIn').value = selDate;
}

function openEdit(id) {
    editing = id || null;
    const item = editing && state.items.find(x => x.id === editing);
    $('editTitle').textContent = t(item ? 'editExpense' : 'addExpense');
    $('amountIn').value = item ? String(item.amount) : '';
    $('noteIn').value = item ? item.note || '' : '';
    selCat = item ? item.cat : null;
    // new expense: default to today, or to the 1st of the month being viewed if it's a past month
    selDate = item ? item.date : (viewMonth === monthKey(new Date()) ? todayIso() : viewMonth + '-01');
    $('deleteEdit').style.display = item ? 'block' : 'none';
    $('editErr').textContent = '';
    paintEdit();
    openSheet('editBack');
    if (!item) setTimeout(() => $('amountIn').focus(), 250);
}

function openSheet(id) {
    $(id).classList.add('open');
    document.body.style.overflow = 'hidden';
    try { history.pushState({ sheet: id }, ''); } catch (e) { /* ignore */ }
}
function hideSheet(id) {
    $(id).classList.remove('open');
    document.body.style.overflow = '';
}
function closeSheet(id) {
    hideSheet(id);
    if (history.state && history.state.sheet) history.back();
}
// Android Back button: close the open popup rather than leaving the app
window.addEventListener('popstate', () => { hideSheet('editBack'); hideSheet('setBack'); });

$('dayPick').querySelector('[data-day=today]').onclick = () => { selDate = todayIso(); paintEdit(); };
$('dayPick').querySelector('[data-day=yesterday]').onclick = () => { selDate = yesterdayIso(); paintEdit(); };
$('dateIn').max = todayIso();
$('dateIn').onchange = () => { if ($('dateIn').value) { selDate = $('dateIn').value; paintEdit(); } };
// some phones don't open the picker when tapping a hidden input – help them
$('otherDay').onclick = e => {
    if (e.target !== $('dateIn') && $('dateIn').showPicker) { try { $('dateIn').showPicker(); } catch (err) { /* ignore */ } }
};

$('saveEdit').onclick = () => {
    const amount = parseAmount($('amountIn').value);
    if (!(amount > 0)) { $('editErr').textContent = t('errAmount'); $('amountIn').focus(); return; }
    if (!selCat) { $('editErr').textContent = t('errCat'); return; }
    const note = $('noteIn').value.trim();
    if (editing) {
        const item = state.items.find(x => x.id === editing);
        Object.assign(item, { amount, cat: selCat, note, date: selDate });
    } else {
        state.items.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), amount, cat: selCat, note, date: selDate, ts: Date.now() });
    }
    if (!save()) return;
    viewMonth = selDate.slice(0, 7);
    closeSheet('editBack');
    render();
    toast(t('saved'));
};

$('deleteEdit').onclick = () => {
    const idx = state.items.findIndex(x => x.id === editing);
    if (idx < 0) return;
    const [removed] = state.items.splice(idx, 1);
    save();
    closeSheet('editBack');
    render();
    toast(t('deleted'), () => { state.items.push(removed); save(); render(); });
};

$('cancelEdit').onclick = () => closeSheet('editBack');
$('editBack').onclick = e => { if (e.target === $('editBack')) closeSheet('editBack'); };
$('amountIn').onkeydown = e => { if (e.key === 'Enter') { $('amountIn').blur(); if (selCat) $('saveEdit').click(); } };
$('noteIn').onkeydown = e => { if (e.key === 'Enter') $('saveEdit').click(); };

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, undo) {
    $('toastMsg').textContent = msg;
    $('toastUndo').style.display = undo ? 'block' : 'none';
    $('toastUndo').onclick = () => { $('toast').classList.remove('show'); undo && undo(); };
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), undo ? 6000 : 2200);
}

/* ---------- settings ---------- */
function openSettings() {
    $('budgetIn').value = state.budget ? String(state.budget) : '';
    openSheet('setBack');
}
$('settingsBtn').onclick = openSettings;
$('closeSet').onclick = () => closeSheet('setBack');
$('setBack').onclick = e => { if (e.target === $('setBack')) closeSheet('setBack'); };

$('saveBudget').onclick = () => {
    const b = parseAmount($('budgetIn').value);
    state.budget = b > 0 ? b : 0;
    save();
    closeSheet('setBack');
    render();
    toast(t('budgetSaved'));
};

function download(name, text, type) {
    const blob = new Blob([text], { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
$('exportBtn').onclick = () => {
    download('expenses-backup-' + todayIso() + '.json', JSON.stringify({ app: 'my-expenses', version: 1, items: state.items, budget: state.budget, lang: state.lang }, null, 1), 'application/json');
};
$('csvBtn').onclick = () => {
    const rows = [['Date', 'Category', 'Amount', 'Note']].concat(
        state.items.slice().sort((a, b) => a.date.localeCompare(b.date))
            .map(x => [x.date, (CAT[x.cat] || CAT.other).en, x.amount, x.note || '']));
    const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    download('expenses-' + todayIso() + '.csv', '﻿' + csv, 'text/csv');
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = () => {
    const f = $('importFile').files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
        try {
            const d = JSON.parse(r.result);
            if (!d || !Array.isArray(d.items)) throw new Error('bad');
            const items = d.items.filter(x => x && typeof x.amount === 'number' && typeof x.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x.date))
                .map(x => ({ id: String(x.id || Math.random().toString(36).slice(2)), amount: x.amount, cat: CAT[x.cat] ? x.cat : 'other', note: String(x.note || ''), date: x.date, ts: Number(x.ts) || 0 }));
            if (!confirm(t('restoreAsk', { n: items.length }))) return;
            state.items = items;
            if (typeof d.budget === 'number') state.budget = d.budget;
            save();
            closeSheet('setBack');
            render();
            toast(t('restored'));
        } catch (e) {
            alert(t('badFile'));
        }
    };
    r.readAsText(f);
    $('importFile').value = '';
};

/* ---------- share on WhatsApp ---------- */
$('shareBtn').onclick = () => {
    const monthItems = state.items.filter(x => x.date.startsWith(viewMonth));
    const byCat = {};
    monthItems.forEach(x => { byCat[x.cat] = (byCat[x.cat] || 0) + x.amount; });
    const lines = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a])
        .map(id => (CAT[id] || CAT.other).e + ' ' + catName(id) + ': ' + money(byCat[id]));
    const text = '🧾 ' + t('shareHead', { m: monthName(viewMonth) }) + '\n\n' +
        (lines.length ? lines.join('\n') : t('nothingYet')) +
        '\n\n*' + t('shareTotal') + ': ' + money(sum(monthItems)) + '*' +
        (state.budget > 0 ? '\n' + t('budgetOf', { a: money(state.budget) }) : '');
    if (navigator.share) {
        navigator.share({ text }).catch(() => {});
    } else {
        window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    }
};

/* ---------- top controls ---------- */
$('prevMonth').onclick = () => { viewMonth = shiftMonth(viewMonth, -1); filterCat = null; render(); };
$('nextMonth').onclick = () => { if (viewMonth < monthKey(new Date())) { viewMonth = shiftMonth(viewMonth, 1); filterCat = null; render(); } };
$('addBtn').onclick = () => openEdit(null);
$('langBtn').onclick = () => {
    state.lang = state.lang === 'en' ? 'ml' : 'en';
    save();
    renderWords();
    buildCatGrid();
    render();
};

// refresh "today" numbers when she comes back to the app the next day
document.addEventListener('visibilitychange', () => { if (!document.hidden) { $('dateIn').max = todayIso(); render(); } });

renderWords();
buildCatGrid();
render();
if (!storageWorks()) showWarning();
})();
</script>
</body>
</html>
