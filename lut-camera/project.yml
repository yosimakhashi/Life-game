name: LUTCam
options:
  bundleIdPrefix: com.lutcam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LUTCam:
    type: application
    platform: iOS
    sources:
      - path: LUTCam
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lutcam.app
        PRODUCT_NAME: LUTCam
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: LUTCam/Info.plist
      properties:
        CFBundleDisplayName: LUTCam
        NSCameraUsageDescription: LUTCam needs the camera to record video.
        NSMicrophoneUsageDescription: LUTCam records audio with your clips.
        NSPhotoLibraryAddUsageDescription: LUTCam saves your clips and stills to Photos.
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
