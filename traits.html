<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

/* Star chart, same sheet as the plan page it hangs off. */
:root {
    --fc-bg: #070b18;
    --fc-panel: #0e1428;
    --fc-panel-alt: #131b33;
    --fc-input: #0a0f20;
    --fc-border: #2a3455;
    --fc-green: #7fb7c9;
    --fc-green-dim: #4d7686;
    --fc-amber: #c9a227;
    --fc-soap: #b9a0d6;
    --fc-rust: #c1695e;
    --fc-rust-dim: #8a4d45;
    --fc-text: #e6e3d6;
    --fc-dim: #7f89a8;
}

body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--fc-bg);
    background-image:
        radial-gradient(ellipse at 50% 0%, rgba(127, 183, 201, 0.13), transparent 60%),

        radial-gradient(ellipse at 88% 30%, rgba(201, 162, 39, 0.08), transparent 50%),

    background-attachment: fixed;
    color: var(--fc-text);
    font-family: 'IBM Plex Mono', monospace;
}

/* starfield: fixed so the sky stays put while the page scrolls */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.85;
    background-image:
        radial-gradient(1.4px 1.4px at 12% 18%, rgba(230, 227, 214, 0.95), transparent),
        radial-gradient(1.2px 1.2px at 27% 62%, rgba(230, 227, 214, 0.75), transparent),
        radial-gradient(1.7px 1.7px at 41% 9%, rgba(201, 162, 39, 0.85), transparent),
        radial-gradient(1.1px 1.1px at 56% 44%, rgba(230, 227, 214, 0.70), transparent),
        radial-gradient(1.5px 1.5px at 68% 77%, rgba(127, 183, 201, 0.85), transparent),
        radial-gradient(1.2px 1.2px at 82% 26%, rgba(230, 227, 214, 0.80), transparent),
        radial-gradient(1.6px 1.6px at 91% 58%, rgba(185, 160, 214, 0.75), transparent),
        radial-gradient(1.1px 1.1px at 8% 81%, rgba(230, 227, 214, 0.65), transparent),
        radial-gradient(1.3px 1.3px at 35% 92%, rgba(230, 227, 214, 0.70), transparent),
        radial-gradient(1.5px 1.5px at 74% 6%, rgba(230, 227, 214, 0.80), transparent),
        radial-gradient(1.1px 1.1px at 49% 70%, rgba(127, 183, 201, 0.60), transparent),
        radial-gradient(1.2px 1.2px at 19% 40%, rgba(230, 227, 214, 0.60), transparent);
    background-size: 420px 420px;
    background-repeat: repeat;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(2, 4, 10, 0.78) 100%);
}

.app {
    position: relative;
    z-index: 2;
    max-width: 600px;
    margin: auto;
    padding: 18px;
}


/* HEADER */

.header {
    border: 1px solid var(--fc-border);
    border-left: 3px solid var(--fc-soap);
    background: var(--fc-panel);
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.6);
}

.backLink {
    display: inline-block;
    color: var(--fc-dim);
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
}

.backLink:active {
    color: var(--fc-green);
}

.logo {
    font-size: 11px;
    letter-spacing: 5px;
    color: var(--fc-green-dim);
    text-transform: uppercase;
}

.title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 4px;
    margin-top: 6px;
    text-transform: uppercase;
    color: var(--fc-text);
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.8), 0 0 34px rgba(127, 183, 201, 0.22);
}

.subtitle {
    color: var(--fc-dim);
    font-size: 12px;
    margin-top: 8px;
    line-height: 1.6;
    letter-spacing: 1px;
}


/* LEDGER */

.ledger {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--fc-border);
}

.ledgerCell {
    flex: 1;
}

.ledgerLabel {
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--fc-dim);
}

.ledgerValue {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 700;
    margin-top: 3px;
}

.up { color: var(--fc-green); }
.down { color: var(--fc-rust); }
.flat { color: var(--fc-dim); }


/* CONTROLS */

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

.tab {
    flex: 1;
    background: transparent;
    border: 1px solid var(--fc-border);

    color: var(--fc-green);

}

.tab.active.flawTab {
    border-color: var(--fc-rust);

}

.traitFilter {

    background: var(--fc-input);

    color: var(--fc-text);
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
    margin-bottom: 16px;
}

.traitFilter:focus {
    outline: none;
    border-color: var(--fc-green);
}


/* SIDE BLOCKS */

.side {
    margin-bottom: 26px;
}

.sideTitle {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding-bottom: 8px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--fc-border);
}

.side.virtues .sideTitle { color: var(--fc-green); }
.side.flaws .sideTitle { color: var(--fc-rust); }

.sideCount {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--fc-dim);
    text-transform: uppercase;
}

.traitGroup {
    margin-bottom: 16px;
}

.traitGroupName {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--fc-green-dim);
    margin-bottom: 7px;
}

.side.flaws .traitGroupName {
    color: var(--fc-rust-dim);
}

.traitRow {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--fc-panel);
    border: 1px solid var(--fc-border);
    border-left: 2px solid transparent;
    padding: 9px 11px;
    margin-bottom: 5px;
}

.traitRow.touched {
    border-left-color: var(--fc-green);
}

.side.flaws .traitRow.touched {
    border-left-color: var(--fc-rust);
}

.traitIcon {
    font-size: 16px;
    flex-shrink: 0;
}

.traitName {
    flex: 1;
    font-size: 13px;
}

.traitScore {
    font-size: 10px;
    color: var(--fc-dim);
    letter-spacing: 1px;
    text-align: right;
    flex-shrink: 0;

.traitRow.touched .traitScore b {
    color: var(--fc-green);
}

.side.flaws .traitRow.touched .traitScore b {
    color: var(--fc-rust);

.traitBtn {
    flex-shrink: 0;
    min-width: 46px;
    background: transparent;
    border: 1px solid var(--fc-soap);
    color: var(--fc-soap);
    padding: 7px 9px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    letter-spacing: 1px;
}

.traitBtn:active {
    transform: scale(0.94);
    background: rgba(185, 160, 214, 0.14);
}

.traitBtn.minus {
    border-color: var(--fc-rust);
    color: var(--fc-rust);
}

.traitBtn.minus:active {
    background: rgba(193, 105, 94, 0.16);
}

.emptyNote,
.emptyState {
    color: var(--fc-dim);
    font-size: 12px;
    text-align: center;
    padding: 30px 16px;
    line-height: 1.8;
    letter-spacing: 1px;
}

.emptyState a {
    color: var(--fc-green);
}

.footNote {
    color: var(--fc-dim);
    font-size: 10px;
    line-height: 1.8;
    letter-spacing: 1px;
    border-top: 1px solid var(--fc-border);
    padding-top: 12px;
    margin-top: 6px;
}

</style>
</head>

<script>

function toDateString(d) {
    return d.getFullYear() +
        "-" + String(d.getMonth() + 1).padStart(2, "0") +
        "-" + String(d.getDate()).padStart(2, "0");
}

function today() {
    return toDateString(new Date());
}


function loadGame() {
    const raw = localStorage.getItem("mindjack9");
    return raw ? JSON.parse(raw) : null;
}

function saveGame(game) {
    localStorage.setItem("mindjack9", JSON.stringify(game));
}

// so the two columns read as a matched pair rather than two lists.

let game = loadGame();

const content = document.getElementById("content");
const ledger = document.getElementById("ledger");


if (!game) {

    content.innerHTML = `
        <div class="emptyState">
            NO DATA YET.<br><br>
            Play a bit on the <a href="index.html">Life RPG</a> page first,
            then come back to track your character.
        </div>
    `;

} else {

    let traitFilter = "";
    let activeTab = "all";


    // Other pages write the whole save object back too, so re-read the
    // latest state right before mutating - otherwise this page's snapshot
    // (taken at load) would clobber anything changed since.
    function refreshGame() {
        const latest = loadGame();
        if (latest) {
            game = latest;
        }
    }


    function ensureTraits() {

        if (typeof game.traits !== "object" || game.traits === null) {
            game.traits = {};
        }

        if (typeof game.traitsToday !== "object" || game.traitsToday === null) {
            game.traitsToday = { date: today(), gains: {} };
        }

        // today's tally is per-day; roll it over when the date changes.
        // Persist immediately, otherwise the stale tally sits in storage
        // until the next write and other pages would read it as current.
        if (game.traitsToday.date !== today()) {
            game.traitsToday = { date: today(), gains: {} };
            saveGame(game);
        }

        if (typeof game.traitsToday.gains !== "object" || game.traitsToday.gains === null) {
            game.traitsToday.gains = {};
        }

    }


    function scoreTrait(id, amount) {

        refreshGame();
        ensureTraits();

        // Totals are signed, so a flaw pulls its own tally and the day's
        // net down. Nothing here touches Score or Credits - see the note
        // at the foot of the page.
        game.traits[id] = (game.traits[id] || 0) + amount;
        game.traitsToday.gains[id] = (game.traitsToday.gains[id] || 0) + amount;

        saveGame(game);
        render();

    }


    function addVirtue(id) {
        scoreTrait(id, VIRTUE_POINTS);
    }

    function addFlaw(id) {
        scoreTrait(id, FLAW_POINTS);
    }


    function sumOver(groups) {

        const gains = game.traitsToday.gains;
        let todayNet = 0;
        let lifeNet = 0;

        groups.forEach(group => {
            group.traits.forEach(tr => {
                todayNet += gains[tr.id] || 0;
                lifeNet += game.traits[tr.id] || 0;
            });
        });

        return { todayNet: todayNet, lifeNet: lifeNet };

    }


    function signClass(n) {
        if (n > 0) return "up";
        if (n < 0) return "down";
        return "flat";
    }

    function signed(n) {
        return (n > 0 ? "+" : "") + n;
    }


    function rowHTML(tr, kind) {

        const gains = game.traitsToday.gains;
        const gained = gains[tr.id] || 0;
        const total = game.traits[tr.id] || 0;

        const handler = kind === "flaw"
            ? "addFlaw('" + tr.id + "')"
            : "addVirtue('" + tr.id + "')";

        const label = kind === "flaw" ? FLAW_POINTS : "+" + VIRTUE_POINTS;

        return `
            <div class="traitRow ${gained ? "touched" : ""}" data-name="${tr.name.toLowerCase()}">
                <span class="traitIcon">${tr.icon}</span>
                <span class="traitName">${tr.name}</span>
                <span class="traitScore">${gained ? `<b>${signed(gained)}</b> today · ` : ""}${signed(total)} total</span>
                <button class="traitBtn ${kind === "flaw" ? "minus" : ""}" onclick="${handler}">${label}</button>
            </div>
        `;

    }


    function sideHTML(groups, kind, heading) {

        const sums = sumOver(groups);

        const body = groups.map(group => `
            <div class="traitGroup">
                <div class="traitGroupName">${group.name}</div>
                ${group.traits.map(tr => rowHTML(tr, kind)).join("")}
            </div>
        `).join("");

        return `
            <div class="side ${kind === "flaw" ? "flaws" : "virtues"}" data-side="${kind}">
                <div class="sideTitle">
                    <span>${heading}</span>
                    <span class="sideCount">${sums.todayNet ? signed(sums.todayNet) + " today" : "nothing yet today"}</span>
                </div>
                ${body}
            </div>
        `;

    }


    function renderLedger() {

        const v = sumOver(VIRTUE_GROUPS);
        const f = sumOver(FLAW_GROUPS);

        const todayNet = v.todayNet + f.todayNet;
        const lifeNet = v.lifeNet + f.lifeNet;

        ledger.innerHTML = `
            <div class="ledgerCell">
                <div class="ledgerLabel">Today</div>
                <div class="ledgerValue ${signClass(todayNet)}">${signed(todayNet)}</div>
            </div>
            <div class="ledgerCell">
                <div class="ledgerLabel">Virtue / Flaw today</div>
                <div class="ledgerValue"><span class="up">${signed(v.todayNet)}</span>
                    <span class="flat">/</span>
                    <span class="down">${signed(f.todayNet)}</span></div>
            </div>
            <div class="ledgerCell">
                <div class="ledgerLabel">Lifetime</div>
                <div class="ledgerValue ${signClass(lifeNet)}">${signed(lifeNet)}</div>
            </div>
        `;

    }


    function applyFilters() {

        document.querySelectorAll(".side").forEach(side => {
            const show = activeTab === "all" || side.dataset.side === activeTab;
            side.style.display = show ? "" : "none";
        });

        document.querySelectorAll(".traitRow").forEach(row => {
            const match = !traitFilter || row.dataset.name.indexOf(traitFilter) !== -1;
            row.style.display = match ? "" : "none";
        });

        document.querySelectorAll(".traitGroup").forEach(g => {
            const anyVisible = Array.from(g.querySelectorAll(".traitRow"))
                .some(r => r.style.display !== "none");
            g.style.display = anyVisible ? "" : "none";
        });

    }


    function setTab(name) {
        activeTab = name;
        document.querySelectorAll(".tab").forEach(b => {
            b.classList.toggle("active", b.dataset.tab === name);
        });
        applyFilters();
    }


    function wireControls() {

        const box = document.getElementById("traitFilter");
        if (box) {
            box.value = traitFilter;
            // Filtering hides rows directly instead of re-rendering, so
            // typing in this box is never interrupted mid-word.
            box.addEventListener("input", function () {
                traitFilter = box.value.trim().toLowerCase();
                applyFilters();
            });
        }

        document.querySelectorAll(".tab").forEach(b => {
            b.addEventListener("click", function () {
                setTab(b.dataset.tab);
            });
        });

    }


    function render() {

        ensureTraits();
        renderLedger();

        content.innerHTML = `

            <div class="tabs">
                <button class="tab ${activeTab === "all" ? "active" : ""}" data-tab="all">Both</button>
                <button class="tab ${activeTab === "virtue" ? "active" : ""}" data-tab="virtue">Virtues</button>
                <button class="tab flawTab ${activeTab === "flaw" ? "active" : ""}" data-tab="flaw">Flaws</button>
            </div>

            <input type="text" id="traitFilter" class="traitFilter" placeholder="Filter traits...">

            ${sideHTML(VIRTUE_GROUPS, "virtue", "Virtues")}
            ${sideHTML(FLAW_GROUPS, "flaw", "Flaws")}

            <div class="footNote">
                Character points are tracked on their own. They do not feed
                Score or Credits &mdash; with this many buttons on one page
                that would be free money, and your real score would stop
                meaning anything. Today's tally resets at midnight; the
                lifetime column keeps everything.
            </div>

        `;

        wireControls();
        applyFilters();

    }


    window.addVirtue = addVirtue;
    window.addFlaw = addFlaw;

    render();

}

</script>

</body>
</html>
