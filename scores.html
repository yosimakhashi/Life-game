<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<title>Scores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --head: #1a1a1a;
    --cell: #2a2a2a;
    --cell-alt: #323232;
    --line: #141414;
    --fg: #f2f2f2;
    --muted: #9a9a9a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
  }
  a { color: var(--muted); text-decoration: none; touch-action: manipulation; }
  main { padding: 0.85rem 0 2rem; }
  .top { padding: 0 1rem 0.75rem; }
  .back {
    display: inline-flex;
    align-items: center;
    min-height: 2.5rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 0.75rem;
  }
  h1 { margin: 0; font-size: 1.65rem; font-weight: 500; }
  .hint { margin: 0.3rem 0 0; color: var(--muted); font-size: 0.85rem; }
  .wrap { width: 100%; overflow-x: auto; }
  table {
    width: 100%;
    min-width: 22rem;
    border-collapse: separate;
    border-spacing: 1px;
    background: var(--line);
    table-layout: fixed;
  }
  th, td { background: var(--cell); vertical-align: top; }
  tbody tr:nth-child(even) td { background: var(--cell-alt); }
  thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--head);
    color: var(--fg);
    font-weight: 500;
    font-size: 0.95rem;
    text-align: left;
    padding: 0.7rem 0.55rem;
  }
  .sr, thead .sr {
    width: 2.4rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    position: sticky;
    left: 0;
    z-index: 1;
    background: var(--head);
    padding: 0.7rem 0.15rem;
  }
  thead .sr { z-index: 3; }
  tbody .sr { background: #171717; }
  textarea {
    display: block;
    width: 100%;
    min-height: 3.6rem;
    border: 0;
    margin: 0;
    padding: 0.55rem 0.5rem;
    resize: none;
    overflow: hidden;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 16px;
    line-height: 1.35;
  }
  textarea:focus { outline: none; background: rgba(255,255,255,0.04); }
</style>
</head>
<body>
<main>
  <div class="top">
    <a class="back" href="total.html">&larr; Back</a>
    <h1>Scores</h1>
    <p class="hint">Level 1, 2, and 3 are the columns. Type anything. The box grows to fit it.</p>
  </div>
  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th class="sr">Sr</th>
          <th>Level 1</th>
          <th>Level 2</th>
          <th>Level 3</th>
        </tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</main>
<script>
const KEY = "score-sheet-v3";
const OLD = "score-grid-v2";
const LEVELS = 3;
const ROWS = 10;

function empty() {
  return Array.from({ length: ROWS }, () => Array(LEVELS).fill(""));
}

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (Array.isArray(saved) && saved.length === ROWS) {
      return saved.map((row) => Array.from({ length: LEVELS }, (_, i) => String((row && row[i]) || "")));
    }
    const older = JSON.parse(localStorage.getItem(OLD) || "null");
    if (Array.isArray(older) && older.length === LEVELS) {
      const grid = empty();
      for (let level = 0; level < LEVELS; level++) {
        const col = older[level] || [];
        for (let row = 0; row < ROWS; row++) {
          const cell = col[row];
          if (!cell) continue;
          if (typeof cell === "string") grid[row][level] = cell;
          else grid[row][level] = [cell.score, cell.reason].filter(Boolean).join("\n");
        }
      }
      return grid;
    }
  } catch (err) {}
  return empty();
}

const grid = load();
const body = document.getElementById("body");

function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(grid)); } catch (err) {}
}

function grow(el) {
  el.style.height = "auto";
  el.style.height = Math.max(el.scrollHeight, 58) + "px";
}

for (let row = 0; row < ROWS; row++) {
  const tr = document.createElement("tr");
  const sr = document.createElement("td");
  sr.className = "sr";
  sr.textContent = String(row + 1);
  tr.append(sr);
  for (let level = 0; level < LEVELS; level++) {
    const td = document.createElement("td");
    const box = document.createElement("textarea");
    box.rows = 2;
    box.value = grid[row][level];
    box.setAttribute("aria-label", "Level " + (level + 1) + " row " + (row + 1));
    box.addEventListener("input", () => {
      grid[row][level] = box.value;
      grow(box);
      persist();
    });
    td.append(box);
    tr.append(td);
  }
  body.append(tr);
}

function sizeAll() {
  document.querySelectorAll("textarea").forEach(grow);
}
window.addEventListener("load", sizeAll);
requestAnimationFrame(sizeAll);
</script>
</body>
</html>
