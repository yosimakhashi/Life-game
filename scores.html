<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141210">
<title>Scores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141210;
    --surface: #1e1b17;
    --fg: #f4efe6;
    --muted: #a3988c;
    --accent: #e0a15a;
    --line: #3a342c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
  }
  button, a { font: inherit; color: inherit; touch-action: manipulation; }
  a { text-decoration: none; }
  main {
    max-width: 40rem;
    margin: 0 auto;
    padding: 1.25rem 1rem 2rem;
  }
  .back {
    display: inline-flex;
    align-items: center;
    min-height: 2.75rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 0.75rem;
  }
  h1 {
    margin: 0.25rem 0 0.35rem;
    font-family: Fraunces, Georgia, serif;
    font-weight: 500;
    font-size: 2rem;
  }
  .hint { margin: 0 0 1.25rem; color: var(--muted); font-size: 0.875rem; }
  .block { margin-bottom: 1.25rem; }
  h2 {
    margin: 0 0 0.55rem;
    font-family: Fraunces, Georgia, serif;
    font-weight: 500;
    font-size: 1.35rem;
  }
  .cols {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 0.5rem;
  }
  @media (min-width: 720px) {
    .cols { grid-template-columns: repeat(10, minmax(0, 1fr)); }
  }
  .box { display: flex; flex-direction: column; gap: 0.25rem; min-width: 0; }
  .box span {
    color: var(--muted);
    font-size: 0.75rem;
    text-align: center;
  }
  .cell {
    width: 100%;
    height: 2.75rem;
    min-width: 0;
    padding: 0;
    border-radius: 0.6rem;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--accent);
    font-family: Fraunces, Georgia, serif;
    font-size: 16px;
    text-align: center;
  }
  .cell:focus { outline: none; border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <a class="back" href="total.html">&larr; Back</a>
  <h1>Scores</h1>
  <p class="hint">Level 1, then 2, then 3. Ten boxes on each. Type letters and numbers.</p>
  <div id="sheet"></div>
</main>
<script>
const KEY = "score-grid-v1";
const LEVELS = ["Level 1", "Level 2", "Level 3"];
const COLS = 10;

function emptyGrid() {
  return LEVELS.map(() => Array(COLS).fill(""));
}

function clean(value) {
  return String(value).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
}

function load() {
  try {
    const data = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!Array.isArray(data) || data.length !== 3) return emptyGrid();
    return LEVELS.map((_, row) => Array.from({ length: COLS }, (_, col) => {
      const value = data[row] && data[row][col];
      return typeof value === "string" ? clean(value) : "";
    }));
  } catch (err) {
    return emptyGrid();
  }
}

function persist(grid) {
  try { localStorage.setItem(KEY, JSON.stringify(grid)); } catch (err) {}
}

const grid = load();
const sheet = document.getElementById("sheet");

LEVELS.forEach((name, r) => {
  const block = document.createElement("section");
  block.className = "block";
  const title = document.createElement("h2");
  title.textContent = name;
  const cols = document.createElement("div");
  cols.className = "cols";
  for (let c = 0; c < COLS; c++) {
    const box = document.createElement("label");
    box.className = "box";
    const cap = document.createElement("span");
    cap.textContent = String(c + 1);
    const input = document.createElement("input");
    input.className = "cell";
    input.maxLength = 6;
    input.enterKeyHint = "done";
    input.autocomplete = "off";
    input.autocapitalize = "characters";
    input.spellcheck = false;
    input.setAttribute("aria-label", name + " box " + (c + 1));
    input.value = grid[r][c];
    input.addEventListener("input", () => {
      grid[r][c] = input.value;
      persist(grid);
    });
    input.addEventListener("blur", () => {
      input.value = clean(input.value);
      grid[r][c] = input.value;
      persist(grid);
    });
    box.append(cap, input);
    cols.append(box);
  }
  block.append(title, cols);
  sheet.append(block);
});
</script>
</body>
</html>
