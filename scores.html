<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141210">
<title>Scores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141210;
    --surface: #1e1b17;
    --fg: #f4efe6;
    --muted: #a3988c;
    --accent: #e0a15a;
    --line: #3a342c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
  }
  a { color: inherit; text-decoration: none; touch-action: manipulation; }
  main { max-width: 40rem; margin: 0 auto; padding: 1.25rem 1rem 2.5rem; }
  .back {
    display: inline-flex;
    align-items: center;
    min-height: 2.75rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 0.75rem;
  }
  h1 {
    margin: 0.15rem 0 0.35rem;
    font-family: Fraunces, Georgia, serif;
    font-weight: 500;
    font-size: 2rem;
  }
  .hint { margin: 0 0 1.25rem; color: var(--muted); font-size: 0.875rem; line-height: 1.45; }
  .block { margin-bottom: 1.5rem; }
  h2 {
    margin: 0 0 0.5rem;
    font-family: Fraunces, Georgia, serif;
    font-weight: 500;
    font-size: 1.45rem;
  }
  .sheet {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 0.75rem;
    overflow: hidden;
    border-collapse: separate;
    border-spacing: 0;
  }
  .sheet th, .sheet td {
    border-bottom: 1px solid var(--line);
    border-right: 1px solid var(--line);
    vertical-align: top;
    background: var(--surface);
  }
  .sheet tr:last-child td, .sheet tr:last-child th { border-bottom: 0; }
  .sheet th:last-child, .sheet td:last-child { border-right: 0; }
  .sheet thead th {
    background: #181611;
    color: var(--muted);
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: left;
    padding: 0.55rem 0.65rem;
  }
  .col-n { width: 2.25rem; text-align: center; color: var(--muted); font-size: 0.8rem; padding: 0.7rem 0.2rem; }
  .col-score { width: 6.5rem; }
  .field, .reason {
    display: block;
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 16px;
    padding: 0.7rem 0.65rem;
  }
  .field { color: var(--accent); font-family: Fraunces, Georgia, serif; }
  .reason { min-height: 4.5rem; resize: vertical; line-height: 1.4; }
  .field:focus, .reason:focus { outline: none; background: #262219; }
</style>
</head>
<body>
<main>
  <a class="back" href="total.html">&larr; Back</a>
  <h1>Scores</h1>
  <p class="hint">Three sheets, ten rows each. Score is letters and numbers. Reason is why you got it.</p>
  <div id="sheet"></div>
</main>
<script>
const KEY = "score-grid-v2";
const OLD = "score-grid-v1";
const LEVELS = ["Level 1", "Level 2", "Level 3"];
const ROWS = 10;

function blank() {
  return { score: "", reason: "" };
}

function cleanScore(value) {
  return String(value).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
}

function emptyGrid() {
  return LEVELS.map(() => Array.from({ length: ROWS }, blank));
}

function load() {
  try {
    const next = JSON.parse(localStorage.getItem(KEY) || "null");
    if (Array.isArray(next) && next.length === 3) return normalize(next);
    const old = JSON.parse(localStorage.getItem(OLD) || "null");
    if (Array.isArray(old) && old.length === 3) {
      return LEVELS.map((_, level) => Array.from({ length: ROWS }, (_, row) => {
        const value = old[level] && old[level][row];
        if (value && typeof value === "object") {
          return { score: cleanScore(value.score || ""), reason: String(value.reason || "") };
        }
        return { score: typeof value === "string" ? cleanScore(value) : "", reason: "" };
      }));
    }
  } catch (err) {}
  return emptyGrid();
}

function normalize(data) {
  return LEVELS.map((_, level) => Array.from({ length: ROWS }, (_, row) => {
    const cell = data[level] && data[level][row];
    if (!cell || typeof cell !== "object") return blank();
    return {
      score: cleanScore(cell.score || ""),
      reason: String(cell.reason || "").slice(0, 240)
    };
  }));
}

function persist(grid) {
  try { localStorage.setItem(KEY, JSON.stringify(grid)); } catch (err) {}
}

const grid = load();
const root = document.getElementById("sheet");

LEVELS.forEach((name, level) => {
  const block = document.createElement("section");
  block.className = "block";
  const title = document.createElement("h2");
  title.textContent = name;
  const table = document.createElement("table");
  table.className = "sheet";
  table.innerHTML = "<thead><tr><th class='col-n'>#</th><th class='col-score'>Score</th><th>Reason</th></tr></thead>";
  const body = document.createElement("tbody");
  for (let row = 0; row < ROWS; row++) {
    const tr = document.createElement("tr");
    const num = document.createElement("td");
    num.className = "col-n";
    num.textContent = String(row + 1);
    const scoreCell = document.createElement("td");
    const score = document.createElement("input");
    score.className = "field";
    score.maxLength = 8;
    score.autocomplete = "off";
    score.autocapitalize = "characters";
    score.spellcheck = false;
    score.setAttribute("aria-label", name + " row " + (row + 1) + " score");
    score.value = grid[level][row].score;
    score.addEventListener("input", () => {
      grid[level][row].score = score.value;
      persist(grid);
    });
    score.addEventListener("blur", () => {
      score.value = cleanScore(score.value);
      grid[level][row].score = score.value;
      persist(grid);
    });
    scoreCell.append(score);
    const reasonCell = document.createElement("td");
    const reason = document.createElement("textarea");
    reason.className = "reason";
    reason.rows = 2;
    reason.maxLength = 240;
    reason.setAttribute("aria-label", name + " row " + (row + 1) + " reason");
    reason.value = grid[level][row].reason;
    reason.addEventListener("input", () => {
      grid[level][row].reason = reason.value;
      persist(grid);
    });
    reasonCell.append(reason);
    tr.append(num, scoreCell, reasonCell);
    body.append(tr);
  }
  table.append(body);
  block.append(title, table);
  root.append(block);
});
</script>
</body>
</html>
