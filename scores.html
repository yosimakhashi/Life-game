<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<title>Scores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --head: #1a1a1a;
    --cell: #2a2a2a;
    --cell-alt: #323232;
    --line: #141414;
    --fg: #f2f2f2;
    --muted: #9a9a9a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: Outfit, ui-sans-serif, system-ui, sans-serif; }
  button, a { font: inherit; color: inherit; touch-action: manipulation; }
  button { background: none; border: 0; padding: 0; }
  a { color: var(--muted); text-decoration: none; }
  main { padding: 0.85rem 0 2rem; }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 0.75rem; padding: 0 1rem 0.75rem; }
  .back, .history-btn {
    display: inline-flex; align-items: center; min-height: 2.75rem;
    letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.75rem; color: var(--muted);
  }
  .history-btn { border: 1px solid #3a3a3a; border-radius: 999px; padding: 0 0.9rem; color: var(--fg); }
  h1 { margin: 0; font-size: 1.65rem; font-weight: 500; }
  .hint { margin: 0.3rem 0 0; color: var(--muted); font-size: 0.85rem; }
  .wrap { width: 100%; }
  table { width: 100%; border-collapse: separate; border-spacing: 1px; background: var(--line); table-layout: fixed; }
  th, td { background: var(--cell); vertical-align: top; }
  tbody tr:nth-child(even) td { background: var(--cell-alt); }
  thead th {
    position: sticky; top: 0; z-index: 2; background: var(--head); color: var(--fg);
    font-weight: 500; font-size: 0.95rem; text-align: left; padding: 0.7rem 0.55rem;
  }
  .sr, thead .sr {
    width: 2.75rem; text-align: center; color: var(--muted); font-size: 0.8rem;
    position: sticky; left: 0; z-index: 1; background: var(--head); padding: 0.45rem 0.1rem;
  }
  thead .sr { z-index: 3; }
  tbody .sr { position: static; width: 3.4rem; background: #171717; }
  textarea, .frozen {
    display: block; width: 100%; min-height: 3.6rem; border: 0; margin: 0;
    padding: 0.55rem 0.5rem; background: transparent; color: var(--fg);
    font: inherit; font-size: 16px; line-height: 1.35; white-space: pre-wrap;
  }
  textarea { resize: none; overflow: hidden; }
  textarea:focus { outline: none; background: rgba(255,255,255,0.04); }
  .days { padding: 0 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .day {
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
    min-height: 3.25rem; padding: 0.75rem 0.9rem; border-radius: 0.75rem;
    background: var(--cell); color: var(--fg); text-align: left;
  }
  .day small { color: var(--muted); }
  tfoot td {
    background: #171717;
    color: #e0a15a;
    font-weight: 500;
    font-size: 1.05rem;
    padding: 0.75rem 0.55rem;
  }
  tfoot .sr { background: #171717; color: #e0a15a; }
  .points {
    margin: 0.9rem 1rem 0;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .points span { color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.75rem; }
  .points strong { font-size: 1.85rem; font-weight: 500; color: #e0a15a; }
  .del {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 2.75rem;
    margin-top: 0.25rem;
    border: 1px solid #6a6a6a;
    border-radius: 0.45rem;
    background: #3a3a3a;
    color: #fff;
    font-size: 0.75rem;
  }
  .actions {
    display: flex;
    gap: 0.5rem;
    padding: 0.75rem 1rem 0;
  }
  .actions .add, .actions .clear {
    flex: 1;
    width: auto;
    margin: 0;
  }
  .clear { color: #e0a15a; }
  .add, .clear {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 2.75rem;
    border: 1px solid #3a3a3a;
    border-radius: 0.75rem;
    background: #1a1a1a;
    color: var(--fg);
    font-size: 1rem;
  }
  .clear { color: #e0a15a; }
  .add:active, .clear:active { transform: scale(0.98); }
  tbody tr.set-end td { box-shadow: inset 0 -8px 0 #0e0e0e; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <a class="back" id="back" href="total.html">&larr; Back</a>
      <h1 id="title">Scores</h1>
      <p class="hint" id="hint">Three rows at a time. Tap + when you need more. Clears after midnight into History.</p>
    </div>
    <button class="history-btn" id="switch" type="button">History</button>
  </div>
  <div id="app"></div>
</main>
<script>
const KEY = "score-sheet-v3";
const DAY_KEY = "score-sheet-day";
const HISTORY_KEY = "score-sheet-history";
const LEVELS = ["Level 1", "Level 2", "Level 3"];
const SET = 3;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const app = document.getElementById("app");
const title = document.getElementById("title");
const hint = document.getElementById("hint");
const back = document.getElementById("back");
const switchBtn = document.getElementById("switch");

let view = "today";
let pastDate = "";
let flash = "";

function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function label(iso) {
  const parts = iso.split("-");
  return Number(parts[2]) + " " + MONTHS[Number(parts[1]) - 1] + " " + parts[0];
}

function empty() {
  return Array.from({ length: SET }, () => Array(LEVELS.length).fill(""));
}

function filled(grid) {
  return grid.some((row) => row.some((cell) => String(cell).trim() !== ""));
}

function readGrid() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (Array.isArray(saved) && saved.length > 0) {
      const next = saved.map((row) => Array.from({ length: LEVELS.length }, (_, i) => String((row && row[i]) || "")));
      if (!filled(next)) return empty();
      return next;
    }
  } catch (err) {}
  return empty();
}

function readHistory() {
  try {
    const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || "null");
    if (!Array.isArray(saved)) return [];
    return saved.filter((item) => item && typeof item.date === "string" && Array.isArray(item.grid));
  } catch (err) {
    return [];
  }
}

function writeHistory(items) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(items.slice(0, 90))); } catch (err) {}
}

function writeGrid(grid) {
  try { localStorage.setItem(KEY, JSON.stringify(grid)); } catch (err) {}
}

function rollover() {
  const day = today();
  const storedDay = localStorage.getItem(DAY_KEY);
  let grid = readGrid();
  if (storedDay && storedDay !== day) {
    if (filled(grid)) {
      const history = readHistory().filter((item) => item.date !== storedDay);
      history.unshift({ date: storedDay, grid });
      writeHistory(history);
    }
    grid = empty();
    writeGrid(grid);
  }
  localStorage.setItem(DAY_KEY, day);
  return grid;
}

let grid = rollover();

function grow(el) {
  el.style.height = "auto";
  el.style.height = Math.max(el.scrollHeight, 58) + "px";
}

function numbersIn(text) {
  const found = String(text).match(/-?\d+(?:\.\d+)?/g);
  if (!found) return 0;
  return found.reduce((sum, n) => sum + Number(n), 0);
}

function columnTotals(data) {
  return LEVELS.map((_, level) => data.reduce((sum, row) => sum + numbersIn(row[level] || ""), 0));
}

function formatPoints(n) {
  const rounded = Math.round(n * 100) / 100;
  return Number.isInteger(rounded) ? String(rounded) : String(rounded);
}

function sheet(data, locked) {
  const wrap = document.createElement("div");
  wrap.className = "wrap";
  const table = document.createElement("table");
  const thead = document.createElement("thead");
  thead.innerHTML = "<tr><th class='sr'>Sr</th>" + LEVELS.map((name) => "<th>" + name + "</th>").join("") + "</tr>";
  const tbody = document.createElement("tbody");
  const totalCells = [];
  data.forEach((row, r) => {
    const tr = document.createElement("tr");
    if ((r + 1) % SET === 0 && r !== data.length - 1) tr.className = "set-end";
    const sr = document.createElement("td");
    sr.className = "sr";
    const num = document.createElement("div");
    num.textContent = String(r + 1);
    sr.append(num);
    if (!locked) {
      const del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.textContent = "Del";
      del.setAttribute("aria-label", "Delete row " + (r + 1));
      del.addEventListener("click", () => {
        grid.splice(r, 1);
        writeGrid(grid);
        flash = "Row " + (r + 1) + " deleted.";
        show();
      });
      sr.append(del);
    }
    tr.append(sr);
    row.forEach((value, level) => {
      const td = document.createElement("td");
      if (locked) {
        const frozen = document.createElement("div");
        frozen.className = "frozen";
        frozen.textContent = value;
        td.append(frozen);
      } else {
        const box = document.createElement("textarea");
        box.value = value;
        box.setAttribute("aria-label", LEVELS[level] + " row " + (r + 1));
        box.addEventListener("input", () => {
          grid[r][level] = box.value;
          grow(box);
          writeGrid(grid);
          paintTotals();
        });
        td.append(box);
      }
      tr.append(td);
    });
    tbody.append(tr);
  });
  const tfoot = document.createElement("tfoot");
  const sumRow = document.createElement("tr");
  const sumLabel = document.createElement("td");
  sumLabel.className = "sr";
  sumLabel.textContent = "Σ";
  sumRow.append(sumLabel);
  LEVELS.forEach(() => {
    const td = document.createElement("td");
    td.textContent = "0";
    totalCells.push(td);
    sumRow.append(td);
  });
  tfoot.append(sumRow);
  table.append(thead, tbody, tfoot);
  const points = document.createElement("div");
  points.className = "points";
  const pointsLabel = document.createElement("span");
  pointsLabel.textContent = "Points";
  const pointsValue = document.createElement("strong");
  points.append(pointsLabel, pointsValue);
  wrap.append(table);
  if (!locked) {
    const actions = document.createElement("div");
    actions.className = "actions";
    const add = document.createElement("button");
    add.className = "add";
    add.type = "button";
    add.textContent = "+ 3 rows";
    add.addEventListener("click", () => {
      const start = grid.length;
      for (let i = 0; i < SET; i++) grid.push(Array(LEVELS.length).fill(""));
      writeGrid(grid);
      show();
      const row = document.querySelectorAll("tbody tr")[start];
      if (row) row.scrollIntoView({ block: "nearest" });
    });
    const clear = document.createElement("button");
    clear.className = "clear";
    clear.type = "button";
    clear.textContent = "Clear";
    clear.addEventListener("click", () => {
      grid.forEach((row) => row.fill(""));
      writeGrid(grid);
      flash = "Sheet cleared.";
      show();
    });
    actions.append(add, clear);
    wrap.append(actions);
  }
  wrap.append(points);

  function paintTotals() {
    const source = locked ? data : grid;
    const totals = columnTotals(source);
    totals.forEach((n, i) => { totalCells[i].textContent = formatPoints(n); });
    pointsValue.textContent = formatPoints(totals.reduce((sum, n) => sum + n, 0));
  }

  paintTotals();
  return wrap;
}

function show() {
  app.textContent = "";
  if (view === "list") {
    title.textContent = "History";
    hint.textContent = "Past days. Today’s sheet is separate.";
    back.textContent = "← Today";
    back.href = "#";
    switchBtn.hidden = true;
    const history = readHistory();
    if (!history.length) {
      const note = document.createElement("p");
      note.className = "empty-note";
      note.textContent = "Nothing saved yet. Today’s scores land here after midnight.";
      app.append(note);
      return;
    }
    const days = document.createElement("div");
    days.className = "days";
    history.forEach((item) => {
      const btn = document.createElement("button");
      btn.className = "day";
      btn.type = "button";
      const preview = item.grid.flat().map((cell) => String(cell).trim()).filter(Boolean)[0] || "Empty";
      const name = document.createElement("span");
      name.textContent = label(item.date);
      const previewText = document.createElement("small");
      previewText.textContent = preview.split("\n")[0].slice(0, 28);
      btn.append(name, previewText);
      btn.addEventListener("click", () => {
        pastDate = item.date;
        view = "past";
        show();
      });
      days.append(btn);
    });
    app.append(days);
    return;
  }

  if (view === "past") {
    const item = readHistory().find((entry) => entry.date === pastDate);
    title.textContent = item ? label(item.date) : "History";
    hint.textContent = "Saved day. This one does not change.";
    back.textContent = "← History";
    back.href = "#";
    switchBtn.hidden = true;
    app.append(sheet(item ? item.grid : empty(), true));
    return;
  }

  title.textContent = "Scores";
  hint.textContent = flash || "Del removes that row. Clear empties the boxes. + adds 3 rows.";
  flash = "";
  back.textContent = "← Back";
  back.href = "total.html";
  switchBtn.hidden = false;
  switchBtn.textContent = "History";
  app.append(sheet(grid, false));
  document.querySelectorAll("textarea").forEach(grow);
}

back.addEventListener("click", (event) => {
  if (view === "today") return;
  event.preventDefault();
  view = view === "past" ? "list" : "today";
  show();
});

switchBtn.addEventListener("click", () => {
  view = "list";
  show();
});

function checkDay() {
  if (localStorage.getItem(DAY_KEY) === today()) return;
  grid = rollover();
  if (view === "today") show();
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) checkDay();
});
setInterval(checkDay, 60000);
show();
</script>
</body>
</html>
