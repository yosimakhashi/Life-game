<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1220">
<title>Random Girl Generator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
/* Generates a random fictional girl character: an SVG portrait plus a
   profile card. Saved characters live in localStorage ("rgg_saved"). */
:root {
    --bg: #1a1220; --panel: #241a2d; --panel-2: #2e2239; --line: #3d2f4b;
    --fg: #f6eef9; --dim: #b9a6c6; --accent: #ff7eb6; --on-accent: #2a0016;
}
@media (prefers-color-scheme: light) {
    :root { --bg: #fbf3f8; --panel: #ffffff; --panel-2: #f6eaf2; --line: #ead6e4;
            --fg: #2a1830; --dim: #7b6585; --accent: #d63d84; --on-accent: #ffffff; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
       font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
.wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
header a { color: var(--dim); text-decoration: none; font-weight: 600; }
h1 { font-size: 20px; margin: 0; flex: 1; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
.portrait { display: flex; justify-content: center; }
.portrait svg { width: 200px; height: 200px; border-radius: 50%; background: var(--panel-2); }
.name { text-align: center; font-size: 26px; font-weight: 800; margin: 14px 0 2px; }
.sub { text-align: center; color: var(--dim); margin-bottom: 16px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 16px; }
.tag { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cell { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; }
.cell b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin-bottom: 2px; }
.bio { margin-top: 14px; line-height: 1.5; color: var(--fg); }
.btns { display: flex; gap: 8px; margin: 16px 0; }
button { font: inherit; font-weight: 800; border: 0; border-radius: 14px; padding: 14px; cursor: pointer; }
.primary { flex: 1; background: var(--accent); color: var(--on-accent); font-size: 16px; }
.ghost { background: var(--panel); color: var(--fg); border: 1px solid var(--line); }
h2 { font-size: 15px; color: var(--dim); margin: 24px 0 8px; }
.saved { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line);
       border-radius: 14px; padding: 8px 10px; cursor: pointer; }
.row svg { width: 44px; height: 44px; border-radius: 50%; background: var(--panel-2); flex: none; }
.row div { flex: 1; min-width: 0; }
.row small { color: var(--dim); }
.row button { padding: 6px 10px; background: transparent; color: var(--dim); }
.empty { color: var(--dim); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <a href="../">← Back</a>
        <h1>🎲 Random Girl Generator</h1>
    </header>

    <div class="card" id="card"></div>

    <div class="btns">
        <button class="primary" id="gen">🎲 Generate</button>
        <button class="ghost" id="save">♡ Save</button>
        <button class="ghost" id="copy">Copy</button>
    </div>

    <h2>Saved characters</h2>
    <div class="saved" id="saved"></div>
</div>

<script>
const pick = a => a[Math.floor(Math.random() * a.length)];
const rand = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
const pickN = (a, n) => [...a].sort(() => Math.random() - .5).slice(0, n);

const FIRST = ["Aditi","Ananya","Athira","Meera","Diya","Nila","Anjali","Kavya","Lakshmi","Gauri","Revathi","Aparna",
  "Sneha","Neha","Riya","Isha","Priya","Sana","Zara","Aisha","Fathima","Noor","Maria","Anna","Sofia","Emma","Olivia",
  "Mia","Chloe","Luna","Hana","Yuki","Mei","Sakura","Leila","Amara","Elena","Isabella","Clara","Nina","Ava","Ivy",
  "Maya","Tara","Asha","Devika","Malavika","Parvathy","Keerthi","Nandana","Swathi","Aleena","Sara","Jasmine","Ruby"];
const LAST = ["Nair","Menon","Pillai","Kurup","Varma","Thomas","Joseph","Mathew","Khan","Rahman","Sharma","Iyer",
  "Reddy","Kapoor","Das","Bose","Rao","Smith","Garcia","Rossi","Kim","Tanaka","Chen","Silva","Martin","Novak","Haddad"];
const CITY = ["Kochi","Thiruvananthapuram","Kozhikode","Thrissur","Bengaluru","Mumbai","Chennai","Delhi","Dubai",
  "London","Tokyo","Paris","Toronto","Seoul","Lisbon","Singapore","Melbourne","Barcelona","New York","Istanbul"];
const JOB = ["Software developer","Doctor","Nurse","Architect","Teacher","Graphic designer","Photographer","Chef",
  "Lawyer","Pilot","Journalist","Pharmacist","Fashion designer","Civil engineer","Marine biologist","Musician",
  "Dancer","Psychologist","Data scientist","Bookshop owner","Veterinarian","Film editor","Entrepreneur","Student"];
const TRAITS = ["Kind","Witty","Adventurous","Shy","Ambitious","Calm","Bubbly","Sarcastic","Loyal","Creative",
  "Curious","Stubborn","Romantic","Independent","Funny","Thoughtful","Confident","Dreamy","Organised","Brave",
  "Gentle","Competitive","Optimistic","Mysterious","Caring","Chaotic","Patient","Honest"];
const HOBBY = ["Painting","Reading novels","Hiking","Cooking","Photography","Classical dance","Singing","Yoga",
  "Gaming","Journaling","Gardening","Swimming","Badminton","Travelling","Baking","Writing poetry","Watching anime",
  "Playing guitar","Sketching","Cycling","Learning languages","Thrifting","Stargazing","Football"];
const FOOD = ["Biryani","Masala dosa","Puttu & kadala","Sushi","Pizza","Pasta","Chocolate cake","Ice cream","Momos",
  "Tacos","Ramen","Payasam","Shawarma","Fish curry","Pani puri","Mango","Waffles","Kerala porotta & beef"];
const MOVIE = ["Romance","Thriller","Comedy","Horror","Sci-fi","Fantasy","Drama","Mystery","Animation","Musical","Documentary"];
const QUIRK = ["names all her plants","always carries a book","collects keychains","hums when she's nervous",
  "can't sleep without music","laughs at her own jokes first","makes lists for everything","is always 10 minutes late",
  "remembers everyone's birthday","talks to stray cats","drinks way too much chai","takes 100 photos of sunsets",
  "never finishes a series","rearranges her room every month","gives everyone nicknames"];
const DREAM = ["open her own café","travel to 30 countries","write a novel","start her own company","learn to fly",
  "build a house by the sea","become a famous artist","adopt lots of dogs","perform on a big stage","see the northern lights",
  "teach in a village school","run a marathon","make a film"];
const ZODIAC = ["Aries ♈","Taurus ♉","Gemini ♊","Cancer ♋","Leo ♌","Virgo ♍","Libra ♎","Scorpio ♏",
  "Sagittarius ♐","Capricorn ♑","Aquarius ♒","Pisces ♓"];
const COLOURS = {Red:"#e0424f",Pink:"#ff7eb6",Lavender:"#b39ddb",Purple:"#8e44ad",Blue:"#4a90e2",Teal:"#1abc9c",
  Green:"#4caf50",Yellow:"#f4c430",Orange:"#ff8c42",White:"#f5f5f5",Black:"#2b2b2b",Maroon:"#800020"};

const SKIN = ["#ffe0c7","#f6cfa8","#e8b48a","#d29a6b","#b97b4f","#8d5a3b","#6b4129"];
const HAIR = {Black:"#1c1414","Dark brown":"#3b2417",Brown:"#6b4423",Auburn:"#8b3a1e",Blonde:"#e3c16f",
  Red:"#b5381f",Pink:"#f48fb1",Lavender:"#b39ddb",Blue:"#4a6fd1"};
const EYES = {Brown:"#5a3820",Hazel:"#8e6b3a",Green:"#3f7d4b",Blue:"#3b6fb5",Grey:"#7a8591",Black:"#1b1b1b"};
const HAIR_STYLES = ["Long straight","Long wavy","Bob cut","Ponytail","Bun","Pixie cut","Braided"];

function makeGirl() {
    const hairColour = pick(Math.random() < .75 ? ["Black","Dark brown","Brown","Auburn","Blonde","Red"] : Object.keys(HAIR));
    const fav = pick(Object.keys(COLOURS));
    return {
        first: pick(FIRST), last: pick(LAST), age: rand(18, 32), city: pick(CITY), job: pick(JOB),
        traits: pickN(TRAITS, 3), hobbies: pickN(HOBBY, 2), food: pick(FOOD), movie: pick(MOVIE),
        quirk: pick(QUIRK), dream: pick(DREAM), zodiac: pick(ZODIAC), height: rand(150, 178),
        skin: rand(0, SKIN.length - 1), hairColour, hairStyle: pick(HAIR_STYLES),
        eyes: pick(Object.keys(EYES)), fav, glasses: Math.random() < .25, blush: Math.random() < .6,
        earrings: Math.random() < .5, smile: rand(0, 2)
    };
}

function portrait(g) {
    const s = SKIN[g.skin], h = HAIR[g.hairColour], e = EYES[g.eyes], c = COLOURS[g.fav];
    const back = {
        "Long straight": `<path d="M48 90 Q46 40 100 36 Q154 40 152 90 L156 170 L44 170 Z" fill="${h}"/>`,
        "Long wavy": `<path d="M48 90 Q44 38 100 34 Q156 38 152 90 Q162 120 150 140 Q162 160 148 175 L52 175 Q38 160 50 140 Q38 120 48 90Z" fill="${h}"/>`,
        "Bob cut": `<path d="M50 95 Q46 38 100 36 Q154 38 150 95 L152 128 Q130 134 120 120 L80 120 Q70 134 48 128 Z" fill="${h}"/>`,
        "Ponytail": `<path d="M140 70 Q178 90 160 150 Q152 120 142 100Z" fill="${h}"/>`,
        "Bun": `<circle cx="100" cy="34" r="20" fill="${h}"/>`,
        "Pixie cut": ``,
        "Braided": `<path d="M60 90 L56 160" stroke="${h}" stroke-width="14" stroke-linecap="round" stroke-dasharray="10 3"/><path d="M140 90 L144 160" stroke="${h}" stroke-width="14" stroke-linecap="round" stroke-dasharray="10 3"/>`
    }[g.hairStyle];
    const fringe = g.hairStyle === "Pixie cut"
        ? `<path d="M56 86 Q54 40 100 40 Q146 40 144 86 Q130 62 100 64 Q78 64 62 80Z" fill="${h}"/>`
        : `<path d="M54 92 Q52 40 100 40 Q148 40 146 92 Q138 66 112 62 Q96 76 70 72 Q60 80 54 92Z" fill="${h}"/>`;
    const mouth = [`<path d="M88 122 Q100 132 112 122" stroke="#8a3b3b" stroke-width="3" fill="none" stroke-linecap="round"/>`,
                   `<path d="M86 120 Q100 136 114 120 Z" fill="#a8434b"/>`,
                   `<path d="M92 124 Q100 128 108 124" stroke="#8a3b3b" stroke-width="3" fill="none" stroke-linecap="round"/>`][g.smile];
    return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        ${back}
        <path d="M40 200 Q44 160 100 156 Q156 160 160 200Z" fill="${c}"/>
        <rect x="88" y="132" width="24" height="28" rx="8" fill="${s}"/>
        <ellipse cx="100" cy="98" rx="44" ry="50" fill="${s}"/>
        ${g.earrings ? `<circle cx="56" cy="112" r="4" fill="#f4c430"/><circle cx="144" cy="112" r="4" fill="#f4c430"/>` : ""}
        <ellipse cx="82" cy="100" rx="6" ry="7" fill="#fff"/><ellipse cx="118" cy="100" rx="6" ry="7" fill="#fff"/>
        <circle cx="82" cy="101" r="4.5" fill="${e}"/><circle cx="118" cy="101" r="4.5" fill="${e}"/>
        <circle cx="83.5" cy="99" r="1.4" fill="#fff"/><circle cx="119.5" cy="99" r="1.4" fill="#fff"/>
        <path d="M74 88 Q82 84 90 88 M110 88 Q118 84 126 88" stroke="${h}" stroke-width="3" fill="none" stroke-linecap="round"/>
        ${g.blush ? `<ellipse cx="72" cy="116" rx="7" ry="4" fill="#ff8fa3" opacity=".45"/><ellipse cx="128" cy="116" rx="7" ry="4" fill="#ff8fa3" opacity=".45"/>` : ""}
        <path d="M100 104 Q97 112 101 114" stroke="#00000033" stroke-width="2" fill="none" stroke-linecap="round"/>
        ${mouth}
        ${g.glasses ? `<g stroke="#333" stroke-width="2.5" fill="none"><circle cx="82" cy="101" r="12"/><circle cx="118" cy="101" r="12"/><path d="M94 101 H106"/></g>` : ""}
        ${fringe}
    </svg>`;
}

function bio(g) {
    return `${g.first} is a ${g.age}-year-old ${g.job.toLowerCase()} from ${g.city}. ` +
        `Friends describe her as ${g.traits[0].toLowerCase()}, ${g.traits[1].toLowerCase()} and ${g.traits[2].toLowerCase()}. ` +
        `In her free time she loves ${g.hobbies[0].toLowerCase()} and ${g.hobbies[1].toLowerCase()}, and she ${g.quirk}. ` +
        `One day she hopes to ${g.dream}.`;
}

const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
let current;

function render(g) {
    current = g;
    document.getElementById("card").innerHTML = `
        <div class="portrait">${portrait(g)}</div>
        <div class="name">${esc(g.first)} ${esc(g.last)}</div>
        <div class="sub">${g.age} · ${esc(g.job)} · ${esc(g.city)}</div>
        <div class="tags">${g.traits.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
        <div class="grid">
            <div class="cell"><b>Zodiac</b>${g.zodiac}</div>
            <div class="cell"><b>Height</b>${g.height} cm</div>
            <div class="cell"><b>Hair</b>${g.hairColour}, ${g.hairStyle.toLowerCase()}</div>
            <div class="cell"><b>Eyes</b>${g.eyes}</div>
            <div class="cell"><b>Hobbies</b>${g.hobbies.join(", ")}</div>
            <div class="cell"><b>Fav food</b>${esc(g.food)}</div>
            <div class="cell"><b>Fav colour</b>${g.fav}</div>
            <div class="cell"><b>Fav movies</b>${g.movie}</div>
        </div>
        <div class="bio">${esc(bio(g))}</div>`;
    document.getElementById("save").textContent = isSaved(g) ? "♥ Saved" : "♡ Save";
}

const KEY = "rgg_saved";
function loadSaved() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
function storeSaved(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch {} }
const sameGirl = (a, b) => a.first === b.first && a.last === b.last && a.job === b.job && a.age === b.age;
const isSaved = g => loadSaved().some(s => sameGirl(s, g));

function renderSaved() {
    const list = loadSaved(), box = document.getElementById("saved");
    if (!list.length) { box.innerHTML = `<div class="empty">Tap ♡ Save to keep characters you like.</div>`; return; }
    box.innerHTML = list.map((g, i) => `
        <div class="row" data-i="${i}">${portrait(g)}
            <div><strong>${esc(g.first)} ${esc(g.last)}</strong><br><small>${g.age} · ${esc(g.job)}</small></div>
            <button data-del="${i}" aria-label="Remove">✕</button>
        </div>`).join("");
}

document.getElementById("saved").addEventListener("click", e => {
    const list = loadSaved();
    const del = e.target.closest("[data-del]");
    if (del) { list.splice(+del.dataset.del, 1); storeSaved(list); renderSaved(); render(current); return; }
    const row = e.target.closest(".row");
    if (row) { render(list[+row.dataset.i]); window.scrollTo({top: 0, behavior: "smooth"}); }
});
document.getElementById("gen").onclick = () => render(makeGirl());
document.getElementById("save").onclick = () => {
    let list = loadSaved();
    list = isSaved(current) ? list.filter(s => !sameGirl(s, current)) : [current, ...list].slice(0, 50);
    storeSaved(list); renderSaved(); render(current);
};
document.getElementById("copy").onclick = async () => {
    const g = current, btn = document.getElementById("copy");
    const text = `${g.first} ${g.last} (${g.age}) — ${g.job}, ${g.city}\n${g.zodiac} · ${g.traits.join(", ")}\n\n${bio(g)}`;
    try { await navigator.clipboard.writeText(text); btn.textContent = "Copied!"; }
    catch { btn.textContent = "Can't copy"; }
    setTimeout(() => btn.textContent = "Copy", 1200);
};

render(makeGirl());
renderSaved();
</script>
</body>
</html>
