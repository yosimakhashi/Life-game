<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10132a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SSC Edge">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>SSC Edge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: a single column (max 640px) with a sticky header and a fixed
   bottom tab bar: Home, Plan, Learn, Drill, Mocks. Each view is rendered
   into <main> by app.js from the URL hash. */
:root {
    --bg: #10132a;
    --panel: #181c38;
    --panel-2: #20254a;
    --line: #2e3463;
    --fg: #eef0fb;
    --dim: #a2a8cf;
    --accent: #7c8cff;
    --on-accent: #0b0e24;
    --gold: #f2c14e;
    --green: #4fc28a;
    --red: #ef7b6c;
    --blue: #6cb2ef;
}
@media (prefers-color-scheme: light) {
    :root {
        --bg: #f3f4fb;
        --panel: #ffffff;
        --panel-2: #eceefa;
        --line: #d9dcf0;
        --fg: #171a33;
        --dim: #5d6286;
        --accent: #4453d6;
        --on-accent: #ffffff;
        --gold: #a8780a;
        --green: #1f9a5c;
        --red: #c94a3a;
        --blue: #2c78bd;
    }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    font-size: 16px; line-height: 1.5;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

header.top {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    padding: max(10px, env(safe-area-inset-top)) 16px 10px;
    border-bottom: 1px solid var(--line);
}
#top { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
#top .back { text-decoration: none; color: var(--dim); font-size: 26px; line-height: 1; padding: 0 8px 4px 0; }
#top h1 { font-size: 18px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; font-weight: 700; white-space: nowrap; text-decoration: none; font-variant-numeric: tabular-nums; }

main { max-width: 640px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; min-width: 0; }
.card h2 { font-size: 16px; margin: 0 0 8px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 700; }
.muted { color: var(--dim); }
.small { font-size: 13px; }
.bad { color: var(--red); font-weight: 700; }
.row { display: flex; align-items: center; gap: 10px; }
.spacer { flex: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 0 16px; border-radius: 12px; text-align: center;
    border: 1px solid var(--line); background: var(--panel-2); text-decoration: none; font-weight: 700;
}
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--red); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }

input[type=text], input[type=date], input[type=number], select {
    width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel-2); font-size: 16px;
}
label.field { display: grid; gap: 4px; font-size: 13px; color: var(--dim); font-weight: 700; }

/* Segmented choices */
.seg { display: inline-flex; gap: 4px; background: var(--panel-2); padding: 3px; border-radius: 12px; }
.seg button { min-width: 36px; min-height: 36px; border: 0; border-radius: 9px; background: transparent; font-weight: 700; font-size: 14px; padding: 0 8px; }
.seg button.on { background: var(--accent); color: var(--on-accent); }
.seg.wide { display: flex; flex-wrap: wrap; margin-top: 6px; }
.seg.wide button { flex: 1 1 auto; }

/* Hero */
.hero { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 30%, var(--panel)), var(--panel)); }
.big { font-size: 48px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .3s; }
.bar.green > i { background: var(--green); }
.bar.red > i { background: var(--red); }

/* Lists */
.list { display: grid; gap: 10px; }
.item {
    display: flex; align-items: center; gap: 12px; padding: 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    text-decoration: none; min-width: 0;
}
.item .ico { width: 42px; height: 42px; border-radius: 12px; background: var(--panel-2); display: grid; place-items: center; font-size: 22px; flex: none; }
.item .txt { flex: 1; min-width: 0; }
.item .txt b, .task .txt b { display: block; }
.item .chev { color: var(--dim); font-size: 20px; }
.tick { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: transparent; display: grid; place-items: center; flex: none; font-size: 14px; padding: 0; }
.tick.on { background: var(--green); border-color: var(--green); color: #fff; }
.task { display: flex; gap: 12px; align-items: center; }
.task .txt { flex: 1; min-width: 0; text-decoration: none; display: block; }
.task .txt span { display: block; }
.struck { text-decoration: line-through; color: var(--dim); }
.tag { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: var(--panel-2); color: var(--dim); vertical-align: middle; }

/* Lesson */
.notes ul { margin: 0; padding-left: 20px; display: grid; gap: 10px; }
.notes li::marker { color: var(--accent); }
.notes strong, .tipcard strong, .tip strong { color: var(--gold); font-weight: 800; }
.trick { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); background: color-mix(in srgb, var(--gold) 10%, var(--panel)); }
.trap li::marker { color: var(--red); }
.steps { margin: 0 0 4px; padding-left: 22px; display: grid; gap: 6px; }
.steps strong { color: var(--green); }
.tipcard { border-left: 4px solid var(--gold); }
details.tip { background: var(--panel-2); border-radius: 12px; padding: 12px 14px; }
details.tip summary { font-weight: 700; cursor: pointer; }
details.tip p { margin: 8px 0 0; }

/* Plan */
.phases { display: grid; gap: 8px; }
.phase { padding: 12px; border-radius: 12px; background: var(--panel-2); border-left: 4px solid var(--line); }
.phase.now { border-left-color: var(--accent); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 12px; color: var(--dim); }
.week .col { height: 80px; background: var(--panel-2); border-radius: 8px; display: flex; align-items: flex-end; overflow: hidden; }
.week .col i { width: 100%; background: var(--accent); border-radius: 8px 8px 0 0; }
.week b { display: block; color: var(--fg); min-height: 18px; }
.timer { font-size: 56px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; }

/* Tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12px; color: var(--dim); font-weight: 700; padding: 4px 6px 8px; }
.tbl td { padding: 6px; border-top: 1px solid var(--line); }
.tbl input { min-height: 40px; padding: 6px 8px; }

/* Quiz */
.q { font-size: 18px; font-weight: 700; margin: 10px 0 14px; }
.opts { display: grid; gap: 8px; }
.opt {
    text-align: left; padding: 12px 14px; min-height: 48px; border-radius: 12px;
    background: var(--panel-2); border: 2px solid var(--line);
}
.opt b { color: var(--dim); margin-right: 4px; }
.opt.sel { border-color: var(--accent); }
.opt.right { border-color: var(--green); background: color-mix(in srgb, var(--green) 18%, var(--panel-2)); }
.opt.wrong { border-color: var(--red); background: color-mix(in srgb, var(--red) 16%, var(--panel-2)); }
.opt:disabled { cursor: default; color: inherit; }
.explain { padding: 12px; border-radius: 12px; background: var(--panel-2); font-size: 14px; }
.explain b { color: var(--fg); }
.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.dots button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font-size: 12px; padding: 0; }
.dots button.ans { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.dots button.cur { outline: 2px solid var(--gold); }
.quad { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.qd { background: var(--panel-2); border-radius: 12px; padding: 12px; display: grid; gap: 2px; border-top: 3px solid var(--line); }
.qd b { font-size: 26px; line-height: 1; }
.qd span { font-weight: 700; font-size: 14px; }
.qd small { color: var(--dim); font-size: 12px; line-height: 1.35; }
.qd.fr { border-top-color: var(--green); }
.qd.sr { border-top-color: var(--gold); }
.qd.fw { border-top-color: var(--blue); }
.qd.sw { border-top-color: var(--red); }
.wq { background: var(--panel-2); border-radius: 14px; padding: 12px; }
.wq .seg { background: var(--panel); }
.wq details summary { cursor: pointer; color: var(--accent); font-weight: 700; }

/* Chart */
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tgt { stroke: var(--gold); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
.chart .pt { fill: var(--panel); stroke: var(--accent); stroke-width: 2.5; }

/* Bottom tabs */
nav.tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    background: var(--panel); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
}
nav.tabbar .inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabbar a { display: grid; justify-items: center; gap: 2px; padding: 8px 0 10px; text-decoration: none; color: var(--dim); font-size: 11px; font-weight: 700; }
nav.tabbar a span { font-size: 22px; line-height: 1.2; }
nav.tabbar a.on { color: var(--accent); }

.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
</style>
</head>
<body>
<header class="top"><div id="top"></div></header>
<main id="app"></main>
<nav class="tabbar"><div class="inner">
    <a href="#/home" data-tab="home"><span>🏠</span>Home</a>
    <a href="#/plan" data-tab="plan"><span>🗺️</span>Plan</a>
    <a href="#/learn" data-tab="learn"><span>📚</span>Learn</a>
    <a href="#/drill" data-tab="drill"><span>⚡</span>Drill</a>
    <a href="#/mocks" data-tab="mocks"><span>📊</span>Mocks</a>
</div></nav>
<div class="toast" id="toast" hidden></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
