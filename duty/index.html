<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3b5ba9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="APO Duty">
<title>APO Duty</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
    --bg: #f5f6f9; --panel: #fff; --soft: #eef1f6; --border: #dde2ec;
    --text: #1f2430; --dim: #667085; --main: #3b5ba9; --main-dark: #2c4685; --main-soft: #e3e9f7;
    --good: #2e7d32; --good-soft: #e5f3e6; --bad: #c0392b; --bad-soft: #fbe7e4; --warn: #a86b12; --warn-soft: #fbf1df;
    --shadow: 0 2px 12px rgba(20, 30, 60, 0.07);
}
html { font-size: 17px; }
body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: 'Noto Sans', system-ui, sans-serif; line-height: 1.4;
    padding-bottom: calc(90px + env(safe-area-inset-bottom));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 6px; }
.topbar h1 { margin: 0; font-size: 1.25rem; }
.topbar .sub { color: var(--dim); font-size: .8rem; }
.back { color: var(--dim); text-decoration: none; font-size: .9rem; white-space: nowrap; }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin: 12px 0; box-shadow: var(--shadow); }
.card h2 { margin: 0 0 10px; font-size: .9rem; color: var(--dim); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.muted { color: var(--dim); font-size: .88rem; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.big { font-size: 1.6rem; font-weight: 700; }

.btn { border: none; border-radius: 12px; padding: 11px 16px; background: var(--main); color: #fff; font-weight: 600; }
.btn:active { background: var(--main-dark); }
.btn.ghost { background: var(--soft); color: var(--text); }
.btn.good { background: var(--good); }
.btn.bad { background: var(--bad-soft); color: var(--bad); }
.btn.sm { padding: 7px 12px; font-size: .86rem; border-radius: 10px; }
.btn.block { width: 100%; }

.hero { border-radius: 20px; padding: 18px 20px; color: #fff; margin: 12px 0; box-shadow: var(--shadow); }
.hero .label { opacity: .9; font-size: .85rem; }
.hero .who { font-size: 2rem; font-weight: 700; margin: 2px 0; }
.hero .time { opacity: .95; font-size: .95rem; }
.hero .status { margin-top: 10px; background: rgba(255,255,255,.2); border-radius: 12px; padding: 8px 12px; font-size: .92rem; }
.tag { display: inline-block; background: rgba(255,255,255,.28); border-radius: 999px; padding: 2px 10px; font-size: .75rem; margin-left: 6px; vertical-align: middle; font-weight: 600; }

.notice { background: var(--warn-soft); color: var(--warn); border-radius: 14px; padding: 12px 14px; margin: 12px 0; font-size: .92rem; }
.notice b { color: #7a4c06; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--soft); border-radius: 12px; padding: 10px 6px; text-align: center; }
.stat b { display: block; font-size: 1.25rem; }
.stat span { font-size: .74rem; color: var(--dim); }

/* person dot / pill */
.pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }

/* list rows */
.item { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.item:last-child { border-bottom: none; }
.item .grow { flex: 1; min-width: 0; }
.item .t { font-weight: 600; }
.badge { min-width: 46px; height: 46px; border-radius: 12px; color: #fff; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: .8rem; line-height: 1.1; }
.badge b { font-size: 1.05rem; }
.me-row { background: var(--main-soft); border-radius: 12px; padding-left: 8px; padding-right: 8px; }

/* calendar */
.monthnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.monthnav b { font-size: 1.1rem; }
.monthnav button { border: none; background: var(--soft); width: 40px; height: 40px; border-radius: 12px; font-size: 1.1rem; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .hd { text-align: center; font-size: .72rem; color: var(--dim); padding: 4px 0; }
.cell { position: relative; min-width: 0; min-height: 66px; border-radius: 10px; border: 2px solid transparent; background: var(--soft); padding: 3px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; font-size: .8rem; }
.cell.empty { background: transparent; }
.cell.today { border-color: var(--text); }
.cell.mine { background: var(--main-soft); }
.cell .n { font-weight: 600; }
.cell .ss { width: 100%; display: flex; flex-direction: column; gap: 2px; }
.cell .s { width: 100%; overflow: hidden; text-align: center; border-radius: 7px; color: #fff; font-weight: 700; font-size: .66rem; padding: 1px 0; white-space: nowrap; }
.cell .mk { position: absolute; top: 1px; right: 3px; font-size: .62rem; font-weight: 700; color: var(--warn); }
.cell .mk2 { position: absolute; top: 1px; left: 3px; font-size: .62rem; color: var(--good); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; font-size: .78rem; color: var(--dim); }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid var(--border); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: .9rem; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { border-color: var(--main); background: var(--main-soft); }

/* forms */
label.f { display: block; margin: 10px 0 4px; font-size: .85rem; color: var(--dim); font-weight: 600; }
input[type=text], input[type=time], input[type=date], input[type=number], select, textarea {
    width: 100%; border: 2px solid var(--border); border-radius: 12px; padding: 9px 12px; background: var(--panel);
}
textarea { min-height: 64px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; align-items: center; gap: 10px; font-weight: 600; margin: 8px 0; }
.check input { width: 22px; height: 22px; }

.owe { font-weight: 700; }
.owe.plus { color: var(--good); }
.owe.minus { color: var(--bad); }
.warn { color: var(--warn); font-size: .82rem; font-weight: 600; }

.plan-row { display: grid; grid-template-columns: 1fr 1.3fr; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }

/* bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--border); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 20; }
.tabs .in { display: flex; max-width: 560px; width: 100%; }
.tabs button { flex: 1; border: none; background: none; padding: 10px 0 12px; font-size: .72rem; color: var(--dim); font-weight: 600; }
.tabs button .ic { display: block; font-size: 1.25rem; }
.tabs button.on { color: var(--main); }

/* sheet */
.overlay { position: fixed; inset: 0; background: rgba(15, 20, 35, .45); z-index: 40; display: none; align-items: flex-end; justify-content: center; }
.overlay.open { display: flex; }
.sheet { background: var(--panel); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); }
.sheet h3 { margin: 0 0 4px; font-size: 1.15rem; }
.sec { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 12px; }
.sec > b { display: block; margin-bottom: 8px; }
pre.share { white-space: pre-wrap; background: var(--soft); border-radius: 12px; padding: 12px; font: inherit; font-size: .88rem; margin: 10px 0; }

.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #1f2430; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; white-space: nowrap; }
.toast.show { opacity: 1; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <div><h1>🗓 APO Duty</h1><div class="sub" id="subTitle"></div></div>
        <a class="back" href="../">← Home</a>
    </div>
    <section id="v-home"></section>
    <section id="v-cal" class="hidden"></section>
    <section id="v-swaps" class="hidden"></section>
    <section id="v-log" class="hidden"></section>
    <section id="v-setup" class="hidden"></section>
</div>

<nav class="tabs"><div class="in">
    <button data-tab="home" class="on"><span class="ic">🏠</span>Today</button>
    <button data-tab="cal"><span class="ic">📅</span>Calendar</button>
    <button data-tab="swaps"><span class="ic">🔁</span>Swaps</button>
    <button data-tab="log"><span class="ic">📒</span>My log</button>
    <button data-tab="setup"><span class="ic">⚙️</span>Setup</button>
</div></nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/*
 * APO duty rotation (staggered, two on duty at a time).
 * Every day at the change time one APO comes in and the one who has finished
 * their turn goes home. Each APO is on duty for `perTurn` days in a row
 * (2 × 24h), then off until their next turn. With 5 APOs: 2 days on, 3 days off,
 * and 2 APOs present at any time.
 * The order below is the order APOs come in, one per day.
 * A swap replaces one APO in one duty day: key `date|orig` → { date, orig, cover, note, settled, group }.
 * Every unsettled swap means `orig` owes `cover` one duty day.
 */
const STORE = 'duty.apo.v2';
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const COLORS = ['#3b5ba9', '#e08a1e', '#2f8f6b', '#8e44ad', '#c0392b', '#00838f', '#6d4c41', '#c2185b'];

function defaults() {
    const team = [['p1', 'Asif', 0], ['p5', 'Dinesh', 4], ['p3', 'Sooraj', 2], ['p2', 'Nithin', 1], ['p4', 'Gireesh', 3]]
        .map(([id, name, c]) => ({ id, name, color: COLORS[c] }));
    return {
        team, me: 'p1',
        perTurn: 2,
        shiftStart: '09:00',
        anchor: { date: '2026-11-15', who: 'p1', day: 1 }, // Asif came in on 15 Nov morning
        confirmed: true,
        logSince: '2026-11-15',
        posting: 'Petrol pump sector',
        swaps: {},
        logs: {},
    };
}

/* ---------- storage ---------- */
let S;
function load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(STORE)); } catch (e) {}
    S = Object.assign(defaults(), d && Array.isArray(d.team) ? d : {});
    if (!d) { // carry over the log and posting from the earlier version
        try { const old = JSON.parse(localStorage.getItem('duty.apo.v1')); if (old) { S.logs = old.logs || {}; S.posting = old.posting || S.posting; } } catch (e) {}
    }
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { toast('⚠ Could not save'); } }

/* ---------- helpers ---------- */
function pad(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
function dayDiff(a, b) { const A = parse(a), B = parse(b); return Math.round((Date.UTC(B.getFullYear(), B.getMonth(), B.getDate()) - Date.UTC(A.getFullYear(), A.getMonth(), A.getDate())) / 864e5); }
function pretty(s, year) { const d = parse(s); return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3) + (year ? ' ' + d.getFullYear() : ''); }
function t12(t) { let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + (m ? ':' + pad(m) : '') + ' ' + ap; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function $(id) { return document.getElementById(id); }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1900); }
function plural(n, w) { return n + ' ' + (n === 1 ? w : w.endsWith('y') && !/[aeiou]y$/.test(w) ? w.slice(0, -1) + 'ies' : w + 's'); }
function mod(a, n) { return ((a % n) + n) % n; }
function andList(a) { return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' & ' + a[a.length - 1]; }

/* ---------- rotation logic ---------- */
function person(id) { return S.team.find(p => p.id === id) || { id, name: '(removed)', color: '#9aa3b2' }; }
function pname(id) { return person(id).name; }
function nameOf(id) { return id === S.me ? pname(id) + ' (you)' : pname(id); }
function short(id) { return pname(id).slice(0, 4); }
// index in S.team of the APO who comes in on `date`
function starterIdx(date) {
    const ai = Math.max(0, S.team.findIndex(p => p.id === S.anchor.who));
    return mod(ai + dayDiff(S.anchor.date, date) + (S.anchor.day - 1), S.team.length);
}
// the duty places on `date`: the APO on their last day first, the one who came in that day last
function slots(date) {
    const out = [];
    for (let j = S.perTurn - 1; j >= 0; j--) {
        const orig = S.team[starterIdx(addDays(date, -j))].id, key = date + '|' + orig, sw = S.swaps[key];
        out.push({ date, orig, who: sw ? sw.cover : orig, day: j + 1, sw, key });
    }
    return out;
}
function onDuty(date) { return slots(date).map(s => s.who); }
function isOn(id, date) { return onDuty(date).includes(id); }
function isScheduled(id, date) { return slots(date).some(s => s.orig === id); }
// who comes in and who goes home at the change on the morning of `date`
function change(date) {
    const prev = onDuty(addDays(date, -1)), cur = onDuty(date);
    return { inn: cur.filter(x => !prev.includes(x)), out: prev.filter(x => !cur.includes(x)) };
}
function currentDutyDate() {
    const now = new Date(), [h, m] = S.shiftStart.split(':').map(Number);
    const today = ymd(now);
    return (now.getHours() * 60 + now.getMinutes() < h * 60 + m) ? addDays(today, -1) : today;
}
function dutyStart(date) { const d = parse(date), [h, m] = S.shiftStart.split(':').map(Number); d.setHours(h, m, 0, 0); return d; }
function firstDutyOf(id, from, limit = 400) { for (let i = 0; i < limit; i++) { const k = addDays(from, i); if (isOn(id, k)) return k; } return null; }
function stretchEnd(id, date) { let e = date; while (isOn(id, addDays(e, 1))) e = addDays(e, 1); return e; }
function untilText(ms) {
    const mins = Math.max(0, Math.round(ms / 60000)), d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
    if (d) return d + 'd ' + h + 'h'; if (h) return h + 'h ' + m + 'm'; return m + 'm';
}
// longest run of consecutive duty days `id` would have if they also took the dates in `extra`
function stretchWith(id, extra) {
    const on = d => extra.has(d) || isOn(id, d);
    let best = 0;
    extra.forEach(d => {
        let a = d, b = d;
        while (on(addDays(a, -1))) a = addDays(a, -1);
        while (on(addDays(b, 1))) b = addDays(b, 1);
        best = Math.max(best, dayDiff(a, b) + 1);
    });
    return best;
}
function stretchNote(n) { return n > S.perTurn + 1 ? `<span class="warn">⚠ ${n} days in a row (${n * 24}h)</span>` : `<span class="muted">${n} day${n > 1 ? 's' : ''} in a row</span>`; }
// owed[a][b] = number of duty days a owes b
function balances() {
    const owed = {};
    S.team.forEach(a => { owed[a.id] = {}; S.team.forEach(b => owed[a.id][b.id] = 0); });
    Object.values(S.swaps).forEach(sw => {
        if (sw.settled || sw.orig === sw.cover) return;
        if (owed[sw.orig] && owed[sw.orig][sw.cover] !== undefined) owed[sw.orig][sw.cover]++;
    });
    return owed;
}
function net(owed, a, b) { return (owed[a]?.[b] || 0) - (owed[b]?.[a] || 0); } // >0: a owes b
function swapsOn(date) { return slots(date).filter(s => s.sw); }

/* ---------- navigation ---------- */
let tab = 'home', calY, calM, logY, logM, calOnlyMe = false;
function setTab(t) {
    tab = t;
    ['home', 'cal', 'swaps', 'log', 'setup'].forEach(x => $('v-' + x).classList.toggle('hidden', x !== t));
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
    render(); window.scrollTo(0, 0);
}
function render() {
    $('subTitle').textContent = pname(S.me) + ' · ' + S.posting;
    ({ home: renderHome, cal: renderCal, swaps: renderSwaps, log: renderLog, setup: renderSetup })[tab]();
}
function openSheet(html) { $('sheet').innerHTML = html; $('overlay').classList.add('open'); $('sheet').scrollTop = 0; }
function closeSheet() { $('overlay').classList.remove('open'); }
function changeLine(date) {
    const c = change(date);
    if (!c.inn.length && !c.out.length) return 'No change';
    return (c.inn.length ? andList(c.inn.map(pname)) + ' in' : '') + (c.inn.length && c.out.length ? ', ' : '') + (c.out.length ? andList(c.out.map(pname)) + ' out' : '');
}

/* ---------- HOME ---------- */
function renderHome() {
    const cur = currentDutyDate(), now = new Date(), sl = slots(cur), tomorrow = addDays(cur, 1);
    const meOn = isOn(S.me, cur);
    let h = `<div class="hero" style="background:${meOn ? person(S.me).color : '#4a5568'}">
        <div class="label">On duty now · ${t12(S.shiftStart)} ${pretty(cur)} → ${t12(S.shiftStart)} ${pretty(tomorrow)}</div>
        <div class="who">${esc(andList(sl.map(s => nameOf(s.who))))}</div>
        <div class="time">${sl.map(s => `${esc(pname(s.who))}: day ${s.day} of ${S.perTurn}${s.sw ? ' (covering ' + esc(pname(s.orig)) + ')' : ''}`).join(' · ')}</div>
        <div class="status">🔁 Next change ${t12(S.shiftStart)} ${pretty(tomorrow)} (in ${untilText(dutyStart(tomorrow) - now)}): ${esc(changeLine(tomorrow))}</div>
    </div>`;

    h += `<div class="card"><h2>My duty</h2>`;
    if (meOn) {
        const end = stretchEnd(S.me, cur), home = addDays(end, 1), back = firstDutyOf(S.me, home);
        const lg = S.logs[cur];
        h += `<div class="big">Home ${t12(S.shiftStart)} ${pretty(home)}</div>
            <div class="muted">in ${untilText(dutyStart(home) - now)}${back ? ` · back on <b>${pretty(back)}</b> (${plural(dayDiff(home, back), 'day')} off)` : ''}</div>
            <div class="spread" style="margin-top:10px"><span class="muted">${lg && lg.done ? '✓ Today logged' + (lg.note ? ': ' + esc(lg.note) : '') : 'Today not logged yet'}</span>
            <button class="btn sm" onclick="openDay('${cur}')">${lg ? 'Edit log' : 'Log duty'}</button></div>`;
    } else {
        const next = firstDutyOf(S.me, tomorrow);
        if (next) {
            const with_ = onDuty(next).filter(x => x !== S.me);
            h += `<div class="big">Back ${t12(S.shiftStart)} ${pretty(next)}</div>
                <div class="muted">in ${untilText(dutyStart(next) - now)} · with ${esc(andList(with_.map(pname)))}</div>`;
        } else h += `<p class="muted">No duty found for you. Check Setup.</p>`;
    }
    const pending = myPastDuties(30).filter(d => !(S.logs[d] && S.logs[d].done));
    if (pending.length) h += `<div class="notice" style="margin-bottom:0">📒 ${plural(pending.length, 'past duty day')} not logged. <button class="btn sm ghost" onclick="openDay('${pending[0]}')">Log ${pretty(pending[0])}</button></div>`;
    h += `</div>`;

    h += balanceCard(true);

    h += `<div class="card"><div class="spread"><h2>Next 10 days</h2><button class="btn sm ghost" onclick="shareSchedule()">📤 Share</button></div>`;
    for (let i = 0; i < 10; i++) {
        const k = addDays(cur, i), d = parse(k), s2 = slots(k), mine = isOn(S.me, k);
        h += `<div class="item ${mine ? 'me-row' : ''}" onclick="openDay('${k}')">
            <div class="badge" style="background:${mine ? person(S.me).color : '#8a94a6'}"><b>${d.getDate()}</b>${DAYS[d.getDay()]}</div>
            <div class="grow"><div class="t">${s2.map(s => `<span class="pill"><span class="dot" style="background:${person(s.who).color}"></span>${esc(pname(s.who))}</span>`).join(' & ')}${i === 0 ? ' · now' : ''}</div>
            <div class="muted">${i === 0 ? 'On duty now' : t12(S.shiftStart) + ': ' + esc(changeLine(k))}${s2.some(s => s.sw) ? ' · ⇄ swap' : ''}</div></div></div>`;
    }
    h += `</div>`;
    $('v-home').innerHTML = h;
}
function myPastDuties(days) {

/* ---------- COVER PLANNER ---------- */
let P = null;
function openPlanner() {
    const cur = currentDutyDate();
    P = { who: S.me, from: cur, to: addDays(cur, 10), mode: 'split', one: null, assign: {}, note: '' };
    drawPlanner(); $('overlay').classList.add('open'); $('sheet').scrollTop = 0;
}
function plannerDays() {
    const out = []; if (!P.from || !P.to || P.to < P.from) return out;
    for (let k = P.from; k <= P.to && out.length < 60; k = addDays(k, 1)) if (isScheduled(P.who, k) && isOn(P.who, k)) out.push(k);
    return out;
}
function free(id, k) { return id !== P.who && !isOn(id, k); }
function suggest(days) {
    const owed = balances(), load = {}, taken = {};
    S.team.forEach(p => { load[p.id] = 0; taken[p.id] = new Set(); });
    const assign = {};
    days.forEach(k => {
        const c = S.team.map(p => p.id).filter(id => free(id, k));
        if (!c.length) return;
        const score = id => stretchWith(id, new Set([...taken[id], k]));
        const pick = c.sort((a, b) => score(a) - score(b) || load[a] - load[b] || net(owed, b, P.who) - net(owed, a, P.who))[0];
        assign[k] = pick; load[pick]++; taken[pick].add(k);
    });
    return assign;
}
function drawPlanner() {
    const days = plannerDays();
    if (P.mode === 'split' && days.some(k => !P.assign[k] || !free(P.assign[k], k))) {
        const sg = suggest(days); days.forEach(k => { if (!P.assign[k] || !free(P.assign[k], k)) P.assign[k] = sg[k]; });
    }
    const oneOptions = S.team.filter(p => days.every(k => free(p.id, k)));
    if (P.mode === 'one' && !oneOptions.some(p => p.id === P.one)) P.one = oneOptions.length ? oneOptions.slice().sort((a, b) => stretchWith(a.id, new Set(days)) - stretchWith(b.id, new Set(days)))[0].id : null;
    let h = `<div class="spread"><h3>Plan cover</h3><button class="btn sm ghost" onclick="closeSheet()">✕</button></div>
        <label class="f">Who needs leave?</label><select onchange="P.who=this.value;P.assign={};drawPlanner()">${S.team.map(p => `<option value="${p.id}" ${p.id === P.who ? 'selected' : ''}>${esc(nameOf(p.id))}</option>`).join('')}</select>
        <div class="two"><div><label class="f">Leave from</label><input type="date" value="${P.from}" onchange="P.from=this.value;P.assign={};drawPlanner()"></div>
        <div><label class="f">Until</label><input type="date" value="${P.to}" onchange="P.to=this.value;P.assign={};drawPlanner()"></div></div>
        <label class="f">Reason (optional)</label><input type="text" value="${esc(P.note)}" oninput="P.note=this.value">`;
    if (!days.length) { $('sheet').innerHTML = h + `<p class="muted" style="margin-top:14px">${esc(pname(P.who))} has no duty in these dates, so no cover is needed.</p>`; return; }
    h += `<div class="sec"><b>${plural(days.length, 'duty day')} to cover (${days.length * 24} hours)</b>
        <div class="chips"><button class="chip ${P.mode === 'one' ? 'on' : ''}" onclick="P.mode='one';drawPlanner()">One APO covers all</button>
        <button class="chip ${P.mode === 'split' ? 'on' : ''}" onclick="P.mode='split';drawPlanner()">Split between APOs</button></div>`;
    const pick = k => P.mode === 'one' ? P.one : P.assign[k];
    if (P.mode === 'one') {
        h += oneOptions.length ? `<label class="f">Covered by</label><select onchange="P.one=this.value;drawPlanner()">${oneOptions.map(p => `<option value="${p.id}" ${p.id === P.one ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
            <p style="margin:6px 0 0">${stretchNote(stretchWith(P.one, new Set(days)))}</p>`
            : `<p class="warn">Nobody is free on all these days (someone is always on duty already). Use "Split".</p>`;
    }
    const byWho = {}; days.forEach(k => { const c = pick(k); if (c) (byWho[c] = byWho[c] || new Set()).add(k); });
    h += `<div style="margin-top:8px">`;
    days.forEach(k => {
        const c = pick(k), partner = onDuty(k).filter(x => x !== P.who);
        h += `<div class="plan-row"><div><b>${pretty(k)}</b><div class="muted">with ${esc(andList(partner.map(pname)))}</div></div><div>`;
        if (P.mode === 'one') h += c ? `<span class="pill"><span class="dot" style="background:${person(c).color}"></span>${esc(pname(c))}</span>` : '—';
        else h += `<select onchange="P.assign['${k}']=this.value;drawPlanner()">${S.team.filter(p => free(p.id, k)).map(p => `<option value="${p.id}" ${p.id === c ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>`;
        if (c && P.mode === 'split') h += `<div>${stretchNote(stretchWith(c, byWho[c]))}</div>`;
        h += `</div></div>`;
    });
    h += `</div></div>`;
    if (P.mode === 'one' && !P.one) { $('sheet').innerHTML = h; return; }
    h += `<div class="sec"><b>After this, ${esc(pname(P.who))} will owe</b>${Object.entries(byWho).map(([id, set]) => `<div class="item"><span class="dot" style="background:${person(id).color}"></span><div class="grow">${esc(pname(id))}</div><b>${plural(set.size, 'duty')}</b></div>`).join('')}</div>
        <pre class="share" id="plText">${esc(planText(days, pick, byWho))}</pre>
        <div class="row"><button class="btn ghost" onclick="shareText($('plText').textContent)">📤 Send plan to team</button>
        <button class="btn good" onclick="savePlan()">✓ Agreed, save swaps</button></div>`;
    $('sheet').innerHTML = h;
}
function planText(days, pick, byWho) {
    let t = `Duty cover plan: ${pname(P.who)} on leave ${pretty(P.from)} – ${pretty(P.to)}${P.note ? ' (' + P.note + ')' : ''}\n`;
    days.forEach(k => t += `• ${pretty(k)} (${t12(S.shiftStart)}, 24h): ${pname(pick(k))} instead of ${pname(P.who)}\n`);
    return t + `${pname(P.who)} will owe: ` + Object.entries(byWho).map(([id, s]) => `${pname(id)} ${plural(s.size, 'duty')}`).join(', ');
}
function savePlan() {
    const days = plannerDays(), g = 'g' + Date.now().toString(36);
    days.forEach(k => { const c = P.mode === 'one' ? P.one : P.assign[k]; if (c) S.swaps[k + '|' + P.who] = { date: k, orig: P.who, cover: c, note: P.note || 'Leave cover for ' + pname(P.who), settled: false, group: g }; });
    save(); closeSheet(); toast(plural(days.length, 'swap') + ' saved'); setTab('swaps');
}

}

function moveLog(n) { logM += n; if (logM < 0) { logM = 11; logY--; } if (logM > 11) { logM = 0; logY++; } render(); }
function exportCSV() {

    const rows = [['Date', 'Day', 'On duty', 'Change at ' + t12(S.shiftStart), 'Swaps', 'Me on duty', 'Completed', 'Posting', 'Note']];

    }

}
function download(name, text, type) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

            <button class="btn sm bad" onclick="removePerson('${p.id}')">✕</button></div>`;
    });
    h += `<div class="row" style="margin-top:10px"><button class="btn sm ghost" onclick="addPerson()">+ Add APO</button></div>
        <label class="f">Who are you?</label><select onchange="S.me=this.value;save();render()">${S.team.map(p => `<option value="${p.id}" ${p.id === S.me ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>`;

    h += `<div class="card"><h2>2 · A known date</h2><p class="muted" style="margin-top:0">One date you're sure about. Everything else is worked out from it.</p>
        <label class="f">On this date…</label><input type="date" id="anDate" value="${S.anchor.date}">
        <div class="two"><div><label class="f">…this APO</label><select id="anWho">${S.team.map(p => `<option value="${p.id}" ${p.id === S.anchor.who ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
        <div><label class="f">was on their</label><select id="anDay">${Array.from({ length: S.perTurn }, (_, i) => `<option value="${i + 1}" ${S.anchor.day === i + 1 ? 'selected' : ''}>${i === 0 ? '1st day (came in)' : ['2nd', '3rd', '4th', '5th', '6th'][i - 1] + ' day'}</option>`).join('')}</select></div></div>
        <div class="two"><div><label class="f">Change time</label><input type="time" id="shStart" value="${S.shiftStart}"></div>
        <div><label class="f">Days on per turn</label><input type="number" id="perTurn" min="1" max="${n - 1}" value="${S.perTurn}"></div></div>
        <p class="muted">${n} APOs: each does <b>${S.perTurn} days on, ${n - S.perTurn} days off</b>. <b>${S.perTurn} APOs on duty</b> at a time, and one change every day at ${t12(S.shiftStart)}.</p>
        <button class="btn block" onclick="saveRotation()">Save</button></div>`;

    h += `<div class="card"><h2>3 · Posting</h2><label class="f">Current posting / sector</label>
        <input type="text" value="${esc(S.posting)}" onchange="S.posting=this.value.trim()||S.posting;save();render();toast('Saved')">
        <p class="muted">Saved with each duty you log, so you keep a record if your posting changes.</p></div>`;

    h += `<div class="card"><h2>4 · Reminders</h2><p class="muted" style="margin-top:0">Add your duties for the next 6 months to your phone calendar. It reminds you the evening before (12h) and 1 hour before each turn.</p>
        <button class="btn ghost block" onclick="exportICS()">📅 Add my duties to phone calendar</button>
        <p class="muted">If swaps change your duties, add them again.</p></div>`;

    h += `<div class="card"><h2>5 · Backup</h2><p class="muted" style="margin-top:0">Data is saved on this phone only.</p>
        <div class="row"><button class="btn ghost" onclick="backup()">⬇ Download backup</button>
        <label class="btn ghost">⬆ Restore<input type="file" accept=".json" class="hidden" onchange="restore(this.files[0])"></label></div>
        <div class="row" style="margin-top:10px"><button class="btn sm bad" onclick="resetAll()">Erase everything</button></div></div>`;
    $('v-setup').innerHTML = h;
}
function renamePerson(id, v) { v = v.trim(); if (!v) return; person(id).name = v; save(); toast('Saved'); render(); }
function movePerson(i, d) { const t = S.team, j = i + d; [t[i], t[j]] = [t[j], t[i]]; save(); render(); }
function addPerson() {
    const name = prompt('Name of the APO'); if (!name || !name.trim()) return;
    const used = S.team.map(p => p.color);
    S.team.push({ id: 'p' + Date.now().toString(36), name: name.trim(), color: COLORS.find(c => !used.includes(c)) || COLORS[S.team.length % COLORS.length] });
    save(); render();
}
function removePerson(id) {
    if (S.team.length <= S.perTurn + 1) { toast('Too few APOs for ' + S.perTurn + '-day turns'); return; }
    if (!confirm('Remove ' + pname(id) + ' from the rotation? Dates for everyone will shift.')) return;
    S.team = S.team.filter(p => p.id !== id);
    if (S.me === id) S.me = S.team[0].id;
    if (S.anchor.who === id) S.anchor.who = S.team[0].id;
    save(); render();
}
function saveRotation() {
    const pt = Math.max(1, Math.min(S.team.length - 1, parseInt($('perTurn').value) || 2));
    S.anchor = { date: $('anDate').value || S.anchor.date, who: $('anWho').value, day: Math.min(pt, parseInt($('anDay').value) || 1) };
    S.shiftStart = $('shStart').value || '09:00'; S.perTurn = pt;
    const stale = Object.values(S.swaps).filter(sw => !isScheduled(sw.orig, sw.date)).length;
    save(); toast('Rotation saved ✓'); render();
    if (stale) alert(stale + ' saved swap(s) no longer match the rotation. Check them in the Swaps tab.');
}
function icsDate(d) { return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00'; }
function exportICS() {
    const cur = currentDutyDate(), ev = [];
    let i = 0;
    while (i < 183) {
        const k = addDays(cur, i);
        if (!isOn(S.me, k)) { i++; continue; }
        const end = stretchEnd(S.me, k), len = dayDiff(k, end) + 1;
        ev.push(['BEGIN:VEVENT', 'UID:apo-' + k + '@duty', 'DTSTAMP:' + icsDate(new Date()), 'DTSTART:' + icsDate(dutyStart(k)), 'DTEND:' + icsDate(dutyStart(addDays(end, 1))),
            'SUMMARY:APO duty (' + len * 24 + 'h)', 'LOCATION:' + S.posting,
            'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Duty tomorrow', 'TRIGGER:-PT12H', 'END:VALARM',
            'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Duty in 1 hour', 'TRIGGER:-PT1H', 'END:VALARM', 'END:VEVENT'].join('\r\n'));
        i += len;
    }
    download('my-apo-duties.ics', ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//LifeGame//APO Duty//EN', ...ev, 'END:VCALENDAR'].join('\r\n'), 'text/calendar');
    toast(plural(ev.length, 'turn') + ' exported');
}
function backup() { download('apo-duty-backup-' + ymd(new Date()) + '.json', JSON.stringify(S, null, 2), 'application/json'); }
function restore(file) {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!Array.isArray(d.team)) throw 0; S = Object.assign(defaults(), d); save(); toast('Restored ✓'); render(); } catch (e) { toast('Not a valid backup'); } };
    r.readAsText(file);
}
function resetAll() { if (!confirm('Erase rotation, swaps and logs?')) return; S = defaults(); save(); render(); }

/* ---------- init ---------- */
load();
const _n = new Date(); calY = logY = _n.getFullYear(); calM = logM = _n.getMonth();
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
$('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeSheet(); });
render();
setInterval(() => { if (tab === 'home' && !$('overlay').classList.contains('open')) renderHome(); }, 30000);
</script>
</body>
