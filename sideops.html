<body>

<div class="app">

    <div class="header">
        <a class="backLink" href="index.html">&larr; BACK TO LIFE RPG</a>
        <div class="logo">MINDJACK.9 // PENDING OPS QUEUE</div>
        <div class="title">Side Ops</div>
        <div class="subtitle">Loose ends. Adjust the payout, clear the queue.</div>
    </div>

    <div id="content"></div>

</div>

<script>

const TIER_SCORE_STEP = 5000;
const TIER_COUNT = 8;
const DIVA_SCORE_REQUIREMENT = 15000;
const COLLECTIBLE_IDS = [
    "warrior", "samurai", "pirate", "fighter", "ninja",
    // five slots held open for artwork still to come; see
    // COLLECTIBLE_META in vault.html to fill one in
    "card06", "card07", "card08", "card09", "card10"
];
const COLLECTIBLE_CREDITS_STEP = 1000;

function ensureCollectiblesOrder() {

    const known = Array.isArray(game.collectiblesOrder) ? game.collectiblesOrder : [];

    // keep the order already drawn, minus anything retired from the set
    const kept = known.filter(id => COLLECTIBLE_IDS.indexOf(id) !== -1);

    // shuffle in whatever is new, so added cards land in a random slot
    const fresh = COLLECTIBLE_IDS.filter(id => kept.indexOf(id) === -1);
    for (let i = fresh.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = fresh[i];
        fresh[i] = fresh[j];
        fresh[j] = temp;
    }

    game.collectiblesOrder = kept.concat(fresh);

}

function loadGame() {
    const raw = localStorage.getItem("mindjack9");
    return raw ? JSON.parse(raw) : null;
}

function saveGame(game) {
    localStorage.setItem("mindjack9", JSON.stringify(game));
}

let game = loadGame();

const content = document.getElementById("content");


if (!game) {

    content.innerHTML = `
        <div class="emptyState">
            NO DATA YET.<br><br>
            Play a bit on the <a href="index.html">Life RPG</a> page first,
            then come back to manage your side ops.
        </div>
    `;

} else {

    if (!Array.isArray(game.sideOps)) {
        game.sideOps = [];
    }


    function refreshGame() {

        const latest = loadGame();

        if (latest) {
            game = latest;
        }

        if (!Array.isArray(game.sideOps)) {
            game.sideOps = [];
        }

    }


    function addSideOp() {

        refreshGame();

        const textInput = document.getElementById("newSideOpText");
        const pointsInput = document.getElementById("newSideOpPoints");

        const text = textInput.value.trim();
        const rawPoints = parseInt(pointsInput.value, 10);
        const points = (!rawPoints || rawPoints < 1) ? 1 : rawPoints;

        if (!text) {
            textInput.focus();
            return;
        }

        game.sideOps.push({
            id: "sideop_" + Date.now(),
            text: text,
            points: points
        });

        saveGame(game);
        render();

    }


    function updateSideOpPoints(id, value) {

        refreshGame();

        const op = game.sideOps.find(o => o.id === id);
        if (!op) return;

        const points = parseInt(value, 10);
        op.points = (!points || points < 1) ? 1 : points;

        saveGame(game);

    }


    function completeSideOp(id) {

        refreshGame();

        const op = game.sideOps.find(o => o.id === id);
        if (!op) return;

        game.sideOps = game.sideOps.filter(o => o.id !== id);

        game.totalScore = (game.totalScore || 0) + op.points;
        game.coins = (game.coins || 0) + op.points;
        game.creditsEarned = (game.creditsEarned || 0) + op.points;

        const newTierIndex = Math.min(Math.floor(game.totalScore / TIER_SCORE_STEP), TIER_COUNT - 1);
        if (newTierIndex > (game.tierIndex || 0)) {
            game.tierIndex = newTierIndex;
        }

        if (!game.divaUnlocked && game.totalScore >= DIVA_SCORE_REQUIREMENT) {
            game.divaUnlocked = true;
        }

        ensureCollectiblesOrder();
        const newUnlockedCount = Math.min(COLLECTIBLE_IDS.length, Math.floor(game.creditsEarned / COLLECTIBLE_CREDITS_STEP));
        if (newUnlockedCount > (game.collectiblesUnlockedCount || 0)) {
            game.collectiblesUnlockedCount = newUnlockedCount;
        }

        saveGame(game);
        render();

    }


    function deleteSideOp(id) {

        refreshGame();

        game.sideOps = game.sideOps.filter(o => o.id !== id);

        saveGame(game);
        render();

    }


    function renderOpsList() {

        if (game.sideOps.length === 0) {
            return `<div class="sideOpsEmpty">No pending ops. Add one below.</div>`;
        }

        return game.sideOps.map(op => `
            <div class="sideOp">
                <div class="sideOpText">${op.text}</div>
                <div class="sideOpRow">
                    <div class="sideOpPointsWrap">
                        <input
                            type="number"
                            class="sideOpPoints"
                            value="${op.points}"
                            min="1"
                            onchange="updateSideOpPoints('${op.id}', this.value)"
                        >
                        <span class="sideOpPointsLabel">PTS</span>
                    </div>
                    <button class="sideOpCompleteBtn" onclick="completeSideOp('${op.id}')">✓ DONE</button>
                    <button class="sideOpDeleteBtn" onclick="deleteSideOp('${op.id}')">✕</button>
                </div>
            </div>
        `).join("");

    }


    function render() {

        content.innerHTML = `
            <div class="section">
                <div id="opsContainer">${renderOpsList()}</div>

                <div class="addForm">
                    <input type="text" id="newSideOpText" placeholder="What needs doing?" maxlength="60">
                    <input type="number" id="newSideOpPoints" placeholder="Points" min="1" value="20">
                </div>

                <button class="addOpBtn" onclick="addSideOp()">+ ADD SIDE OP</button>
            </div>
        `;

    }


    // expose functions used by inline onclick/onchange handlers
    window.addSideOp = addSideOp;
    window.updateSideOpPoints = updateSideOpPoints;
    window.completeSideOp = completeSideOp;
    window.deleteSideOp = deleteSideOp;

    render();

}

</script>

</body>
</html>
