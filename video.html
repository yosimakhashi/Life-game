<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<title>Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --card: #1a1a1a;
    --fg: #f2f2f2;
    --muted: #9a9a9a;
    --line: #3a3a3a;
    --accent: #e0a15a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: Outfit, ui-sans-serif, system-ui, sans-serif; }
  button, a { font: inherit; color: inherit; touch-action: manipulation; }
  a { text-decoration: none; }
  main { max-width: 40rem; margin: 0 auto; padding: 1rem 1rem 2rem; }
  .back { display: inline-flex; align-items: center; min-height: 2.75rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.75rem; }
  h1 { margin: 0.2rem 0 0.35rem; font-size: 1.8rem; font-weight: 500; }
  .hint { margin: 0 0 1rem; color: var(--muted); font-size: 0.9rem; line-height: 1.4; }
  .stage {
    background: #000;
    border: 1px solid var(--line);
    border-radius: 0.9rem;
    overflow: hidden;
    min-height: 12rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  video { width: 100%; height: auto; max-height: 70vh; display: block; background: #000; }
  .empty { color: var(--muted); padding: 2rem 1rem; text-align: center; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.85rem; }
  .btn {
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 2.75rem;
    padding: 0 1rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--fg);
  }
  .btn input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    font-size: 16px;
  }
  .btn.full { border-color: var(--accent); color: var(--accent); }
  .btn.danger { color: #f0b4a8; }
  .name { margin: 0.7rem 0 0; color: var(--muted); font-size: 0.85rem; word-break: break-word; }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">&larr; Home</a>
  <h1>Video</h1>
  <p class="hint" id="hint">Upload a video from this phone. It stays on this phone. Full screen plays it large.</p>
  <div class="stage" id="stage">
    <p class="empty" id="empty">No video yet</p>
    <video id="player" playsinline controls hidden></video>
  </div>
  <p class="name" id="name" hidden></p>
  <div class="actions">
    <label class="btn" id="pick"><span id="pickLabel">Upload</span>
      <input id="file" type="file" accept="video/*">
    </label>
    <button class="btn full" id="full" type="button" hidden>Full screen</button>
    <button class="btn danger" id="remove" type="button" hidden>Delete</button>
  </div>
</main>
<script>
const file = document.getElementById("file");
const player = document.getElementById("player");
const empty = document.getElementById("empty");
const pickLabel = document.getElementById("pickLabel");
const full = document.getElementById("full");
const remove = document.getElementById("remove");
const nameEl = document.getElementById("name");
const hint = document.getElementById("hint");
let url = "";

function db() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("life-video", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("videos");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveVideo(blob, name) {
  const database = await db();
  await new Promise((resolve, reject) => {
    const tx = database.transaction("videos", "readwrite");
    tx.objectStore("videos").put({ blob, name }, "current");
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

async function loadVideo() {
  const database = await db();
  return new Promise((resolve, reject) => {
    const tx = database.transaction("videos", "readonly");
    const req = tx.objectStore("videos").get("current");
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function clearVideo() {
  const database = await db();
  await new Promise((resolve, reject) => {
    const tx = database.transaction("videos", "readwrite");
    tx.objectStore("videos").delete("current");
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

function show(blob, name) {
  if (url) URL.revokeObjectURL(url);
  url = blob ? URL.createObjectURL(blob) : "";
  player.hidden = !blob;
  empty.hidden = !!blob;
  full.hidden = !blob;
  remove.hidden = !blob;
  nameEl.hidden = !blob;
  pickLabel.textContent = blob ? "Change" : "Upload";
  if (!blob) {
    player.removeAttribute("src");
    player.load();
    nameEl.textContent = "";
    return;
  }
  player.src = url;
  nameEl.textContent = name || "Video";
}

file.addEventListener("change", async () => {
  const chosen = file.files && file.files[0];
  file.value = "";
  if (!chosen) return;
  if (chosen.type && !chosen.type.startsWith("video/")) {
    hint.textContent = "That file isn’t a video.";
    return;
  }
  try {
    await saveVideo(chosen, chosen.name);
    show(chosen, chosen.name);
    hint.textContent = "Saved on this phone. Tap play, or Full screen.";
  } catch (err) {
    hint.textContent = "Couldn’t save that video. Try a shorter one.";
  }
});

player.addEventListener("error", () => {
  if (!player.getAttribute("src")) return;
  hint.textContent = "This phone couldn’t play that video. Try another one.";
});

full.addEventListener("click", () => {
  if (player.webkitEnterFullscreen) {
    player.webkitEnterFullscreen();
    return;
  }
  const ask = player.requestFullscreen || player.webkitRequestFullscreen;
  if (ask) ask.call(player);
});

remove.addEventListener("click", async () => {
  try { await clearVideo(); } catch (err) {}
  show(null);
  hint.textContent = "Video deleted from this phone.";
});

loadVideo().then((saved) => {
  if (saved && saved.blob) show(saved.blob, saved.name);
}).catch(() => {
  hint.textContent = "Video storage isn’t available in this browser.";
});
</script>
</body>
</html>
