<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE PLAN | MINDJACK.9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --myth-bg: #0d1026;
    --myth-panel: #171b36;
    --myth-panel-alt: #1d2240;
    --myth-input: #11142c;
    --myth-border: #353a63;
    --myth-gold: #c9a227;
    --myth-gold-dim: #8a6a3b;
    --myth-ember: #c2703a;
    --myth-violet: #a288d9;
    --myth-text: #e8e2d4;
    --myth-dim: #8d92b5;
}

body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--myth-bg);
    background-image:
        radial-gradient(ellipse at 50% 0%, rgba(201, 162, 39, 0.16), transparent 55%),
        radial-gradient(ellipse at 15% 85%, rgba(162, 136, 217, 0.16), transparent 50%),
        linear-gradient(180deg, #141936 0%, #0d1026 55%, #070914 100%);
    background-attachment: fixed;
    color: var(--myth-text);
    font-family: 'Spectral', Georgia, serif;
}

/* film grain */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.5;
    background-image:
        radial-gradient(1px 1px at 12% 18%, rgba(232, 226, 212, 0.9), transparent),
        radial-gradient(1px 1px at 78% 9%, rgba(232, 226, 212, 0.7), transparent),
        radial-gradient(1.4px 1.4px at 33% 44%, rgba(201, 162, 39, 0.8), transparent),
        radial-gradient(1px 1px at 88% 62%, rgba(232, 226, 212, 0.65), transparent),
        radial-gradient(1px 1px at 55% 77%, rgba(232, 226, 212, 0.6), transparent),
        radial-gradient(1.2px 1.2px at 22% 91%, rgba(162, 136, 217, 0.8), transparent),
        radial-gradient(1px 1px at 66% 31%, rgba(232, 226, 212, 0.55), transparent);
}

/* vignette */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(4, 6, 16, 0.85) 100%);
}

.app {
    position: relative;
    z-index: 2;
    max-width: 600px;
    margin: auto;
    padding: 18px;
    padding-bottom: 60px;
}

.header {
    border: 1px solid var(--myth-border);
    border-left: 3px solid var(--myth-violet);
    background: var(--myth-panel);
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.6);
}

.backLink {
    display: inline-block;
    color: var(--myth-dim);
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
}

.backLink:active {
    color: var(--myth-gold);
}

.logo {
    font-size: 11px;
    letter-spacing: 5px;
    color: var(--myth-gold-dim);
    text-transform: uppercase;
}

.title {
    font-family: 'Cinzel', serif;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 4px;
    margin-top: 6px;
    text-transform: uppercase;
    color: var(--myth-text);
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.8), 0 0 30px rgba(156, 175, 136, 0.15);
}

.subtitle {
    color: var(--myth-dim);
    font-size: 12px;
    margin-top: 8px;
    line-height: 1.6;
    letter-spacing: 1px;
}

.rule {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--myth-border);
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--myth-violet);
}

/* ADD FORM */

.addForm {
    background: var(--myth-panel);
    border: 1px solid var(--myth-border);
    padding: 15px;
    margin-bottom: 20px;
}

.addForm input {
    width: 100%;
    box-sizing: border-box;
    background: var(--myth-input);
    border: 1px solid var(--myth-border);
    padding: 12px;
    color: var(--myth-text);
    font-size: 14px;
    margin-bottom: 8px;
    font-family: 'Spectral', Georgia, serif;
}

.addForm input:focus {
    outline: none;
    border-color: var(--myth-gold);
}

.dateRow {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: center;
}

.dayChips {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
}

.dayChip {
    flex: 1;
    padding: 8px;
    background: transparent;
    border: 1px solid var(--myth-border);
    color: var(--myth-dim);
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.dayChip.active {
    border-color: var(--myth-gold);
    color: var(--myth-gold);
    background: rgba(156, 175, 136, 0.08);
}

.addBtn {
    width: 100%;
    margin-top: 6px;
    padding: 13px;
    background: transparent;
    border: 1px solid var(--myth-violet);
    color: var(--myth-violet);
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.addBtn:active {
    transform: scale(0.99);
    background: rgba(217, 143, 154, 0.1);
}

/* SECTIONS */

.section {
    margin-bottom: 22px;
}

.sectionTitle {
    font-family: 'Cinzel', serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--myth-gold);
    padding-bottom: 8px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--myth-border);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
}

.sectionCount {
    font-family: 'Spectral', Georgia, serif;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--myth-dim);
}

.section.overdue .sectionTitle {
    color: var(--myth-ember);
}

/* TASK */

.task {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--myth-panel);
    border: 1px solid var(--myth-border);
    padding: 13px;
    margin-bottom: 8px;
}

.task.done {
    opacity: 0.55;
    border-color: #23291e;
}

.checkbox {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border: 1px solid var(--myth-gold-dim);
    background: transparent;
    color: var(--myth-gold);
    font-size: 14px;
    line-height: 1;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.task.done .checkbox {
    border-color: var(--myth-gold);
    background: rgba(156, 175, 136, 0.15);
}

.checkbox:active {
    transform: scale(0.9);
}

.taskBody {
    flex: 1;
    min-width: 0;
}

.taskText {
    font-size: 14px;
    color: var(--myth-text);
    word-break: break-word;
    line-height: 1.4;
}

.task.done .taskText {
    text-decoration: line-through;
    color: var(--myth-dim);
}

.taskMeta {
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--myth-dim);
    margin-top: 4px;
    text-transform: uppercase;
}

.taskMeta .earned {
    color: var(--myth-gold);
}

.taskMeta .late {
    color: var(--myth-ember);
}

.taskDelete {
    flex-shrink: 0;
    background: transparent;
    border: 0;
    color: var(--myth-dim);
    font-size: 14px;
    padding: 0 2px;
}

.taskDelete:active {
    color: var(--myth-violet);
}

.emptyNote {
    color: var(--myth-dim);
    font-size: 12px;
    padding: 10px 0;
    letter-spacing: 1px;
}

.emptyState {
    text-align: center;
    padding: 50px 20px;
    color: var(--myth-dim);
    font-size: 13px;
    line-height: 1.8;
    letter-spacing: 1px;
}

.emptyState a {
    color: var(--myth-gold);
}

/* PERSONALITY TRAITS */

.section.traits .sectionTitle {
    color: var(--myth-violet);
}

.traitFilter {
    width: 100%;
    box-sizing: border-box;
    background: var(--myth-input);
    border: 1px solid var(--myth-border);
    padding: 10px 12px;
    color: var(--myth-text);
    font-size: 13px;
    font-family: 'Spectral', Georgia, serif;
    margin-bottom: 14px;
}

.traitFilter:focus {
    outline: none;
    border-color: var(--myth-gold);
}

.traitGroup {
    margin-bottom: 16px;
}

.traitGroupName {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--myth-gold-dim);
    margin-bottom: 7px;
}

.traitRow {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--myth-panel);
    border: 1px solid var(--myth-border);
    border-left: 2px solid transparent;
    padding: 9px 11px;
    margin-bottom: 5px;
}

.traitRow.gained {
    border-left-color: var(--myth-gold);
}

.traitIcon {
    flex-shrink: 0;
    font-size: 15px;
    width: 20px;
    text-align: center;
}

.traitName {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    color: var(--myth-text);
}

.traitScore {
    flex-shrink: 0;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--myth-dim);
    text-transform: uppercase;
}

.traitRow.gained .traitScore b {
    color: var(--myth-gold);
}

.traitPlus {
    flex-shrink: 0;
    min-width: 44px;
    background: transparent;
    border: 1px solid var(--myth-violet);
    color: var(--myth-violet);
    padding: 7px 9px;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 1px;
}

.traitPlus:active {
    transform: scale(0.94);
    background: rgba(217, 143, 154, 0.12);
}


/* MYTHIC FIGURE BACKDROP */

.figure {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 0;
    pointer-events: none;
    opacity: 0.42;
}

.figure svg {
    /* sized off the shorter axis so the whole silhouette stays on screen,
       wings and all, on a phone as well as a desktop */
    height: min(94vh, 125vw, 900px);
    width: auto;
    display: block;
}

</style>
</head>

<script>

const TASK_POINTS = 10;

const TIER_SCORE_STEP = 5000;
const TIER_COUNT = 8;
const DIVA_SCORE_REQUIREMENT = 15000;


function toDateString(d) {
    return d.getFullYear() +
        "-" + String(d.getMonth() + 1).padStart(2, "0") +
        "-" + String(d.getDate()).padStart(2, "0");
}

function today() {
    return toDateString(new Date());
}

function tomorrow() {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    return toDateString(d);
}

function prettyDate(dateStr) {
    if (dateStr === today()) return "Today";
    if (dateStr === tomorrow()) return "Tomorrow";
    return dateStr;
}


function loadGame() {
    const raw = localStorage.getItem("mindjack9");
    return raw ? JSON.parse(raw) : null;
}

function saveGame(game) {
    localStorage.setItem("mindjack9", JSON.stringify(game));
}


let game = loadGame();

const content = document.getElementById("content");


if (!game) {

    content.innerHTML = `
        <div class="emptyState">
            NO DATA YET.<br><br>
            Play a bit on the <a href="index.html">Life RPG</a> page first,
            then come back to plan your day.
        </div>
    `;

} else {

    if (!Array.isArray(game.plannedTasks)) {
        game.plannedTasks = [];
    }

    let selectedDate = tomorrow();

    let traitFilter = "";


    // Other pages write the whole save object back too, so re-read the
    // latest state right before mutating - otherwise this page's snapshot
    // (taken at load) would clobber anything changed since, including the
    // daily mission reset.
    function refreshGame() {

        const latest = loadGame();

        if (latest) {
            game = latest;
        }

        if (!Array.isArray(game.plannedTasks)) {
            game.plannedTasks = [];
        }

    }


    function awardPoints(amount) {

        game.totalScore = Math.max(0, (game.totalScore || 0) + amount);
        game.coins = Math.max(0, (game.coins || 0) + amount);

        if (amount > 0) {
            game.creditsEarned = (game.creditsEarned || 0) + amount;
        }

        const newTierIndex = Math.min(
            Math.floor(game.totalScore / TIER_SCORE_STEP),
            TIER_COUNT - 1
        );

        if (newTierIndex > (game.tierIndex || 0)) {
            game.tierIndex = newTierIndex;
        }

        if (!game.divaUnlocked && game.totalScore >= DIVA_SCORE_REQUIREMENT) {
            game.divaUnlocked = true;
        }

    }


    function addTask() {

        refreshGame();

        const input = document.getElementById("newTaskText");
        const text = input.value.trim();

        if (!text) {
            input.focus();
            return;
        }

        game.plannedTasks.push({
            id: "task_" + Date.now(),
            text: text,
            date: selectedDate,
            done: false,
            awarded: false
        });

        saveGame(game);
        render();

    }


    function toggleTask(id) {

        refreshGame();

        const task = game.plannedTasks.find(t => t.id === id);
        if (!task) return;

        if (!task.done) {

            task.done = true;

            if (task.date === today()) {
                awardPoints(TASK_POINTS);
                task.awarded = true;
            }

        } else {

            task.done = false;

            if (task.awarded) {
                awardPoints(-TASK_POINTS);
                task.awarded = false;
            }

        }

        saveGame(game);
        render();

    }


    function deleteTask(id) {

        refreshGame();

        const task = game.plannedTasks.find(t => t.id === id);

        if (task && task.awarded) {
            awardPoints(-TASK_POINTS);
        }

        game.plannedTasks = game.plannedTasks.filter(t => t.id !== id);

        saveGame(game);
        render();

    }


    function pickDate(which) {
        selectedDate = which === "today" ? today() : tomorrow();
        render();
    }


    function taskHTML(task) {

        const isToday = task.date === today();
        const isOverdue = !task.done && task.date < today();

        let meta;

        if (task.done) {
            meta = task.awarded ?
                `<span class="earned">✓ Earned +${TASK_POINTS} pts</span>` :
                `<span class="late">Cleared - no points (off-day)</span>`;
        } else if (isToday) {
            meta = `Worth +${TASK_POINTS} pts today`;
        } else if (isOverdue) {
            meta = `<span class="late">Missed ${task.date} - no points left</span>`;
        } else {
            meta = `Scheduled ${prettyDate(task.date)} - +${TASK_POINTS} pts on the day`;
        }

        return `
            <div class="task ${task.done ? "done" : ""}">
                <button class="checkbox" onclick="toggleTask('${task.id}')">${task.done ? "✓" : ""}</button>
                <div class="taskBody">
                    <div class="taskText">${task.text}</div>
                    <div class="taskMeta">${meta}</div>
                </div>
                <button class="taskDelete" onclick="deleteTask('${task.id}')">✕</button>
            </div>
        `;

    }


    function sectionHTML(title, tasks, extraClass) {

        if (tasks.length === 0) return "";

        const doneCount = tasks.filter(t => t.done).length;

        return `
            <div class="section ${extraClass || ""}">
                <div class="sectionTitle">
                    <span>${title}</span>
                    <span class="sectionCount">${doneCount} / ${tasks.length}</span>
                </div>
                ${tasks.map(taskHTML).join("")}
            </div>
        `;

    }



    /* ---------------- PERSONALITY TRAITS ---------------- */

    const TRAIT_POINTS = 5;

    const TRAIT_GROUPS = [
        {
            name: "Drive & Discipline",
            traits: [
                { id: "discipline",   icon: "🎯", name: "Discipline" },
                { id: "grit",         icon: "🪨", name: "Grit" },
                { id: "focus",        icon: "🔍", name: "Focus" },
                { id: "consistency",  icon: "🔁", name: "Consistency" },
                { id: "patience",     icon: "⏳", name: "Patience" },
                { id: "initiative",   icon: "🚀", name: "Initiative" },
                { id: "ambition",     icon: "🧗", name: "Ambition" },
                { id: "selfcontrol",  icon: "🛑", name: "Self-Control" }
            ]
        },
        {
            name: "Courage & Confidence",
            traits: [
                { id: "courage",      icon: "🦁", name: "Courage" },
                { id: "assertiveness",icon: "📣", name: "Assertiveness" },
                { id: "confidence",   icon: "💪", name: "Confidence" },
                { id: "boldness",     icon: "⚡", name: "Boldness" },
                { id: "decisiveness", icon: "⚖️", name: "Decisiveness" },
                { id: "composure",    icon: "🧊", name: "Composure" },
                { id: "independence", icon: "🗝️", name: "Independence" },
                { id: "resilience",   icon: "🛡️", name: "Resilience" }
            ]
        },
        {
            name: "Charisma & Social",
            traits: [
                { id: "charisma",     icon: "✨", name: "Charisma" },
                { id: "charm",        icon: "🎭", name: "Charm" },
                { id: "humor",        icon: "😄", name: "Humour" },
                { id: "warmth",       icon: "🔥", name: "Warmth" },
                { id: "sociability",  icon: "🫂", name: "Sociability" },
                { id: "presence",     icon: "👑", name: "Presence" },
                { id: "persuasion",   icon: "🗣️", name: "Persuasion" },
                { id: "listening",    icon: "👂", name: "Listening" }
            ]
        },
        {
            name: "Character & Integrity",
            traits: [
                { id: "honesty",      icon: "📖", name: "Honesty" },
                { id: "integrity",    icon: "⚓", name: "Integrity" },
                { id: "loyalty",      icon: "🤝", name: "Loyalty" },
                { id: "humility",     icon: "🌱", name: "Humility" },
                { id: "accountability",icon: "🪞", name: "Accountability" },
                { id: "fairness",     icon: "⚗️", name: "Fairness" },
                { id: "reliability",  icon: "📌", name: "Reliability" },
                { id: "respect",      icon: "🎖️", name: "Respect" }
            ]
        },
        {
            name: "Heart & Empathy",
            traits: [
                { id: "empathy",      icon: "💗", name: "Empathy" },
                { id: "kindness",     icon: "🤲", name: "Kindness" },
                { id: "compassion",   icon: "🕊️", name: "Compassion" },
                { id: "generosity",   icon: "🎁", name: "Generosity" },
                { id: "forgiveness",  icon: "🌤️", name: "Forgiveness" },
                { id: "gratitude",    icon: "🙏", name: "Gratitude" },
                { id: "affection",    icon: "💞", name: "Affection" },
                { id: "service",      icon: "🧺", name: "Service" }
            ]
        },
        {
            name: "Mind & Craft",
            traits: [
                { id: "curiosity",    icon: "🔭", name: "Curiosity" },
                { id: "creativity",   icon: "🎨", name: "Creativity" },
                { id: "adaptability", icon: "🌊", name: "Adaptability" },
                { id: "resourcefulness", icon: "🧰", name: "Resourcefulness" },
                { id: "judgment",     icon: "🧠", name: "Judgement" },
                { id: "strategy",     icon: "♟️", name: "Strategy" },
                { id: "learning",     icon: "📚", name: "Learning" },
                { id: "perspective",  icon: "🌐", name: "Perspective" }
            ]
        },
        {
            name: "Spirit & Joy",
            traits: [
                { id: "optimism",     icon: "☀️", name: "Optimism" },
                { id: "calm",         icon: "🌙", name: "Calm" },
                { id: "playfulness",  icon: "🎈", name: "Playfulness" },
                { id: "zest",         icon: "🎇", name: "Zest" },
                { id: "mindfulness",  icon: "🧘", name: "Mindfulness" },
                { id: "purpose",      icon: "🧭", name: "Purpose" },
                { id: "wonder",       icon: "🌌", name: "Wonder" },
                { id: "hope",         icon: "🌈", name: "Hope" }
            ]
        }
    ];


    function ensureTraits() {

        if (typeof game.traits !== "object" || game.traits === null) {
            game.traits = {};
        }

        if (typeof game.traitsToday !== "object" || game.traitsToday === null) {
            game.traitsToday = { date: today(), gains: {} };
        }

        // today's tally is per-day; roll it over when the date changes.
        // Persist immediately, otherwise the stale tally sits in storage
        // until the next write and other pages would read it as current.
        if (game.traitsToday.date !== today()) {
            game.traitsToday = { date: today(), gains: {} };
            saveGame(game);
        }

        if (typeof game.traitsToday.gains !== "object" || game.traitsToday.gains === null) {
            game.traitsToday.gains = {};
        }

    }


    function addTraitPoint(id) {

        refreshGame();
        ensureTraits();

        game.traits[id] = (game.traits[id] || 0) + TRAIT_POINTS;
        game.traitsToday.gains[id] = (game.traitsToday.gains[id] || 0) + TRAIT_POINTS;

        saveGame(game);
        render();

    }


    function traitsHTML() {

        ensureTraits();

        const gains = game.traitsToday.gains;

        const todayTotal = Object.keys(gains)
            .reduce((sum, k) => sum + gains[k], 0);

        const touched = Object.keys(gains).length;

        const groups = TRAIT_GROUPS.map(group => `
            <div class="traitGroup">
                <div class="traitGroupName">${group.name}</div>
                ${group.traits.map(tr => {
                    const gained = gains[tr.id] || 0;
                    const total = game.traits[tr.id] || 0;
                    return `
                        <div class="traitRow ${gained ? "gained" : ""}" data-name="${tr.name.toLowerCase()}">
                            <span class="traitIcon">${tr.icon}</span>
                            <span class="traitName">${tr.name}</span>
                            <span class="traitScore">${gained ? `<b>+${gained}</b> today · ` : ""}${total} total</span>
                            <button class="traitPlus" onclick="addTraitPoint('${tr.id}')">+${TRAIT_POINTS}</button>
                        </div>
                    `;
                }).join("")}
            </div>
        `).join("");

        return `
            <div class="section traits">

                <div class="sectionTitle">
                    <span>Personality</span>
                    <span class="sectionCount">${todayTotal ? "+" + todayTotal + " today across " + touched : "nothing yet today"}</span>
                </div>

                <input type="text" id="traitFilter" class="traitFilter" placeholder="Filter traits...">

                ${groups}

            </div>
        `;

    }


    function wireTraitFilter() {

        const box = document.getElementById("traitFilter");
        if (!box) return;

        box.value = traitFilter;

        box.addEventListener("input", function () {

            traitFilter = box.value.trim().toLowerCase();

            document.querySelectorAll(".traitRow").forEach(row => {
                const match = !traitFilter || row.dataset.name.indexOf(traitFilter) !== -1;
                row.style.display = match ? "" : "none";
            });

            document.querySelectorAll(".traitGroup").forEach(g => {
                const anyVisible = Array.from(g.querySelectorAll(".traitRow"))
                    .some(r => r.style.display !== "none");
                g.style.display = anyVisible ? "" : "none";
            });

        });

    }


    function render() {

        const t = today();
        const tm = tomorrow();

        const overdue = game.plannedTasks.filter(x => !x.done && x.date < t);
        const todays = game.plannedTasks.filter(x => x.date === t);
        const tomorrows = game.plannedTasks.filter(x => x.date === tm);
        const upcoming = game.plannedTasks.filter(x => x.date > tm);
        const pastDone = game.plannedTasks.filter(x => x.done && x.date < t);

        const anyTasks = game.plannedTasks.length > 0;

        content.innerHTML = `

            <div class="addForm">

                <input type="text" id="newTaskText" placeholder="What are you doing about it?" maxlength="80">

                <div class="dayChips">
                    <button class="dayChip ${selectedDate === t ? "active" : ""}" onclick="pickDate('today')">Today</button>
                    <button class="dayChip ${selectedDate === tm ? "active" : ""}" onclick="pickDate('tomorrow')">Tomorrow</button>
                </div>

                <button class="addBtn" onclick="addTask()">Add to the plan</button>

            </div>

            ${sectionHTML("Overdue", overdue, "overdue")}
            ${sectionHTML("Today", todays)}
            ${sectionHTML("Tomorrow", tomorrows)}
            ${sectionHTML("Upcoming", upcoming)}
            ${sectionHTML("Done & gone", pastDone)}

            ${anyTasks ? "" : `<div class="emptyNote">Nothing scheduled. Write the first line above.</div>`}

            ${traitsHTML()}

        `;

        wireTraitFilter();

    }


    window.addTask = addTask;
    window.toggleTask = toggleTask;
    window.deleteTask = deleteTask;
    window.pickDate = pickDate;
    window.addTraitPoint = addTraitPoint;

    render();

}

</script>
