<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>App removed</title>
<style>
:root { --bg: #140f1f; --fg: #f6efe3; --dim: #b3a8c7; }
@media (prefers-color-scheme: light) { :root { --bg: #fbf6ec; --fg: #2a2135; --dim: #6f6580; } }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { display: grid; place-items: center; padding: 16px; box-sizing: border-box; font-family: system-ui, sans-serif; text-align: center; }
p { color: var(--dim); max-width: 32ch; }
</style>
</head>
<body>
<div>
    <h1>This app is no longer available.</h1>
    <p>You can remove it from your home screen.</p>
</div>
<script>
// Remove the old offline copy of the app if it is still installed.
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => regs
        .filter(r => r.scope.includes('/padana-deepam/'))
        .forEach(r => r.update().catch(() => r.unregister())));
}
</script>
</body>
</html>
